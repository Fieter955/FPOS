<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Pelanggan - FPOS</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="app-container">
      <main class="main-content">
        <button
          class="btn"
          style="
            background: transparent;
            color: var(--text-muted);
            padding: 0;
            margin-bottom: 16px;
          "
          onclick="location.href = '/dashboard'"
        >
          ← Kembali
        </button>

        <div class="pg-header">
          <div>
            <h1>👥 Data Pelanggan</h1>
            <p>Kelola member, poin loyalitas, dan grup diskon.</p>
          </div>
          <div style="display: flex; gap: 10px">
            <button
              class="btn"
              style="
                background: var(--bg-color);
                border: 1px solid var(--border-color);
                color: var(--text-main);
              "
              onclick="switchTab('grup')"
            >
              🎯 Grup Diskon
            </button>
            <button class="btn btn-primary" onclick="openModal('mPelanggan')">
              ➕ Tambah Pelanggan
            </button>
          </div>
        </div>

        <!-- Tab buttons -->
        <div style="display: flex; gap: 8px; margin-bottom: 20px">
          <button
            id="tbCust"
            onclick="switchTab('cust')"
            style="
              padding: 8px 20px;
              border-radius: 100px;
              border: 2px solid var(--primary);
              background: var(--primary);
              color: #fff;
              font-weight: 700;
              cursor: pointer;
              font-family: inherit;
            "
          >
            Pelanggan
          </button>
          <button
            id="tbGrup"
            onclick="switchTab('grup')"
            style="
              padding: 8px 20px;
              border-radius: 100px;
              border: 2px solid var(--border-color);
              background: transparent;
              color: var(--text-muted);
              font-weight: 700;
              cursor: pointer;
              font-family: inherit;
            "
          >
            Grup Diskon
          </button>
        </div>

        <!-- Panel Pelanggan -->
        <div id="pnlCust">
          <div class="filter-bar">
            <input
              id="srchCust"
              type="text"
              class="input-control"
              placeholder="🔍 Cari nama / telepon..."
              oninput="loadCust()"
            />
          </div>
          <div class="tbl-wrap">
            <table class="tbl">
              <thead>
                <tr>
                  <th>Nama</th>
                  <th>Telepon</th>
                  <th>Grup Diskon</th>
                  <th>Deposit</th>
                  <th>Poin</th>
                  <th>Total Beli</th>
                  <th>Aksi</th>
                </tr>
              </thead>
              <tbody id="tblCust"></tbody>
            </table>
          </div>
        </div>

        <!-- Panel Grup -->
        <div id="pnlGrup" style="display: none">
          <div
            style="
              display: flex;
              justify-content: flex-end;
              margin-bottom: 14px;
            "
          >
            <button class="btn btn-primary" onclick="openModal('mGrup')">
              ➕ Tambah Grup
            </button>
          </div>
          <div class="tbl-wrap">
            <table class="tbl">
              <thead>
                <tr>
                  <th>Nama Grup</th>
                  <th>Diskon (%)</th>
                  <th>Jumlah Member</th>
                  <th>Aksi</th>
                </tr>
              </thead>
              <tbody id="tblGrup"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>

    <!-- Modal: Pelanggan -->
    <div class="modal-overlay" id="mPelanggan">
      <div class="modal-box">
        <div class="modal-hdr">
          <h2 id="mCustTitle">Tambah Pelanggan</h2>
          <button class="btn-x" onclick="closeModal('mPelanggan')">×</button>
        </div>
        <input type="hidden" id="cId" />
        <div class="input-group">
          <label>Nama *</label
          ><input
            id="cNama"
            class="input-control"
            placeholder="Nama lengkap pelanggan"
          />
        </div>
        <div class="row2" style="margin-bottom: 16px">
          <div class="input-group">
            <label>Telepon / WA</label
            ><input
              id="cPhone"
              class="input-control"
              inputmode="tel"
              placeholder="08xxxxxxxxxx"
            />
          </div>
          <div class="input-group">
            <label>Email</label
            ><input
              id="cEmail"
              class="input-control"
              type="email"
              placeholder="email@contoh.com"
            />
          </div>
        </div>
        <div class="input-group">
          <label>Alamat</label
          ><textarea
            id="cAlamat"
            class="input-control"
            rows="2"
            placeholder="Alamat lengkap pelanggan"
          ></textarea>
        </div>
        <div class="input-group">
          <label>Grup Diskon</label
          ><select id="cGrup" class="input-control">
            <option value="">-- Tidak ada --</option>
          </select>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px">
          <button
            onclick="closeModal('mPelanggan')"
            class="btn"
            style="
              background: var(--bg-color);
              border: 1px solid var(--border-color);
              color: var(--text-main);
            "
          >
            Batal
          </button>
          <button onclick="saveCust()" class="btn btn-primary">✓ Simpan</button>
        </div>
      </div>
    </div>

    <!-- Modal: Grup -->
    <div class="modal-overlay" id="mGrup">
      <div class="modal-box">
        <div class="modal-hdr">
          <h2 id="mGrupTitle">Tambah Grup Diskon</h2>
          <button class="btn-x" onclick="closeModal('mGrup')">×</button>
        </div>
        <input type="hidden" id="gId" />
        <div class="input-group">
          <label>Nama Grup *</label
          ><input
            id="gNama"
            class="input-control"
            placeholder="contoh: Member VIP"
          />
        </div>
        <div class="input-group">
          <label>Diskon (%)</label
          ><input
            id="gDisc"
            type="number"
            class="input-control"
            min="0"
            max="100"
            value="0"
            placeholder="0 - 100"
          />
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px">
          <button
            onclick="closeModal('mGrup')"
            class="btn"
            style="
              background: var(--bg-color);
              border: 1px solid var(--border-color);
              color: var(--text-main);
            "
          >
            Batal
          </button>
          <button onclick="saveGrup()" class="btn btn-primary">✓ Simpan</button>
        </div>
      </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/theme.js"></script>
    <script>
      requireAuth();
      let editCustId = null,
        editGrupId = null,
        curTab = "cust";

      function switchTab(t) {
        curTab = t;
        document.getElementById("pnlCust").style.display =
          t === "cust" ? "block" : "none";
        document.getElementById("pnlGrup").style.display =
          t === "grup" ? "block" : "none";
        const on =
          "padding:8px 20px;border-radius:100px;border:2px solid var(--primary);background:var(--primary);color:#fff;font-weight:700;cursor:pointer;font-family:inherit";
        const off =
          "padding:8px 20px;border-radius:100px;border:2px solid var(--border-color);background:transparent;color:var(--text-muted);font-weight:700;cursor:pointer;font-family:inherit";
        document.getElementById("tbCust").style.cssText =
          t === "cust" ? on : off;
        document.getElementById("tbGrup").style.cssText =
          t === "grup" ? on : off;
        if (t === "grup") loadGrup();
      }

      async function loadGrupSelect() {
        const groups = await api("GET", "/customers/groups");
        const sel = document.getElementById("cGrup");
        const prev = sel.value;
        sel.innerHTML =
          '<option value="">-- Tidak ada --</option>' +
          groups
            .map(
              (g) =>
                `<option value="${g.id}">${g.name} (${g.discount_percent}%)</option>`,
            )
            .join("");
        sel.value = prev;
      }

      async function loadCust() {
        const q = document.getElementById("srchCust").value;
        let url = "/customers/?limit=300";
        if (q) url += `&search=${encodeURIComponent(q)}`;
        try {
          const d = await api("GET", url);
          document.getElementById("tblCust").innerHTML = d.length
            ? d
                .map(
                  (c) => `<tr>
      <td><b>${c.name}</b></td>
      <td>${c.phone || "-"}</td>
      <td>${c.group?.name || "—"}</td>
      <td style="font-weight:700;color:var(--primary)">${fmtRp(c.deposit_balance || 0)}</td>
      <td><span style="background:var(--primary-light);color:var(--primary);padding:4px 10px;border-radius:8px;font-weight:700;font-size:13px">⭐ ${c.loyalty_points || 0}</span></td>
      <td style="font-weight:600">${fmtRp(c.total_purchase || 0)}</td>
      <td style="white-space:nowrap">
        <button class="bsm be" onclick='editCust(${JSON.stringify(c).replace(/"/g, "&quot;")})'>Edit</button>
        <button class="bsm bd" onclick="delCust(${c.id},'${c.name}')">Hapus</button>
      </td></tr>`,
                )
                .join("")
            : '<tr><td colspan="7" style="text-align:center;padding:24px;color:var(--text-muted)">Belum ada pelanggan</td></tr>';
        } catch (ex) {
          showToast(ex.message, "error");
        }
      }

      function openPelangganModal() {
        editCustId = null;
        document.getElementById("mCustTitle").textContent = "Tambah Pelanggan";
        document.getElementById("cId").value = "";
        ["cNama", "cPhone", "cEmail", "cAlamat"].forEach(
          (id) => (document.getElementById(id).value = ""),
        );
        document.getElementById("cGrup").value = "";
        loadGrupSelect();
      }
      const _origOM = openModal;
      window.openModal = function (id) {
        if (id === "mPelanggan") {
          openPelangganModal();
        }
        _origOM(id);
      };

      async function editCust(c) {
        editCustId = c.id;
        document.getElementById("mCustTitle").textContent = "Edit Pelanggan";
        document.getElementById("cId").value = c.id;
        document.getElementById("cNama").value = c.name;
        document.getElementById("cPhone").value = c.phone || "";
        document.getElementById("cEmail").value = c.email || "";
        document.getElementById("cAlamat").value = c.address || "";
        await loadGrupSelect();
        document.getElementById("cGrup").value = c.group_id || "";
        _origOM("mPelanggan");
      }

      async function saveCust() {
        const name = document.getElementById("cNama").value.trim();
        if (!name) {
          showToast("Nama wajib diisi", "error");
          return;
        }
        const data = {
          name,
          phone: document.getElementById("cPhone").value || null,
          email: document.getElementById("cEmail").value || null,
          address: document.getElementById("cAlamat").value || null,
          group_id: parseInt(document.getElementById("cGrup").value) || null,
        };
        try {
          if (editCustId) await api("PUT", `/customers/${editCustId}`, data);
          else await api("POST", "/customers/", data);
          showToast("Pelanggan disimpan ✓");
          closeModal("mPelanggan");
          loadCust();
        } catch (ex) {
          showToast(ex.message, "error");
        }
      }

      async function delCust(id, name) {
        if (!(await showConfirm(`Hapus pelanggan "${name}"?`))) return;
        try {
          await api("DELETE", `/customers/${id}`);
          showToast("Dihapus");
          loadCust();
        } catch (ex) {
          showToast(ex.message, "error");
        }
      }

      async function loadGrup() {
        const d = await api("GET", "/customers/groups");
        document.getElementById("tblGrup").innerHTML = d.length
          ? d
              .map(
                (g) => `<tr>
    <td><b>${g.name}</b></td>
    <td><span style="font-size:22px;font-weight:900;color:var(--primary)">${g.discount_percent}%</span></td>
    <td>${g.member_count || 0} orang</td>
    <td style="white-space:nowrap">
      <button class="bsm be" onclick='editGrup(${JSON.stringify(g).replace(/"/g, "&quot;")})'>Edit</button>
      <button class="bsm bd" onclick="delGrup(${g.id},'${g.name}')">Hapus</button>
    </td></tr>`,
              )
              .join("")
          : '<tr><td colspan="4" style="text-align:center;padding:24px;color:var(--text-muted)">Belum ada grup</td></tr>';
      }

      function openGrupModal() {
        editGrupId = null;
        document.getElementById("mGrupTitle").textContent =
          "Tambah Grup Diskon";
        document.getElementById("gId").value = "";
        document.getElementById("gNama").value = "";
        document.getElementById("gDisc").value = 0;
      }
      const _origOM2 = window.openModal;
      window.openModal = function (id) {
        if (id === "mGrup") {
          openGrupModal();
        }
        _origOM2(id);
      };

      async function editGrup(g) {
        editGrupId = g.id;
        document.getElementById("mGrupTitle").textContent = "Edit Grup";
        document.getElementById("gId").value = g.id;
        document.getElementById("gNama").value = g.name;
        document.getElementById("gDisc").value = g.discount_percent;
        _origOM2("mGrup");
      }

      async function saveGrup() {
        const name = document.getElementById("gNama").value.trim();
        if (!name) {
          showToast("Nama wajib diisi", "error");
          return;
        }
        const data = {
          name,
          discount_percent:
            parseFloat(document.getElementById("gDisc").value) || 0,
        };
        try {
          if (editGrupId)
            await api("PUT", `/customers/groups/${editGrupId}`, data);
          else await api("POST", "/customers/groups", data);
          showToast("Grup disimpan ✓");
          closeModal("mGrup");
          loadGrup();
          loadGrupSelect();
        } catch (ex) {
          showToast(ex.message, "error");
        }
      }

      async function delGrup(id, name) {
        if (!(await showConfirm(`Hapus grup "${name}"?`))) return;
        try {
          await api("DELETE", `/customers/groups/${id}`);
          showToast("Dihapus");
          loadGrup();
        } catch (ex) {
          showToast(ex.message, "error");
        }
      }

      loadCust();
      loadGrupSelect();
    </script>
  </body>
</html>
