<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Pembelian - iPos 5.0</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="app-container">
      <main class="main-content">
        <button
          class="btn"
          style="
            background: transparent;
            color: var(--text-muted);
            padding: 0;
            margin-bottom: 16px;
          "
          onclick="location.href = '/dashboard'"
        >
          ← Kembali
        </button>
        <div class="pg-header">
          <div>
            <h1>📥 Pembelian (Restock)</h1>
            <p>Catat pembelian barang dari supplier.</p>
          </div>
          <button class="btn btn-primary" onclick="openBuatModal()">
            ➕ Catat Pembelian
          </button>
        </div>
        <div class="filter-bar">
          <input
            id="fStart"
            type="date"
            class="input-control"
            onchange="load()"
          />
          <input
            id="fEnd"
            type="date"
            class="input-control"
            onchange="load()"
          />
          <select id="fStatus" class="input-control" onchange="load()">
            <option value="">Semua Status</option>
            <option value="unpaid">Belum Lunas</option>
            <option value="partial">Sebagian</option>
            <option value="paid">Lunas</option>
          </select>
        </div>
        <div class="tbl-wrap">
          <table class="tbl">
            <thead>
              <tr>
                <th>No. Faktur</th>
                <th>Tanggal</th>
                <th>Supplier</th>
                <th>Total</th>
                <th>Terbayar</th>
                <th>Status</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="tblBody"></tbody>
          </table>
        </div>
      </main>
    </div>

    <div class="modal-overlay" id="mBuat">
      <div class="modal-box wide">
        <div class="modal-hdr">
          <h2>📥 Catat Pembelian Baru</h2>
          <button class="btn-x" onclick="closeModal('mBuat')">×</button>
        </div>
        <div class="row2" style="margin-bottom: 16px">
          <div class="input-group">
            <label>Supplier *</label
            ><select id="bSupplier" class="input-control">
              <option value="">-- Pilih Supplier --</option>
            </select>
          </div>
          <div class="input-group">
            <label>Tanggal *</label
            ><input type="date" id="bDate" class="input-control" />
          </div>
        </div>
        <div class="row2" style="margin-bottom: 16px">
          <div class="input-group">
            <label>Diskon Global (%)</label
            ><input
              type="number"
              id="bDisc"
              class="input-control"
              value="0"
              min="0"
              max="100"
              oninput="hitungTotal()"
            />
          </div>
          <div class="input-group">
            <label>PPN (%)</label
            ><input
              type="number"
              id="bTax"
              class="input-control"
              value="0"
              min="0"
              max="100"
              oninput="hitungTotal()"
            />
          </div>
        </div>
        <div style="margin-bottom: 12px">
          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
              margin-bottom: 8px;
            "
          >
            <label style="font-weight: 600; color: var(--text-muted)"
              >Daftar Barang</label
            >
            <button
              type="button"
              onclick="addBaris()"
              class="btn"
              style="
                padding: 8px 16px;
                background: var(--primary-light);
                color: var(--primary);
                border: none;
                border-radius: 10px;
                font-weight: 700;
              "
            >
              + Tambah Baris
            </button>
          </div>
          <div
            style="
              display: grid;
              grid-template-columns: 3fr 1fr 2fr 1fr 36px;
              gap: 8px;
              margin-bottom: 6px;
              font-size: 13px;
              font-weight: 600;
              color: var(--text-muted);
              padding: 0 2px;
            "
          >
            <span>Barang</span><span>Qty</span><span>Harga Beli</span
            ><span>Disc%</span><span></span>
          </div>
          <div id="barisContainer"></div>
        </div>
        <div
          style="
            background: var(--bg-color);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
          "
        >
          <span
            style="font-size: 15px; font-weight: 600; color: var(--text-muted)"
            >TOTAL PEMBELIAN</span
          >
          <span
            id="totalLabel"
            style="font-size: 24px; font-weight: 900; color: var(--primary)"
            >Rp 0</span
          >
        </div>
        <div class="input-group">
          <label>Catatan</label
          ><textarea
            id="bNotes"
            class="input-control"
            rows="2"
            placeholder="No. surat jalan, keterangan, dll..."
          ></textarea>
        </div>
        <div
          style="
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 8px;
          "
        >
          <button
            onclick="closeModal('mBuat')"
            class="btn"
            style="
              background: var(--bg-color);
              border: 1px solid var(--border-color);
              color: var(--text-main);
            "
          >
            Batal
          </button>
          <button onclick="simpanPembelian()" class="btn btn-primary">
            ✓ Simpan Pembelian
          </button>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="mBayar">
      <div class="modal-box">
        <div class="modal-hdr">
          <h2>💸 Bayar Hutang Supplier</h2>
          <button class="btn-x" onclick="closeModal('mBayar')">×</button>
        </div>
        <input type="hidden" id="bayarId" />
        <div
          id="bayarInfo"
          style="
            background: var(--bg-color);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 16px;
            font-size: 15px;
          "
        ></div>
        <div class="input-group">
          <label>Jumlah Bayar (Rp)</label
          ><input
            type="number"
            id="bayarAmt"
            class="input-control"
            min="0"
            inputmode="numeric"
          />
        </div>
        <div class="input-group">
          <label>Catatan</label
          ><input
            type="text"
            id="bayarNote"
            class="input-control"
            placeholder="No. transfer, bukti bayar, dll..."
          />
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px">
          <button
            onclick="closeModal('mBayar')"
            class="btn"
            style="
              background: var(--bg-color);
              border: 1px solid var(--border-color);
              color: var(--text-main);
            "
          >
            Batal
          </button>
          <button onclick="doBayar()" class="btn btn-primary">✓ Bayar</button>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="mDetail">
      <div class="modal-box wide">
        <div class="modal-hdr">
          <h2 id="mDetailTitle">Detail Pembelian</h2>
          <button class="btn-x" onclick="closeModal('mDetail')">×</button>
        </div>
        <div id="mDetailBody"></div>
      </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/theme.js"></script>
    <script>
      requireAuth();
      let allItems = [],
        allSuppliers = [],
        barisIdx = 0;
      const sb = (s) =>
        ({
          paid: '<span class="bl">✓ Lunas</span>',
          unpaid: '<span class="br">✗ Belum Lunas</span>',
          partial: '<span class="bo">~ Sebagian</span>',
        })[s] || `<span class="bg">${s}</span>`;

      async function init() {
        [allItems, allSuppliers] = await Promise.all([
          api("GET", "/items/?limit=500"),
          api("GET", "/suppliers/?limit=200"),
        ]);
        const sel = document.getElementById("bSupplier");
        allSuppliers.forEach((s) =>
          sel.insertAdjacentHTML(
            "beforeend",
            `<option value="${s.id}">${s.name}</option>`,
          ),
        );
        document.getElementById("bDate").value = today();
        load();
      }

      async function load() {
        const s = document.getElementById("fStart").value,
          e = document.getElementById("fEnd").value,
          st = document.getElementById("fStatus").value;
        let url = "/purchases/?limit=200";
        if (s) url += `&start_date=${s}`;
        if (e) url += `&end_date=${e}`;
        if (st) url += `&status=${st}`;
        try {
          const d = await api("GET", url);
          document.getElementById("tblBody").innerHTML = d.length
            ? d
                .map(
                  (p) => `<tr>
      <td style="font-family:monospace;font-size:13px;font-weight:700;color:var(--primary)">${p.number}</td>
      <td>${fmtDate(p.date)}</td>
      <td style="font-weight:600">${p.supplier?.name || "-"}</td>
      <td style="font-weight:700">${fmtRp(p.total)}</td>
      <td style="color:#10b981;font-weight:600">${fmtRp(p.paid)}</td>
      <td>${sb(p.status)}</td>
      <td style="white-space:nowrap">
        <button class="bsm bv" onclick="showDetail(${p.id})">Detail</button>
        ${p.status !== "paid" ? `<button class="bsm bp" onclick="openBayar(${p.id},${p.total},${p.paid})">Bayar Hutang</button>` : ""}
        <button class="bsm bd" onclick="hapus(${p.id})">Hapus</button>
      </td></tr>`,
                )
                .join("")
            : '<tr><td colspan="7" style="text-align:center;padding:24px;color:var(--text-muted)">Tidak ada data</td></tr>';
        } catch (ex) {
          showToast(ex.message, "error");
        }
      }

      function addBaris() {
        const idx = barisIdx++;
        const opts = allItems
          .map(
            (i) =>
              `<option value="${i.id}" data-price="${i.buy_price}">${i.name} (${i.code || ""})</option>`,
          )
          .join("");
        document.getElementById("barisContainer").insertAdjacentHTML(
          "beforeend",
          `
    <div style="display:grid;grid-template-columns:3fr 1fr 2fr 1fr 36px;gap:8px;margin-bottom:8px;align-items:center" id="baris${idx}">
      <select class="input-control" style="margin:0;padding:10px 12px;font-size:14px" onchange="rowHarga(${idx},this)">
        <option value="">-- Pilih Barang --</option>${opts}
      </select>
      <input type="number" value="1" min="1" class="input-control" style="margin:0;padding:10px 12px;font-size:14px;text-align:center" oninput="hitungTotal()">
      <input type="number" value="0" min="0" class="input-control baris-harga" style="margin:0;padding:10px 12px;font-size:14px" oninput="hitungTotal()">
      <input type="number" value="0" min="0" max="100" class="input-control" style="margin:0;padding:10px 12px;font-size:14px;text-align:center" oninput="hitungTotal()">
      <button onclick="document.getElementById('baris${idx}').remove();hitungTotal()" style="width:36px;height:36px;border-radius:8px;background:rgba(239,68,68,.15);color:#ef4444;border:none;cursor:pointer;font-size:16px;font-weight:700;flex-shrink:0">✕</button>
    </div>`,
        );
        rowHarga(idx, document.querySelector(`#baris${idx} select`));
      }

      function rowHarga(idx, sel) {
        const opt = sel.options[sel.selectedIndex];
        const price = opt?.dataset?.price || 0;
        const row = document.getElementById(`baris${idx}`);
        if (row) row.querySelector(".baris-harga").value = price;
        hitungTotal();
      }

      function hitungTotal() {
        const disc = parseFloat(document.getElementById("bDisc").value) || 0;
        const tax = parseFloat(document.getElementById("bTax").value) || 0;
        let sub = 0;
        document.querySelectorAll("#barisContainer > div").forEach((row) => {
          const inps = row.querySelectorAll("input[type=number]");
          const qty = parseFloat(inps[0].value) || 0,
            harga = parseFloat(inps[1].value) || 0,
            rd = parseFloat(inps[2].value) || 0;
          sub += harga * (1 - rd / 100) * qty;
        });
        const discAmt = sub * (disc / 100),
          taxAmt = (sub - discAmt) * (tax / 100);
        document.getElementById("totalLabel").textContent = fmtRp(
          sub - discAmt + taxAmt,
        );
      }

      function openBuatModal() {
        document.getElementById("barisContainer").innerHTML = "";
        barisIdx = 0;
        document.getElementById("bSupplier").value = "";
        document.getElementById("bDate").value = today();
        document.getElementById("bDisc").value = 0;
        document.getElementById("bTax").value = 0;
        document.getElementById("bNotes").value = "";
        document.getElementById("totalLabel").textContent = "Rp 0";
        addBaris();
        openModal("mBuat");
      }

      async function simpanPembelian() {
        const supplier_id = parseInt(
          document.getElementById("bSupplier").value,
        );
        if (!supplier_id) {
          showToast("Pilih supplier dulu", "error");
          return;
        }
        const rows = [];
        document.querySelectorAll("#barisContainer > div").forEach((row) => {
          const sel = row.querySelector("select");
          const inps = row.querySelectorAll("input[type=number]");
          if (!sel.value) return;
          rows.push({
            item_id: parseInt(sel.value),
            qty: parseFloat(inps[0].value) || 1,
            buy_price: parseFloat(inps[1].value) || 0,
            discount: parseFloat(inps[2].value) || 0,
          });
        });
        if (!rows.length) {
          showToast("Tambahkan minimal 1 barang", "error");
          return;
        }
        try {
          showLoading("Menyimpan...");
          await api("POST", "/purchases/", {
            date: document.getElementById("bDate").value,
            supplier_id,
            discount: parseFloat(document.getElementById("bDisc").value) || 0,
            tax: parseFloat(document.getElementById("bTax").value) || 0,
            notes: document.getElementById("bNotes").value || null,
            items: rows,
          });
          hideLoading();
          showToast("Pembelian disimpan ✓");
          closeModal("mBuat");
          load();
        } catch (ex) {
          hideLoading();
          showToast(ex.message, "error");
        }
      }

      async function showDetail(id) {
        try {
          const p = await api("GET", `/purchases/${id}`);
          document.getElementById("mDetailTitle").textContent =
            `Faktur ${p.number}`;
          document.getElementById("mDetailBody").innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px">
        <div><div style="font-size:13px;color:var(--text-muted)">Tanggal</div><div style="font-weight:700">${fmtDate(p.date)}</div></div>
        <div><div style="font-size:13px;color:var(--text-muted)">Supplier</div><div style="font-weight:700">${p.supplier?.name || "-"}</div></div>
        <div><div style="font-size:13px;color:var(--text-muted)">Status</div>${sb(p.status)}</div>
        <div><div style="font-size:13px;color:var(--text-muted)">Catatan</div><div>${p.notes || "-"}</div></div>
      </div>
      <table class="tbl" style="margin-bottom:16px">
        <thead><tr><th>Barang</th><th style="text-align:right">Qty</th><th style="text-align:right">Harga Beli</th><th style="text-align:right">Total</th></tr></thead>
        <tbody>${(p.items || []).map((i) => `<tr><td>${i.item?.name || "-"}</td><td style="text-align:right">${i.qty}</td><td style="text-align:right">${fmtRp(i.buy_price)}</td><td style="text-align:right;font-weight:700">${fmtRp(i.qty * i.buy_price)}</td></tr>`).join("")}</tbody>
      </table>
      <div style="background:var(--bg-color);border-radius:12px;padding:16px">
        <div style="display:flex;justify-content:space-between;margin-bottom:8px"><span>Subtotal</span><span>${fmtRp(p.subtotal)}</span></div>
        ${p.discount > 0 ? `<div style="display:flex;justify-content:space-between;margin-bottom:8px"><span>Diskon</span><span>-${fmtRp(p.discount)}</span></div>` : ""}
        <div style="display:flex;justify-content:space-between;font-size:20px;font-weight:900;border-top:1px solid var(--border-color);padding-top:10px;margin-top:6px"><span>TOTAL</span><span style="color:var(--primary)">${fmtRp(p.total)}</span></div>
        <div style="display:flex;justify-content:space-between;margin-top:8px"><span>Sudah Dibayar</span><span style="color:#10b981;font-weight:700">${fmtRp(p.paid)}</span></div>
        <div style="display:flex;justify-content:space-between;margin-top:4px;font-weight:800;color:#ef4444"><span>Sisa Hutang</span><span>${fmtRp(p.total - p.paid)}</span></div>
      </div>
      <div style="margin-top:16px;display:flex;gap:10px">
        ${p.status !== "paid" ? `<button onclick="openBayar(${p.id},${p.total},${p.paid})" class="btn btn-primary">💸 Bayar Hutang</button>` : ""}
        <button onclick="hapus(${p.id})" class="btn btn-danger">🗑 Hapus</button>
      </div>`;
          openModal("mDetail");
        } catch (ex) {
          showToast(ex.message, "error");
        }
      }

      function openBayar(id, total, paid) {
        closeModal("mDetail");

        document.getElementById("bayarId").value = id;
        const sisa = total - paid;
        document.getElementById("bayarInfo").innerHTML = `
    <div style="display:flex;justify-content:space-between;margin-bottom:6px"><span>Total Tagihan</span><b>${fmtRp(total)}</b></div>
    <div style="display:flex;justify-content:space-between;margin-bottom:6px"><span>Sudah Dibayar</span><b style="color:#10b981">${fmtRp(paid)}</b></div>
    <div style="display:flex;justify-content:space-between;font-size:18px;font-weight:800;border-top:1px solid var(--border-color);padding-top:8px"><span>Sisa Hutang</span><b style="color:#ef4444">${fmtRp(sisa)}</b></div>`;
        document.getElementById("bayarAmt").value = sisa;
        document.getElementById("bayarNote").value = "";

        setTimeout(() => {
          openModal("mBayar");
        }, 250);
      }

      async function doBayar() {
        const id = document.getElementById("bayarId").value,
          amt = parseFloat(document.getElementById("bayarAmt").value) || 0;
        if (!amt) {
          showToast("Jumlah harus diisi", "error");
          return;
        }
        try {
          showLoading("Memproses...");
          await api("POST", `/purchases/${id}/pay`, {
            amount: amt,
            notes: document.getElementById("bayarNote").value,
          });
          hideLoading();
          showToast("Pembayaran berhasil ✓");
          closeModal("mBayar");
          closeModal("mDetail");
          load();
        } catch (ex) {
          hideLoading();
          showToast(ex.message, "error");
        }
      }

      async function hapus(id) {
        if (
          !(await showConfirm(
            "Hapus pembelian ini? Stok akan dikurangi kembali.",
          ))
        )
          return;
        try {
          showLoading();
          await api("DELETE", `/purchases/${id}`);
          hideLoading();
          showToast("Dihapus");
          closeModal("mDetail");
          load();
        } catch (ex) {
          hideLoading();
          showToast(ex.message, "error");
        }
      }

      // PERBAIKAN: Mengambil tanggal asli sesuai jam komputer lokal (WITA/WIB)
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, "0");
      const d = String(now.getDate()).padStart(2, "0");

      const localToday = `${y}-${m}-${d}`; // Tanggal hari ini
      const localFirstDay = `${y}-${m}-01`; // Tanggal 1 bulan ini

      document.getElementById("fStart").value = localFirstDay;
      document.getElementById("fEnd").value = localToday;

      init();
    </script>
  </body>
</html>
