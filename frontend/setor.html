<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Permintaan Barang Antar Cabang - FPOS</title>
    <link rel="stylesheet" href="/css/style.css" />
    <style>
      .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
      .badge-pending { background: #fef3c7; color: #92400e; }
      .badge-approved { background: #d1fae5; color: #065f46; }
      .badge-rejected { background: #fee2e2; color: #991b1b; }
    </style>
  </head>
  <body>
    <div class="app-container">
      <main class="main-content">
        <div class="pg-header">
          <div>
            <button class="btn" style="background:transparent; border:none; padding: 0; color: var(--primary); font-size: 14px; cursor: pointer; margin-bottom: 8px;" id="btnBack">← Kembali</button>
            <h1 id="pageTitle">📦 Permintaan Barang Cabang</h1>
            <p id="pageDesc">Kelola permintaan stok dari cabang ke Toko Utama.</p>
          </div>
        </div>

        <div class="card" style="padding:20px; margin-bottom: 24px">
            <h3 id="listTitle">Daftar Permintaan</h3>
            <div class="tbl-wrap" style="margin-top:15px">
                <table class="tbl">
                  <thead>
                    <tr>
                      <th>No. Request</th>
                      <th>Tanggal</th>
                      <th>Dari Cabang</th>
                      <th>Barang</th>
                      <th>Status</th>
                      <th>Aksi</th>
                    </tr>
                  </thead>
                  <tbody id="tblRequests"></tbody>
                </table>
            </div>
        </div>
      </main>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/theme.js"></script>
    <script>
      requireAuth();
      let isPusat = false;

      async function init() {
          const u = JSON.parse(localStorage.getItem("pos_user") || "{}");
          isPusat = (u.active_branch_id === 1 || !u.active_branch_id);
          
          if (isPusat) {
              document.getElementById("btnBack").onclick = () => location.href = 'purchases.html';
              document.getElementById("pageTitle").textContent = "📩 Permintaan dari Cabang";
              document.getElementById("pageDesc").textContent = "Lihat dan setujui permintaan stok dari cabang-cabang.";
          } else {
              document.getElementById("btnBack").onclick = () => location.href = 'dashboard.html';
              document.getElementById("pageTitle").textContent = "📦 Terima dari Pusat";
              document.getElementById("pageDesc").textContent = "Konfirmasi barang masuk dari Toko Utama.";
          }
          
          loadRequests();
      }

      async function loadRequests() {
          const tbody = document.getElementById("tblRequests");
          tbody.innerHTML = "<tr><td colspan='6' style='text-align:center'>Memuat data...</td></tr>";
          
          try {
              const data = await api("GET", "/purchases/requests");
              tbody.innerHTML = data.length ? data.map(r => `
                <tr>
                  <td style="font-family:monospace; font-weight:700">${r.number}</td>
                  <td>${r.date}</td>
                  <td>${r.branch_id || "Pusat"}</td>
                  <td>${r.items.length} Item</td>
                  <td>
                    <span class="badge badge-${r.request_status || 'pending'}">
                        ${(r.request_status || 'pending').toUpperCase()}
                    </span>
                  </td>
                  <td>
                    ${isPusat ? 
                        (r.request_status === 'pending' ? `<button class="btn btn-primary bsm" onclick="accRequest(${r.id})">ACC & Proses</button>` : "-") 
                        : 
                        (r.request_status === 'approved' ? `<button class="btn btn-primary bsm" onclick="terimaBarang(${r.id})">Konfirmasi Terima</button>` : "-")
                    }
                  </td>
                </tr>
              `).join("") : "<tr><td colspan='6' style='text-align:center'>Belum ada permintaan barang.</td></tr>";
          } catch (e) {
              showToast(e.message, "error");
          }
      }

      async function accRequest(id) {
          if (!await showConfirm("Setujui permintaan ini? Anda akan diarahkan untuk mencatat pembelian barang ini.")) return;
          try {
              await api("POST", `/purchases/${id}/approve`);
              showToast("Permintaan di-ACC ✓");
              // Arahkan ke catat pembelian dengan ID PO ini (req di-treat sebagai PO)
              location.href = `catat-pembelian.html?po_id=${id}`;
          } catch (e) {
              showToast(e.message, "error");
          }
      }

      async function terimaBarang(id) {
          if (!await showConfirm("Barang sudah sampai dan sesuai? Stok akan bertambah di cabang ini.")) return;
          try {
              // Finalisasi request menjadi purchase lunas internal
              await api("PUT", `/purchases/${id}`, { status: "paid" }); 
              showToast("Barang diterima ✓");
              loadRequests();
          } catch (e) {
              showToast(e.message, "error");
          }
      }

      init();
    </script>
  </body>
</html>
