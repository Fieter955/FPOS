<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multi Gudang - iPos 5.0</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-container"><main class="main-content">
<button class="btn" style="background:transparent;color:var(--text-muted);padding:0;margin-bottom:16px" onclick="location.href='/dashboard'">← Kembali</button>
<div class="pg-header">
  <div><h1>🏢 Multi Gudang</h1><p>Kelola stok per gudang dan transfer antar gudang.</p></div>
  <div style="display:flex;gap:10px">
    <button class="btn" style="background:var(--bg-color);border:1px solid var(--border-color);color:var(--text-main)" onclick="openTransfer()">⇄ Transfer Stok</button>
    <button class="btn btn-primary" onclick="openGudangModal()">➕ Tambah Gudang</button>
  </div>
</div>

<!-- Tab -->
<div style="display:flex;gap:8px;margin-bottom:20px">
  <button id="tbGudang" onclick="switchTab('gudang')" style="padding:8px 20px;border-radius:100px;border:2px solid var(--primary);background:var(--primary);color:#fff;font-weight:700;cursor:pointer;font-family:inherit">🏢 Daftar Gudang</button>
  <button id="tbTransfer" onclick="switchTab('transfer')" style="padding:8px 20px;border-radius:100px;border:2px solid var(--border-color);background:transparent;color:var(--text-muted);font-weight:700;cursor:pointer;font-family:inherit">⇄ Riwayat Transfer</button>
  <button id="tbStok" onclick="switchTab('stok')" style="padding:8px 20px;border-radius:100px;border:2px solid var(--border-color);background:transparent;color:var(--text-muted);font-weight:700;cursor:pointer;font-family:inherit">📦 Stok per Gudang</button>
</div>

<!-- Panel Gudang -->
<div id="pnlGudang">
  <div class="tbl-wrap"><table class="tbl">
    <thead><tr><th>Nama Gudang</th><th>Lokasi</th><th>Default</th><th>Status</th><th>Aksi</th></tr></thead>
    <tbody id="tblGudang"></tbody>
  </table></div>
</div>

<!-- Panel Transfer -->
<div id="pnlTransfer" style="display:none">
  <div class="tbl-wrap"><table class="tbl">
    <thead><tr><th>No. Transfer</th><th>Tanggal</th><th>Barang</th><th>Dari</th><th>Ke</th><th>Qty</th><th>Status</th></tr></thead>
    <tbody id="tblTransfer"></tbody>
  </table></div>
</div>

<!-- Panel Stok per Gudang -->
<div id="pnlStok" style="display:none">
  <div class="filter-bar">
    <select id="filterGudang" class="input-control" onchange="loadStokGudang()"><option value="">-- Pilih Gudang --</option></select>
  </div>
  <div class="tbl-wrap"><table class="tbl">
    <thead><tr><th>Kode</th><th>Nama Barang</th><th>Stok di Gudang Ini</th></tr></thead>
    <tbody id="tblStokGudang"></tbody>
  </table></div>
</div>

</main></div>

<!-- Modal: Gudang -->
<div class="modal-overlay" id="mGudang"><div class="modal-box">
  <div class="modal-hdr"><h2 id="mGTitle">Tambah Gudang</h2><button class="btn-x" onclick="closeModal('mGudang')">×</button></div>
  <input type="hidden" id="gId">
  <div class="input-group"><label>Nama Gudang *</label><input id="gNama" class="input-control" placeholder="contoh: Gudang Utama, Gudang B"></div>
  <div class="input-group"><label>Lokasi / Alamat</label><input id="gLokasi" class="input-control" placeholder="Alamat atau keterangan lokasi"></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
    <button onclick="closeModal('mGudang')" class="btn" style="background:var(--bg-color);border:1px solid var(--border-color);color:var(--text-main)">Batal</button>
    <button onclick="saveGudang()" class="btn btn-primary">✓ Simpan</button>
  </div>
</div></div>

<!-- Modal: Transfer Stok -->
<div class="modal-overlay" id="mTransfer"><div class="modal-box wide">
  <div class="modal-hdr"><h2>⇄ Transfer Stok Antar Gudang</h2><button class="btn-x" onclick="closeModal('mTransfer')">×</button></div>
  <div class="row2" style="margin-bottom:16px">
    <div class="input-group"><label>Dari Gudang *</label><select id="tfFrom" class="input-control"><option value="">-- Pilih Gudang Asal --</option></select></div>
    <div class="input-group"><label>Ke Gudang *</label><select id="tfTo" class="input-control"><option value="">-- Pilih Gudang Tujuan --</option></select></div>
  </div>
  <div class="row2" style="margin-bottom:16px">
    <div class="input-group"><label>Barang *</label><select id="tfItem" class="input-control" onchange="cekStokGudangAsal()"><option value="">-- Pilih Barang --</option></select></div>
    <div class="input-group"><label>Jumlah *</label>
      <input id="tfQty" type="number" class="input-control" min="1" value="1" inputmode="numeric">
      <div id="tfStokInfo" style="font-size:13px;color:var(--text-muted);margin-top:4px"></div>
    </div>
  </div>
  <div class="input-group"><label>Keterangan</label><input id="tfNote" class="input-control" placeholder="Keterangan transfer..."></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
    <button onclick="closeModal('mTransfer')" class="btn" style="background:var(--bg-color);border:1px solid var(--border-color);color:var(--text-main)">Batal</button>
    <button onclick="doTransfer()" class="btn btn-primary">✓ Transfer Sekarang</button>
  </div>
</div></div>

<!-- Modal: Detail Stok Gudang -->
<div class="modal-overlay" id="mStokDetail"><div class="modal-box wide">
  <div class="modal-hdr"><h2 id="mStokTitle">Stok Gudang</h2><button class="btn-x" onclick="closeModal('mStokDetail')">×</button></div>
  <div class="tbl-wrap"><table class="tbl">
    <thead><tr><th>Kode</th><th>Nama Barang</th><th>Stok</th></tr></thead>
    <tbody id="tblStokDetail"></tbody>
  </table></div>
</div></div>

<script src="/js/api.js"></script><script src="/js/theme.js"></script>
<script>
requireAuth();
let allGudang=[], allItems=[];
const ON='padding:8px 20px;border-radius:100px;border:2px solid var(--primary);background:var(--primary);color:#fff;font-weight:700;cursor:pointer;font-family:inherit';
const OFF='padding:8px 20px;border-radius:100px;border:2px solid var(--border-color);background:transparent;color:var(--text-muted);font-weight:700;cursor:pointer;font-family:inherit';

function switchTab(t){
  ['Gudang','Transfer','Stok'].forEach(x=>{
    document.getElementById('pnl'+x).style.display=x.toLowerCase()===t?'block':'none';
    document.getElementById('tb'+x).style.cssText=x.toLowerCase()===t?ON:OFF;
  });
  if(t==='gudang')loadGudang();
  if(t==='transfer')loadTransfer();
}

async function init(){
  [allGudang,allItems]=await Promise.all([api('GET','/warehouses/'),api('GET','/items/?limit=500')]);
  // Populate selects
  ['tfFrom','tfTo','filterGudang'].forEach(id=>{
    const sel=document.getElementById(id);
    sel.innerHTML=id==='filterGudang'?'<option value="">-- Pilih Gudang --</option>':'<option value="">-- Pilih Gudang --</option>';
    allGudang.forEach(g=>sel.insertAdjacentHTML('beforeend',`<option value="${g.id}">${g.name}</option>`));
  });
  const si=document.getElementById('tfItem');
  allItems.forEach(i=>si.insertAdjacentHTML('beforeend',`<option value="${i.id}" data-stok="${i.stock}">${i.name} (Stok: ${i.stock})</option>`));
  loadGudang();
}

async function loadGudang(){
  try{
    allGudang=await api('GET','/warehouses/');
    document.getElementById('tblGudang').innerHTML=allGudang.length?allGudang.map(g=>`<tr>
      <td><b style="font-size:16px">${g.name}</b></td>
      <td style="color:var(--text-muted)">${g.location||'-'}</td>
      <td>${g.is_default?'<span class="bl">✓ Default</span>':'—'}</td>
      <td><span style="color:${g.is_active!==false?'#10b981':'#ef4444'};font-weight:700">${g.is_active!==false?'● Aktif':'✗ Nonaktif'}</span></td>
      <td style="white-space:nowrap">
        <button class="bsm be" onclick='editGudang(${JSON.stringify(g).replace(/"/g,"&quot;")})'>Edit</button>
        <button class="bsm bv" onclick="lihatStok(${g.id},'${g.name}')">Cek Stok</button>
        <button class="bsm bd" onclick="hapusGudang(${g.id},'${g.name}')">Hapus</button>
      </td></tr>`).join(''):'<tr><td colspan="5" style="text-align:center;padding:24px;color:var(--text-muted)">Belum ada gudang</td></tr>';
  }catch(ex){showToast(ex.message,'error');}
}

function openGudangModal(){
  document.getElementById('gId').value='';document.getElementById('mGTitle').textContent='Tambah Gudang';
  document.getElementById('gNama').value='';document.getElementById('gLokasi').value='';
  openModal('mGudang');
}
async function editGudang(g){
  document.getElementById('gId').value=g.id;document.getElementById('mGTitle').textContent='Edit Gudang';
  document.getElementById('gNama').value=g.name;document.getElementById('gLokasi').value=g.location||'';
  openModal('mGudang');
}
async function saveGudang(){
  const name=document.getElementById('gNama').value.trim();
  if(!name){showToast('Nama gudang wajib diisi','error');return;}
  const id=document.getElementById('gId').value;
  const data={name,location:document.getElementById('gLokasi').value||null};
  try{
    if(id)await api('PUT',`/warehouses/${id}`,data);
    else await api('POST','/warehouses/',data);
    showToast('Gudang disimpan ✓');closeModal('mGudang');init();
  }catch(ex){showToast(ex.message,'error');}
}
async function hapusGudang(id,name){
  if(!await showConfirm(`Hapus gudang "${name}"?`))return;
  try{await api('DELETE',`/warehouses/${id}`);showToast('Dihapus');loadGudang();}
  catch(ex){showToast(ex.message,'error');}
}
async function lihatStok(id,name){
  try{
    showLoading('Memuat stok...');
    const d=await api('GET',`/warehouses/${id}/stock`);
    hideLoading();
    document.getElementById('mStokTitle').textContent=`📦 Stok: ${name}`;
    document.getElementById('tblStokDetail').innerHTML=d.length?d.map(s=>`<tr>
      <td style="font-family:monospace;font-size:13px;color:var(--text-muted)">${s.item?.code||'-'}</td>
      <td><b>${s.item?.name||'-'}</b></td>
      <td style="font-size:22px;font-weight:900;color:var(--primary)">${s.quantity}</td>
    </tr>`).join(''):'<tr><td colspan="3" style="text-align:center;padding:24px;color:var(--text-muted)">Belum ada stok di gudang ini</td></tr>';
    openModal('mStokDetail');
  }catch(ex){hideLoading();showToast(ex.message,'error');}
}

function openTransfer(){
  document.getElementById('tfFrom').value='';document.getElementById('tfTo').value='';
  document.getElementById('tfItem').value='';document.getElementById('tfQty').value=1;
  document.getElementById('tfNote').value='';document.getElementById('tfStokInfo').textContent='';
  openModal('mTransfer');
}
function cekStokGudangAsal(){
  const fromId=document.getElementById('tfFrom').value;
  const itemId=document.getElementById('tfItem').value;
  const opt=document.querySelector(`#tfItem option[value="${itemId}"]`);
  if(opt)document.getElementById('tfStokInfo').textContent=`Stok total: ${opt.dataset.stok}`;
}
async function doTransfer(){
  const from_id=parseInt(document.getElementById('tfFrom').value);
  const to_id=parseInt(document.getElementById('tfTo').value);
  const item_id=parseInt(document.getElementById('tfItem').value);
  const qty=parseFloat(document.getElementById('tfQty').value)||0;
  if(!from_id||!to_id){showToast('Pilih gudang asal dan tujuan','error');return;}
  if(from_id===to_id){showToast('Gudang asal dan tujuan tidak boleh sama','error');return;}
  if(!item_id){showToast('Pilih barang','error');return;}
  if(qty<=0){showToast('Jumlah harus lebih dari 0','error');return;}
  try{
    showLoading('Mentransfer stok...');
    await api('POST','/warehouses/transfer',{from_warehouse_id:from_id,to_warehouse_id:to_id,item_id,quantity:qty,notes:document.getElementById('tfNote').value||null});
    hideLoading();showToast('Transfer berhasil ✓');closeModal('mTransfer');loadTransfer();
  }catch(ex){hideLoading();showToast(ex.message,'error');}
}

async function loadTransfer(){
  try{
    const d=await api('GET','/warehouses/transfers?limit=100');
    document.getElementById('tblTransfer').innerHTML=d.length?d.map(t=>`<tr>
      <td style="font-family:monospace;font-size:13px;color:var(--primary)">${t.number||'-'}</td>
      <td style="font-size:13px">${fmtDate(t.date)}</td>
      <td><b>${t.item?.name||'-'}</b></td>
      <td style="color:var(--text-muted)">${t.from_warehouse?.name||'-'}</td>
      <td style="color:var(--text-muted)">${t.to_warehouse?.name||'-'}</td>
      <td style="font-size:18px;font-weight:800">${t.quantity}</td>
      <td><span class="bl">✓ Selesai</span></td>
    </tr>`).join(''):'<tr><td colspan="7" style="text-align:center;padding:24px;color:var(--text-muted)">Belum ada riwayat transfer</td></tr>';
  }catch(ex){showToast(ex.message,'error');}
}

async function loadStokGudang(){
  const id=document.getElementById('filterGudang').value;
  if(!id)return;
  try{
    const d=await api('GET',`/warehouses/${id}/stock`);
    document.getElementById('tblStokGudang').innerHTML=d.length?d.map(s=>`<tr>
      <td style="font-family:monospace;font-size:13px;color:var(--text-muted)">${s.item?.code||'-'}</td>
      <td><b>${s.item?.name||'-'}</b></td>
      <td style="font-size:20px;font-weight:900;color:var(--primary)">${s.quantity}</td>
    </tr>`).join(''):'<tr><td colspan="3" style="text-align:center;padding:24px;color:var(--text-muted)">Belum ada stok</td></tr>';
  }catch(ex){showToast(ex.message,'error');}
}

init();
</script>
</body></html>
