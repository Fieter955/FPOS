<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <!-- PWA & Mobile App Behavior -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!-- Service Worker Registration -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js", { scope: "/" })
            .then((reg) => console.log("SW registered"))
            .catch((err) => console.error("SW failed", err));
        });
      }
    </script>
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Kasir - iPos 5.0</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="iPos 5.0" />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
      * {
        -webkit-tap-highlight-color: transparent;
      }
      body {
        overflow: hidden;
      }
      .pos-layout {
        display: flex;
        height: 100vh;
      }
      .pos-left {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        min-width: 0;
      }
      .pos-right {
        width: 340px;
        flex-shrink: 0;
        background: var(--card-bg);
        border-left: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      @media (max-width: 900px) {
        .pos-right {
          display: none;
          position: fixed;
          inset: 0;
          width: 100%;
          z-index: 500;
          background: var(--card-bg);
        }
        .pos-right.show {
          display: flex;
        }
      }

      /* --- FAB Keranjang Mobile --- */
      .cart-fab {
        display: none;
        position: fixed;
        bottom: 24px;
        right: 24px;
        width: 64px;
        height: 64px;
        border-radius: 32px;
        background: var(--primary, #f97316);
        color: white;
        border: none;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        font-size: 28px;
        cursor: pointer;
        z-index: 400;
        align-items: center;
        justify-content: center;
        transition: 0.2s;
      }
      .cart-fab:active {
        transform: scale(0.92);
        background: #ea580c;
      }
      .cart-fab .badge {
        position: absolute;
        top: -4px;
        right: -4px;
        background: #ef4444;
        color: white;
        font-size: 14px;
        font-weight: bold;
        min-width: 24px;
        height: 24px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 6px;
        border: 2px solid white;
      }
      @media (max-width: 900px) {
        .cart-fab {
          display: flex;
        }
      }

      /* --- Footer Khusus Mobile di dalam Panel Keranjang --- */
      .mobile-cart-actions {
        display: none;
        padding: 12px 16px;
        border-top: 1px solid var(--border-color);
        background: var(--card-bg);
        gap: 12px;
      }
      @media (max-width: 900px) {
        .mobile-cart-actions {
          display: flex;
        }
        /* Sembunyikan footer desktop jika perlu, atau biarkan saja karena panel akan penuh */
        .cart-footer {
          display: none;
        }
        /* Tampilkan footer mobile */
        .pos-right.show .mobile-cart-actions {
          display: flex;
        }
      }

      .mobile-cart-actions button {
        flex: 1;
        padding: 14px 0;
        border-radius: 14px;
        font-size: 16px;
        font-weight: 700;
        border: none;
        cursor: pointer;
        font-family: inherit;
      }
      .mobile-cart-actions .btn-back {
        background: transparent;
        border: 2px solid var(--border-color);
        color: var(--text-muted);
      }
      .mobile-cart-actions .btn-pay {
        background: var(--primary);
        color: white;
      }

      .search-bar {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border-color);
        background: var(--card-bg);
        flex-shrink: 0;
      }
      .search-inp {
        width: 100%;
        padding: 12px 18px;
        border-radius: 100px;
        border: 2px solid var(--border-color);
        background: var(--bg-color);
        color: var(--text-main);
        font-size: 16px;
        outline: none;
        font-family: inherit;
        box-sizing: border-box;
      }
      .search-inp:focus {
        border-color: var(--primary);
      }
      .cat-scroll {
        display: flex;
        gap: 8px;
        padding: 8px 16px;
        overflow-x: auto;
        border-bottom: 1px solid var(--border-color);
      }
      .cat-scroll::-webkit-scrollbar {
        display: none;
      }
      .cat-btn {
        flex-shrink: 0;
        padding: 6px 14px;
        border-radius: 100px;
        border: 2px solid var(--border-color);
        background: transparent;
        color: var(--text-muted);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        white-space: nowrap;
      }
      .cat-btn.active {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
      }
      .item-grid-wrap {
        flex: 1;
        overflow-y: auto;
        padding: 12px;
      }
      .item-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
        gap: 10px;
      }

      .item-card {
        background: var(--card-bg);
        border: 2px solid var(--border-color);
        border-radius: 14px;
        padding: 12px;
        cursor: pointer;
        transition: 0.15s;
        user-select: none;
      }
      .item-card:hover {
        border-color: var(--primary);
        transform: translateY(-2px);
      }

      /* --- GLOW EFEK KEYBOARD UTAMA --- */
      .item-card.kb-focus {
        border-color: var(--primary);
        background: rgba(16, 185, 129, 0.08);
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }
      .item-card:active {
        transform: scale(0.95);
      }

      .item-name {
        font-size: 14px;
        font-weight: 700;
        margin-bottom: 6px;
        color: var(--text-main);
        line-height: 1.3;
      }
      .item-price {
        font-size: 15px;
        font-weight: 700;
        color: var(--primary);
      }
      .item-stock {
        font-size: 12px;
        color: var(--text-muted);
        margin-top: 4px;
      }
      .stock-low {
        color: #f59e0b !important;
        font-weight: 700;
      }
      .stock-empty {
        color: #ef4444 !important;
        font-weight: 700;
      }

      /* --- Styling Tombol Pop-up Keyboard --- */
      .pay-btn.kb-focus,
      .rcpt-btn.kb-focus {
        outline: 3px solid var(--primary);
        outline-offset: 2px;
        transform: scale(1.05);
        background: var(--primary) !important;
        color: #fff !important;
        border-color: var(--primary) !important;
      }
      #btnPayCancel.kb-focus,
      #btnRcptTutup.kb-focus,
      #btnQtyBatal.kb-focus {
        outline-color: #ef4444 !important;
        background: #ef4444 !important;
        border-color: #ef4444 !important;
        color: #fff !important;
      }
      #qtyInp.kb-focus {
        outline: 3px solid var(--primary);
        outline-offset: 2px;
      }

      .rcpt-btn {
        padding: 11px;
        border-radius: 9px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s;
      }
      .cart-header {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border-color);
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
      }
      .cart-items {
        flex: 1;
        overflow-y: auto;
      }
      .cart-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--border-color);
      }
      .ci-info {
        flex: 1;
        min-width: 0;
      }
      .ci-name {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-main);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .ci-price {
        font-size: 12px;
        color: var(--text-muted);
      }
      .qty-ctrl {
        display: flex;
        align-items: center;
        gap: 5px;
        flex-shrink: 0;
      }
      .qty-btn {
        width: 26px;
        height: 26px;
        border-radius: 7px;
        border: none;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--border-color);
        color: var(--text-main);
      }
      .qty-btn:hover {
        background: var(--primary);
        color: #fff;
      }
      .ci-sub {
        font-size: 13px;
        font-weight: 700;
        color: var(--primary);
        width: 70px;
        text-align: right;
        flex-shrink: 0;
      }
      .ci-del {
        background: rgba(239, 68, 68, 0.15);
        color: #ef4444;
        border: none;
        border-radius: 5px;
        width: 20px;
        height: 20px;
        font-size: 12px;
        cursor: pointer;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .cart-footer {
        padding: 12px 16px;
        border-top: 1px solid var(--border-color);
        flex-shrink: 0;
      }
      .ttl-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
        font-size: 14px;
      }
      .pay-btns {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
        margin-bottom: 8px;
      }
      .pay-btn {
        padding: 9px 4px;
        border-radius: 9px;
        border: 2px solid var(--border-color);
        background: transparent;
        color: var(--text-muted);
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        font-family: inherit;
        text-align: center;
        transition: 0.1s;
      }
      .pay-btn.active {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
      }
      .bayar-btn {
        width: 100%;
        height: 48px;
        font-size: 16px;
        font-weight: 700;
        background: var(--primary);
        color: #fff;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        font-family: inherit;
      }
      .bayar-btn:active {
        transform: scale(0.97);
      }
    </style>
  </head>
  <body>
    <!-- FAB Keranjang Mobile -->
    <button class="cart-fab" id="cartFab" onclick="toggleCartPanel()">
      🛒
      <span class="badge" id="cartFabBadge">0</span>
    </button>

    <div class="pos-layout">
      <div class="pos-left">
        <div class="search-bar">
          <div
            style="
              display: flex;
              gap: 8px;
              align-items: center;
              margin-bottom: 8px;
            "
          >
            <button
              class="btn"
              style="
                padding: 10px 14px;
                background: rgba(255, 255, 255, 0.1);
                color: var(--text-main);
                border: 1px solid var(--border-color);
                flex-shrink: 0;
                font-size: 13px;
                font-weight: bold;
              "
              onclick="location.href = '/dashboard'"
            >
              ← Kembali
            </button>
            <input
              type="text"
              id="searchInp"
              class="search-inp"
              placeholder="🔍 Cari barang... (Tekan F8/Insert untuk Bayar)"
              autofocus
              autocomplete="off"
              oninput="filterItems()"
            />
          </div>
          <div class="cat-scroll" id="catBar">
            <button class="cat-btn active" onclick="setCat('')" id="cat_all">
              Semua
            </button>
          </div>
        </div>

        <div class="item-grid-wrap" id="scrollWrap">
          <div class="item-grid" id="itemGrid"></div>
          <div
            id="emptyItems"
            style="
              display: none;
              text-align: center;
              padding: 60px 20px;
              color: var(--text-muted);
            "
          >
            <div style="font-size: 48px; margin-bottom: 12px">📦</div>
            <p>Tidak ada barang</p>
          </div>
        </div>
      </div>

      <div class="pos-right" id="cartPanel">
        <div class="cart-header">
          <div style="font-size: 16px; font-weight: 800">
            🛒 Tagihan &nbsp;<span
              id="cartCount"
              style="
                background: var(--primary-light);
                color: var(--primary);
                padding: 2px 10px;
                border-radius: 99px;
                font-size: 13px;
              "
              >0</span
            >
          </div>
          <button
            onclick="clearCart()"
            style="
              font-size: 12px;
              color: var(--text-muted);
              background: none;
              border: none;
              cursor: pointer;
            "
          >
            Kosongkan
          </button>
        </div>

        <div
          style="
            padding: 8px 12px;
            border-bottom: 1px solid var(--border-color);
          "
        >
          <select
            id="custSel"
            class="input-control"
            style="margin: 0; padding: 9px 12px; font-size: 13px"
          >
            <option value="">👤 Pelanggan Umum</option>
          </select>
        </div>

        <div class="cart-items" id="cartList">
          <div
            style="
              padding: 32px;
              text-align: center;
              color: var(--text-muted);
              font-size: 14px;
            "
          >
            Belum ada barang
          </div>
        </div>

        <!-- Footer Desktop -->
        <div class="cart-footer">
          <div class="ttl-row">
            <span style="color: var(--text-muted)">Subtotal</span
            ><span id="subtotalEl">Rp 0</span>
          </div>
          <div
            class="ttl-row"
            style="
              font-size: 19px;
              font-weight: 900;
              border-top: 2px solid var(--border-color);
              padding-top: 8px;
              margin-bottom: 10px;
            "
          >
            <span>TOTAL</span
            ><span id="totalEl" style="color: var(--primary)">Rp 0</span>
          </div>
          <input type="hidden" id="discPct" value="0" />
          <input type="hidden" id="taxPct" value="0" />
          <input type="hidden" id="paidInp" value="0" />

          <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 8px">
            <button
              onclick="clearCart()"
              style="
                padding: 12px;
                border-radius: 10px;
                border: 2px solid var(--border-color);
                background: transparent;
                color: var(--text-muted);
                font-size: 14px;
                font-weight: 700;
                cursor: pointer;
              "
            >
              ✕
            </button>
            <button class="bayar-btn" onclick="openPayModal()">
              ✓ BAYAR (F8)
            </button>
          </div>
        </div>

        <!-- Footer Mobile: Tombol Kembali & Bayar -->
        <div class="mobile-cart-actions">
          <button class="btn-back" onclick="closeCartPanel()">← Kembali</button>
          <button class="btn-pay" onclick="handleMobilePay()">💳 Bayar</button>
        </div>
      </div>
    </div>

    <!-- Modal Qty -->
    <div
      class="modal-overlay"
      id="modalQty"
      style="display: none; z-index: 9999"
    >
      <div class="modal-box" style="max-width: 320px; text-align: center">
        <h3
          id="qtyItemName"
          style="margin-top: 0; margin-bottom: 15px; color: var(--text-main)"
        >
          Nama Barang
        </h3>
        <label style="color: var(--text-muted)">Masukkan Jumlah (Qty):</label>

        <input
          type="number"
          id="qtyInp"
          class="input-control kb-focus"
          value="1"
          min="1"
          style="
            font-size: 32px;
            font-weight: 900;
            text-align: center;
            margin: 15px 0;
            padding: 15px;
            border-radius: 15px;
            color: var(--primary);
          "
        />
        <div
          id="priceSelectorBox"
          style="
            display: none;
            margin-bottom: 15px;
            background: rgba(0, 0, 0, 0.05);
            padding: 10px;
            border-radius: 10px;
            text-align: left;
          "
        >
          <div
            style="
              font-size: 12px;
              color: var(--text-muted);
              margin-bottom: 8px;
              text-align: center;
              font-weight: bold;
            "
          >
            Pilih Harga Jual:
          </div>
          <div style="display: flex; justify-content: center; gap: 20px">
            <label
              style="
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: 5px;
                font-weight: bold;
                color: var(--primary);
              "
            >
              <input
                type="radio"
                name="rdoPrice"
                id="rdoNormal"
                value="normal"
                checked
              />
              Normal (<span id="lblNormal">0</span>)
            </label>
            <label
              style="
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: 5px;
                font-weight: bold;
                color: #f59e0b;
              "
            >
              <input
                type="radio"
                name="rdoPrice"
                id="rdoDiskon"
                value="diskon"
              />
              Diskon (<span id="lblDiskon">0</span>)
            </label>
          </div>
        </div>

        <div
          style="
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
          "
        >
          <button
            id="btnQtyBatal"
            class="rcpt-btn"
            style="
              flex: 1;
              background: transparent;
              color: #ef4444;
              border: 2px solid #ef4444;
            "
            onclick="closeModals()"
          >
            ✕ Batal
          </button>
          <button
            id="btnQtySimpan"
            class="rcpt-btn"
            style="flex: 1; background: #10b981; color: white; border: none"
            onclick="confirmQty()"
          >
            ✓ Simpan
          </button>
        </div>

        <div
          style="
            font-size: 12px;
            color: gray;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 8px;
          "
        >
          ( ↓ ) Pindah Menu &nbsp; | &nbsp; ( → ) Geser
        </div>
      </div>
    </div>

    <!-- Modal Pembayaran -->
    <div
      class="modal-overlay"
      id="modalPay"
      style="display: none; z-index: 9999"
    >
      <div class="modal-box" style="max-width: 420px">
        <h2 style="margin-top: 0; text-align: center">💳 Pembayaran</h2>
        <div
          style="
            font-size: 32px;
            font-weight: 900;
            color: var(--primary);
            margin: 15px 0;
            text-align: center;
          "
          id="payTotalDisplay"
        >
          Rp 0
        </div>

        <label style="color: var(--text-muted); font-size: 13px"
          >Uang Diterima dari Pelanggan:</label
        >
        <input
          type="number"
          id="payInpModal"
          class="input-control"
          value="0"
          style="
            font-size: 24px;
            font-weight: bold;
            text-align: right;
            margin-bottom: 15px;
            padding: 12px;
          "
        />

        <label
          style="
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 5px;
            display: block;
          "
          >Pilih Metode (Kiri/Kanan):</label
        >
        <div
          class="pay-btns"
          id="payModalBtns"
          style="grid-template-columns: repeat(4, 1fr)"
        >
          <button
            class="pay-btn"
            id="btnPayCancel"
            style="color: #ef4444; border-color: #ef4444"
            onclick="closeModals()"
          >
            ✕ Batal
          </button>
          <button
            class="pay-btn"
            id="btnPayCash"
            onclick="setPayMethodAndConfirm('cash')"
          >
            💵 Cash
          </button>
          <button
            class="pay-btn"
            id="btnPayTrans"
            onclick="setPayMethodAndConfirm('transfer')"
          >
            🏦 Trf
          </button>
          <button
            class="pay-btn"
            id="btnPayCard"
            onclick="setPayMethodAndConfirm('card')"
          >
            💳 Kartu
          </button>
        </div>
      </div>
    </div>

    <!-- Modal Struk -->
    <div
      class="modal-overlay"
      id="rcptModal"
      style="display: none; z-index: 9999"
    >
      <div
        id="rcptBox"
        style="
          background: #fff;
          color: #222;
          width: 100%;
          max-width: 360px;
          border-radius: 20px;
          padding: 24px;
          font-family: &quot;Courier New&quot;, monospace;
          max-height: 90vh;
          overflow-y: auto;
        "
      ></div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/theme.js"></script>
    <script>
      requireAuth();

      // =======================================================================
      // 📋 VARIABEL GLOBAL & STATE
      // =======================================================================
      let allItems = [],
        cart = [],
        payMethod = "cash",
        activeCat = "";
      let currentFilteredItems = [];
      let kbFocusIndex = -1;
      let activeModal = null;
      let pendingItemId = null;
      let qtyIdx = 0;
      let payModalMethods = ["cancel", "cash", "transfer", "card"];
      let payModalIdx = 1;
      let rcptIdx = 2;

      // Variabel Khusus Scanner
      let barcodeBuffer = "";
      let lastKeyTime = today();

      // =======================================================================
      // 📡 MASTER CONTROLLER: SENSOR KEYBOARD & SCANNER (PENGATUR LALU LINTAS)
      // =======================================================================
      document.addEventListener("keydown", function (e) {
        const currentTime = today();
        const timeDiff = currentTime - lastKeyTime;
        lastKeyTime = currentTime;

        // 1. DETEKSI MESIN SCANNER (Ketikan super cepat < 50ms)
        if (timeDiff > 50) {
          barcodeBuffer = ""; // Jika lambat, berarti manusia. Reset buffer.
        }
        if (e.key.length === 1) {
          barcodeBuffer += e.key; // Simpan karakter ke penampung
        }

        // 2. KONTROL MODAL QTY (JUMLAH BARANG)
        if (activeModal === "qty") {
          if (e.key === "Escape") {
            closeModals();
            return;
          }
          if (e.key === "ArrowDown") {
            e.preventDefault();
            changeQtyIdx(1);
            return;
          }
          if (e.key === "ArrowUp") {
            e.preventDefault();
            changeQtyIdx(0);
            return;
          }
          if (e.key === "ArrowRight" && qtyIdx > 0) {
            e.preventDefault();
            changeQtyIdx(2);
            return;
          }
          if (e.key === "ArrowLeft" && qtyIdx > 0) {
            e.preventDefault();
            changeQtyIdx(1);
            return;
          }
          if (e.key === "Enter") {
            e.preventDefault();
            if (qtyIdx === 1) closeModals();
            else confirmQty();
          }
          return;
        }

        // 3. KONTROL MODAL PAY (PEMBAYARAN)
        if (activeModal === "pay") {
          if (e.key === "Escape") {
            closeModals();
            return;
          }
          if (e.key === "ArrowRight") {
            e.preventDefault();
            changePayIdx(1);
            return;
          }
          if (e.key === "ArrowLeft") {
            e.preventDefault();
            changePayIdx(-1);
            return;
          }
          if (e.key === "Enter") {
            e.preventDefault();
            if (payModalIdx === 0) closeModals();
            else confirmPayModal();
          }
          return;
        }

        // 4. KONTROL MODAL RCPT (STRUK)
        if (activeModal === "rcpt") {
          if (e.key === "Escape") {
            closeModals();
            return;
          }
          if (e.key === "ArrowRight") {
            e.preventDefault();
            changeRcptIdx(1);
            return;
          }
          if (e.key === "ArrowLeft") {
            e.preventDefault();
            changeRcptIdx(-1);
            return;
          }
          if (e.key === "Enter") {
            e.preventDefault();
            if (rcptIdx === 0) closeModals();
            else if (rcptIdx === 1)
              document.getElementById("btnRcptCetak").click();
            else document.getElementById("btnRcptSelesai").click();
          }
          return;
        }

        // 5. KONTROL LAYAR UTAMA POS
        if (activeModal === null) {
          // A. EKSEKUSI SCANNER (Prioritas Tertinggi)
          if (e.key === "Enter" && barcodeBuffer.length > 2) {
            e.preventDefault();
            const scode = barcodeBuffer.toLowerCase().trim();

            // Cari yang benar-benar cocok 100% (Kebal String/Number)
            const matchedItem = allItems.find(
              (i) =>
                String(i.barcode || "")
                  .toLowerCase()
                  .trim() === scode ||
                String(i.code || "")
                  .toLowerCase()
                  .trim() === scode,
            );

            barcodeBuffer = ""; // Kosongkan buffer

            if (matchedItem) {
              promptQty(matchedItem.id);
              document.getElementById("searchInp").value = "";
              filterItems();
            } else {
              showToast("Barcode " + scode + " tidak terdaftar!", "error");
              document.getElementById("searchInp").value = "";
              filterItems();
            }
            return;
          }

          // B. SHORTCUT TOMBOL BAYAR (F8 / INSERT)
          if (e.key === "F8" || e.key === "Insert" || e.key === "End") {
            e.preventDefault();
            openPayModal();
            return;
          }

          // C. NAVIGASI PANAH (KIRI, KANAN, ATAS, BAWAH)
          if (
            ["ArrowDown", "ArrowUp", "ArrowLeft", "ArrowRight"].includes(e.key)
          ) {
            e.preventDefault();
            if (currentFilteredItems.length === 0) return;

            const grid = document.getElementById("itemGrid");
            const cols = window
              .getComputedStyle(grid)
              .getPropertyValue("grid-template-columns")
              .split(" ").length;

            if (kbFocusIndex === -1) kbFocusIndex = 0;
            else {
              if (e.key === "ArrowRight") kbFocusIndex++;
              if (e.key === "ArrowLeft") kbFocusIndex--;
              if (e.key === "ArrowDown") kbFocusIndex += cols;
              if (e.key === "ArrowUp") kbFocusIndex -= cols;
            }

            if (kbFocusIndex < 0) kbFocusIndex = 0;
            if (kbFocusIndex >= currentFilteredItems.length)
              kbFocusIndex = currentFilteredItems.length - 1;

            const cards = document.querySelectorAll("#itemGrid .item-card");
            cards.forEach((c) => c.classList.remove("kb-focus"));
            if (cards[kbFocusIndex]) {
              cards[kbFocusIndex].classList.add("kb-focus");
              cards[kbFocusIndex].scrollIntoView({
                block: "nearest",
                behavior: "smooth",
              });
            }
            return;
          }

          // D. ENTER MANUAL (Input Box)
          if (e.key === "Enter") {
            e.preventDefault();
            const q = document
              .getElementById("searchInp")
              .value.trim()
              .toLowerCase();

            // CEK 1: Apakah input manual cocok 100% dengan kode/barcode?
            const ex = allItems.find(
              (i) =>
                String(i.barcode || "")
                  .toLowerCase()
                  .trim() === q ||
                String(i.code || "")
                  .toLowerCase()
                  .trim() === q,
            );

            if (ex && q !== "") {
              promptQty(ex.id);
              document.getElementById("searchInp").value = "";
              filterItems();
              return;
            }

            // CEK 2: Jika tidak ada yang cocok 100%, ambil yang sedang di-highlight (kbFocus) atau item pertama
            if (currentFilteredItems.length > 0) {
              let targetIndex = kbFocusIndex > -1 ? kbFocusIndex : 0;
              if (currentFilteredItems[targetIndex]) {
                promptQty(currentFilteredItems[targetIndex].id);
                document.getElementById("searchInp").value = "";
                filterItems();
              }
            }
          }
        }
      });

      // =======================================================================
      // 🛠️ FUNGSI PENDUKUNG (CORE LOGIC)
      // =======================================================================

      // Fungsi Helper Format Rupiah (Berjaga-jaga jika di theme.js belum ada)
      if (typeof fmtRp !== "function") {
        window.fmtRp = function (n) {
          return new Intl.NumberFormat("id-ID", {
            style: "currency",
            currency: "IDR",
            minimumFractionDigits: 0,
          }).format(n || 0);
        };
      }

      // Fungsi Mengambil Tanggal WITA (Sesuai Request Sebelumnya)
      function today() {
        return new Date().toLocaleDateString("en-CA", {
          timeZone: "Asia/Makassar",
        });
      }

      async function init() {
        try {
          const [items, cats, custs] = await Promise.all([
            api("GET", "/items/?limit=20000"), // Limit dibesarkan agar tidak gaib
            api("GET", "/items/categories"),
            api("GET", "/customers/?limit=500"),
          ]);
          allItems = items;
          const bar = document.getElementById("catBar");
          cats.forEach((c) => {
            const b = document.createElement("button");
            b.className = "cat-btn";
            b.textContent = c.name;
            b.id = "cat_" + c.id;
            b.onclick = () => setCat(c.id);
            bar.appendChild(b);
          });
          const s = document.getElementById("custSel");
          custs.forEach((c) => {
            const o = document.createElement("option");
            o.value = c.id;
            o.textContent = c.name;
            s.appendChild(o);
          });
          filterItems();
        } catch (e) {
          showToast("Gagal memuat data!", "error");
        }
      }

      function setCat(id) {
        activeCat = id;
        document
          .querySelectorAll(".cat-btn")
          .forEach((b) =>
            b.classList.toggle(
              "active",
              b.id === "cat_" + id || (id === "" && b.id === "cat_all"),
            ),
          );
        filterItems();
      }

      function filterItems() {
        const q = document
          .getElementById("searchInp")
          .value.toLowerCase()
          .trim();
        currentFilteredItems = allItems.filter((i) => {
          const mc = !activeCat || i.category_id == activeCat;

          // 🛡️ PERBAIKAN: Paksa semua field menjadi String dan Lowercase agar kebal error
          const mq =
            !q ||
            String(i.name || "")
              .toLowerCase()
              .includes(q) ||
            String(i.code || "")
              .toLowerCase()
              .includes(q) ||
            String(i.barcode || "")
              .toLowerCase()
              .includes(q);

          return mc && mq;
        });
        kbFocusIndex = -1;
        renderItems(currentFilteredItems);
      }

      function renderItems(items) {
        const g = document.getElementById("itemGrid");
        document.getElementById("emptyItems").style.display = items.length
          ? "none"
          : "block";
        g.innerHTML = items
          .map(
            (i, idx) => `
            <div class="item-card ${idx === kbFocusIndex ? "kb-focus" : ""}" onclick="promptQty(${i.id})">
              <div class="item-name">${i.name}</div>
              <div class="item-price">${fmtRp(i.sell_price)}</div>
              <div class="item-stock ${i.stock <= i.min_stock ? "stock-low" : ""}">${i.stock <= 0 ? "Habis" : "Stok " + i.stock}</div>
            </div>`,
          )
          .join("");
      }

      let pendingPriceNormal = 0;
      let pendingPriceDiskon = 0;
      let hasDiskon = false;

      function promptQty(id) {
        const item = allItems.find((i) => i.id === id);
        if (!item) return;
        if (item.stock <= 0) {
          showToast("Stok " + item.name + " habis!", "error");
          return;
        }

        pendingItemId = id;
        document.getElementById("qtyItemName").textContent = item.name;
        document.getElementById("qtyInp").value = "1";

        // --- CEK APAKAH BARANG INI PUNYA HARGA DISKON ---
        pendingPriceNormal = item.sell_price;
        hasDiskon = false;
        pendingPriceDiskon = 0;

        let dPriceObj = (item.prices || []).find(
          (p) => p.name === "Harga Diskon",
        );
        const priceBox = document.getElementById("priceSelectorBox");

        if (dPriceObj && dPriceObj.price > 0) {
          hasDiskon = true;
          pendingPriceDiskon = dPriceObj.price;
          document.getElementById("lblNormal").textContent =
            fmtRp(pendingPriceNormal);
          document.getElementById("lblDiskon").textContent =
            fmtRp(pendingPriceDiskon);
          priceBox.style.display = "block";
          document.getElementById("rdoNormal").checked = true;
        } else {
          priceBox.style.display = "none";
          document.getElementById("rdoNormal").checked = true;
        }
        // ------------------------------------------------

        document.getElementById("modalQty").style.display = "flex";
        activeModal = "qty";
        changeQtyIdx(0);
      }

      function changeQtyIdx(target) {
        qtyIdx = target;
        const inp = document.getElementById("qtyInp"),
          bBat = document.getElementById("btnQtyBatal"),
          bSim = document.getElementById("btnQtySimpan");
        [inp, bBat, bSim].forEach((el) => el.classList.remove("kb-focus"));
        if (qtyIdx === 0) {
          inp.classList.add("kb-focus");
          inp.focus();
          inp.select();
        } else if (qtyIdx === 1) {
          bBat.classList.add("kb-focus");
          inp.blur();
        } else if (qtyIdx === 2) {
          bSim.classList.add("kb-focus");
          inp.blur();
        }
      }

      function confirmQty() {
        const qty = parseInt(document.getElementById("qtyInp").value) || 1;
        const item = allItems.find((i) => i.id === pendingItemId);
        if (!item) return;

        // --- TENTUKAN HARGA FINAL YANG DIPILIH KASIR ---
        let finalPrice = pendingPriceNormal;
        if (hasDiskon && document.getElementById("rdoDiskon").checked) {
          finalPrice = pendingPriceDiskon;
        }

        // 🔥 FIX BUG KERANJANG: Pisahkan item Normal & Diskon 🔥
        const ex = cart.find(
          (c) => c.id === pendingItemId && c.price === finalPrice,
        );

        if (ex) {
          if (ex.qty + qty > item.stock) {
            showToast("Sisa stok tidak cukup!", "error");
            return;
          }
          ex.qty += qty;
        } else {
          if (qty > item.stock) {
            showToast("Sisa stok tidak cukup!", "error");
            return;
          }
          cart.push({
            id: item.id,
            name: item.name,
            price: finalPrice,
            qty: qty,
            stock: item.stock,
          });
        }

        document.getElementById("searchInp").value = "";
        filterItems();
        renderCart();
        recalc();
        closeModals();
      }

      function openPayModal() {
        if (cart.length === 0) return showToast("Keranjang kosong!", "warning");
        const total = cart.reduce((s, c) => s + c.price * c.qty, 0);
        document.getElementById("payTotalDisplay").textContent = fmtRp(total);
        document.getElementById("payInpModal").value = total;
        document.getElementById("modalPay").style.display = "flex";
        activeModal = "pay";
        payModalIdx = 1;
        updatePayModalUI();
        setTimeout(() => {
          const i = document.getElementById("payInpModal");
          i.focus();
          i.select();
        }, 50);
      }

      function changePayIdx(dir) {
        payModalIdx = (payModalIdx + dir + 4) % 4;
        updatePayModalUI();
      }

      function updatePayModalUI() {
        const btns = [
          document.getElementById("btnPayCancel"),
          document.getElementById("btnPayCash"),
          document.getElementById("btnPayTrans"),
          document.getElementById("btnPayCard"),
        ];
        btns.forEach((b) => {
          b.classList.remove("kb-focus");
          b.classList.remove("active");
        });
        btns[payModalIdx].classList.add("kb-focus");
        if (payModalIdx > 0) {
          btns[payModalIdx].classList.add("active");
          payMethod = payModalMethods[payModalIdx];
        }
      }

      function confirmPayModal() {
        document.getElementById("paidInp").value =
          document.getElementById("payInpModal").value;
        prosesBayar();
      }

      // =======================================================================
      // FUNGSI BARU YANG DITAMBAHKAN UNTUK MENGATASI TOMBOL CASH/TRANSFER MATI
      // =======================================================================
      function setPayMethodAndConfirm(method) {
        payMethod = method;
        document.getElementById("paidInp").value =
          document.getElementById("payInpModal").value;
        prosesBayar();
      }

      function closeModals() {
        document
          .querySelectorAll(".modal-overlay")
          .forEach((m) => (m.style.display = "none"));
        activeModal = null;
        document.getElementById("searchInp").focus();
      }

      function renderCart() {
        const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
        document.getElementById("cartFabBadge").textContent = totalQty;
        document.getElementById("cartCount").textContent = totalQty;
        const list = document.getElementById("cartList");
        if (!cart.length) {
          list.innerHTML =
            '<div style="padding:32px;text-align:center;color:var(--text-muted);font-size:14px">Belum ada barang</div>';
          return;
        }
        list.innerHTML = cart
          .map(
            (c, i) => `
          <div class="cart-item">
            <div class="ci-info"><div class="ci-name">${c.name}</div><div class="ci-price">${fmtRp(c.price)}</div></div>
            <div class="qty-ctrl">
              <button class="qty-btn" onclick="changeQty(${i},-1)">−</button>
              <span style="font-size:14px;font-weight:700;min-width:18px;text-align:center">${c.qty}</span>
              <button class="qty-btn" onclick="changeQty(${i},1)">+</button>
            </div>
            <div class="ci-sub">${fmtRp(c.price * c.qty)}</div>
            <button class="ci-del" onclick="removeCart(${i})">✕</button>
          </div>`,
          )
          .join("");
      }

      function changeQty(i, d) {
        cart[i].qty = Math.max(1, Math.min(cart[i].stock, cart[i].qty + d));
        renderCart();
        recalc();
      }
      function removeCart(i) {
        cart.splice(i, 1);
        renderCart();
        recalc();
      }
      function clearCart() {
        cart = [];
        renderCart();
        recalc();
        document.getElementById("searchInp").focus();
      }
      function recalc() {
        const sub = cart.reduce((s, c) => s + c.price * c.qty, 0);
        document.getElementById("subtotalEl").textContent = fmtRp(sub);
        document.getElementById("totalEl").textContent = fmtRp(sub);
      }

      // =======================================================================
      // FUNGSI TAMPILAN MOBILE / HP
      // =======================================================================
      function toggleCartPanel() {
        document.getElementById("cartPanel").classList.toggle("show");
      }

      function closeCartPanel() {
        document.getElementById("cartPanel").classList.remove("show");
      }

      function handleMobilePay() {
        openPayModal();
      }

      // =======================================================================
      // API TRANSAKSI
      // =======================================================================
      async function prosesBayar() {
        const total = cart.reduce((s, c) => s + c.price * c.qty, 0);
        const paid = parseFloat(document.getElementById("paidInp").value) || 0;
        if (payMethod === "cash" && paid < total)
          return showToast("Uang kurang!", "error");
        try {
          if (typeof showLoading === "function") showLoading("Memproses...");
          const sale = await api("POST", "/sales/", {
            date: today(), // Menggunakan tanggal WITA
            customer_id: document.getElementById("custSel").value || null,
            discount: 0,
            tax: 0,
            paid: paid,
            payment_method: payMethod,
            items: cart.map((c) => ({
              item_id: c.id,
              qty: c.qty,
              sell_price: c.price,
              discount: 0,
            })),
          });
          if (typeof hideLoading === "function") hideLoading();

          // Kurangi stok di memory frontend agar langsung update
          cart.forEach((c) => {
            const it = allItems.find((x) => x.id === c.id);
            if (it) it.stock -= c.qty;
          });
          filterItems();
          clearCart();

          // Tampilkan Modal Pilihan Cetak Struk
          showReceipt(sale);
        } catch (e) {
          if (typeof hideLoading === "function") hideLoading();
          showToast(e.message, "error");
        }
      }

      function showReceipt(s) {
        document.getElementById("rcptModal").style.display = "flex";
        activeModal = "rcpt";
        rcptIdx = 2;
        updateRcptUI();

        // Panggil API Print secara otomatis jika diperlukan, atau isi Box struk
        const box = document.getElementById("rcptBox");
        box.innerHTML = `
          <h2 style="text-align:center; margin-top:0;">Transaksi Berhasil!</h2>
          <p style="text-align:center;">Kembalian: <b>${fmtRp(s.change)}</b></p>
          <div style="display:flex; gap:10px; margin-top:20px;">
            <button id="btnRcptTutup" class="rcpt-btn" style="flex:1; background:transparent; color:#ef4444; border: 2px solid #ef4444;" onclick="closeModals()">✕ Tutup</button>
            <button id="btnRcptCetak" class="rcpt-btn" style="flex:1; background:var(--primary); color:white; border:none;" onclick='printReceipt(${JSON.stringify(s)})'>🖨️ Cetak</button>
            <button id="btnRcptSelesai" class="rcpt-btn" style="flex:1; background:#10b981; color:white; border:none;" onclick="closeModals()">✓ Selesai</button>
          </div>
        `;
      }

      function updateRcptUI() {
        const btns = [
          document.getElementById("btnRcptTutup"),
          document.getElementById("btnRcptCetak"),
          document.getElementById("btnRcptSelesai"),
        ];
        btns.forEach((b, i) => {
          if (b) b.classList.toggle("kb-focus", i === rcptIdx);
        });
      }

      async function printReceipt(saleData) {
        try {
          const ps = JSON.parse(
            localStorage.getItem("ipos_print_settings") || "{}",
          );

          // 👇 INI YANG BENAR: Harus bawa ID penjualannya! 👇
          await api("POST", `/sales/print/${saleData.id}`, { settings: ps });

          showToast("Struk dikirim ke antrean printer!");
          closeModals();
        } catch (e) {
          showToast("Gagal print: " + e.message, "error");
        }
      }

      // Mulai inisialisasi awal
      init();
    </script>
  </body>
</html>
