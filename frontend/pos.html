<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1"
    />
    <title>Kasir - iPos 5.0</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f172a" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="iPos 5.0" />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
      * {
        -webkit-tap-highlight-color: transparent;
      }
      body {
        overflow: hidden;
      }
      .pos-layout {
        display: flex;
        height: 100vh;
      }
      .pos-left {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        min-width: 0;
      }
      .pos-right {
        width: 340px;
        flex-shrink: 0;
        background: var(--card-bg);
        border-left: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      @media (max-width: 900px) {
        .pos-right {
          display: none;
        }
        .pos-right.show {
          display: flex;
          position: fixed;
          inset: 0;
          width: 100%;
          z-index: 500;
        }
      }
      .search-bar {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border-color);
        background: var(--card-bg);
        flex-shrink: 0;
      }
      .search-inp {
        width: 100%;
        padding: 12px 18px;
        border-radius: 100px;
        border: 2px solid var(--border-color);
        background: var(--bg-color);
        color: var(--text-main);
        font-size: 16px;
        outline: none;
        font-family: inherit;
        box-sizing: border-box;
      }
      .search-inp:focus {
        border-color: var(--primary);
      }
      .cat-scroll {
        display: flex;
        gap: 8px;
        padding: 8px 16px;
        overflow-x: auto;
        border-bottom: 1px solid var(--border-color);
      }
      .cat-scroll::-webkit-scrollbar {
        display: none;
      }
      .cat-btn {
        flex-shrink: 0;
        padding: 6px 14px;
        border-radius: 100px;
        border: 2px solid var(--border-color);
        background: transparent;
        color: var(--text-muted);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        white-space: nowrap;
      }
      .cat-btn.active {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
      }
      .item-grid-wrap {
        flex: 1;
        overflow-y: auto;
        padding: 12px;
      }
      .item-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
        gap: 10px;
      }
      .item-card {
        background: var(--card-bg);
        border: 2px solid var(--border-color);
        border-radius: 14px;
        padding: 12px;
        cursor: pointer;
        transition: 0.15s;
        user-select: none;
      }
      .item-card:hover {
        border-color: var(--primary);
        transform: translateY(-2px);
      }
      .item-card:active {
        transform: scale(0.95);
      }
      .item-name {
        font-size: 14px;
        font-weight: 700;
        margin-bottom: 6px;
        color: var(--text-main);
        line-height: 1.3;
      }
      .item-price {
        font-size: 15px;
        font-weight: 700;
        color: var(--primary);
      }
      .item-stock {
        font-size: 12px;
        color: var(--text-muted);
        margin-top: 4px;
      }
      .stock-low {
        color: #f59e0b !important;
        font-weight: 700;
      }
      .stock-empty {
        color: #ef4444 !important;
        font-weight: 700;
      }
      .cart-header {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border-color);
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
      }
      .cart-items {
        flex: 1;
        overflow-y: auto;
      }
      .cart-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--border-color);
      }
      .ci-info {
        flex: 1;
        min-width: 0;
      }
      .ci-name {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-main);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .ci-price {
        font-size: 12px;
        color: var(--text-muted);
      }
      .qty-ctrl {
        display: flex;
        align-items: center;
        gap: 5px;
        flex-shrink: 0;
      }
      .qty-btn {
        width: 26px;
        height: 26px;
        border-radius: 7px;
        border: none;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--border-color);
        color: var(--text-main);
      }
      .qty-btn:hover {
        background: var(--primary);
        color: #fff;
      }
      .ci-sub {
        font-size: 13px;
        font-weight: 700;
        color: var(--primary);
        width: 70px;
        text-align: right;
        flex-shrink: 0;
      }
      .ci-del {
        background: rgba(239, 68, 68, 0.15);
        color: #ef4444;
        border: none;
        border-radius: 5px;
        width: 20px;
        height: 20px;
        font-size: 12px;
        cursor: pointer;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .cart-footer {
        padding: 12px 16px;
        border-top: 1px solid var(--border-color);
        flex-shrink: 0;
      }
      .ttl-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
        font-size: 14px;
      }
      .pay-btns {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        margin-bottom: 8px;
      }
      .pay-btn {
        padding: 9px 4px;
        border-radius: 9px;
        border: 2px solid var(--border-color);
        background: transparent;
        color: var(--text-muted);
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        font-family: inherit;
        text-align: center;
      }
      .pay-btn.active {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
      }
      .qc-row {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 5px;
        margin-bottom: 8px;
      }
      .qc-btn {
        padding: 7px 2px;
        border-radius: 7px;
        border: 1px solid var(--border-color);
        background: var(--bg-color);
        color: var(--text-muted);
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        font-family: inherit;
      }
      .bayar-btn {
        width: 100%;
        height: 48px;
        font-size: 16px;
        font-weight: 700;
        background: var(--primary);
        color: #fff;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        font-family: inherit;
      }
      .bayar-btn:active {
        transform: scale(0.97);
      }

      /* FAB keranjang (mobile) */
      .fab-wrap {
        display: none;
        position: fixed;
        bottom: 20px;
        right: 16px;
        z-index: 200;
      }
      @media (max-width: 900px) {
        .fab-wrap {
          display: block;
        }
      }
      .fab-btn {
        width: 52px;
        height: 52px;
        border-radius: 14px;
        background: var(--primary);
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        box-shadow: 0 4px 16px rgba(249, 115, 22, 0.45);
        position: relative;
        color: #fff;
      }
      .fab-badge {
        position: absolute;
        top: -7px;
        right: -7px;
        background: #ef4444;
        color: #fff;
        border-radius: 99px;
        min-width: 20px;
        height: 20px;
        font-size: 11px;
        font-weight: 900;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 4px;
        border: 2px solid var(--bg-color);
      }

      /* TAMPILAN MODERN SCANNER & ANIMASI LASER */
      .scanner-modal-content {
        background: linear-gradient(145deg, #1e293b, #0f172a);
        padding: 24px;
        border-radius: 20px;
        width: 100%;
        max-width: 380px;
        text-align: center;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .scanner-view-wrapper {
        position: relative;
        width: 100%;
        border-radius: 12px;
        overflow: hidden;
        border: 2px solid var(--primary);
        margin-bottom: 20px;
        background: #000;
      }
      .scanner-laser {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 3px;
        background: #10b981;
        box-shadow:
          0 0 15px #10b981,
          0 0 30px #10b981;
        animation: scanLaser 1.5s infinite alternate ease-in-out;
        z-index: 100;
      }
      @keyframes scanLaser {
        0% {
          top: 5%;
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        90% {
          opacity: 1;
        }
        100% {
          top: 95%;
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="pos-layout">
      <div class="pos-left">
        <div class="search-bar">
          <div
            style="
              display: flex;
              gap: 8px;
              align-items: center;
              margin-bottom: 8px;
            "
          >
            <button
              class="btn"
              style="
                padding: 10px 14px;
                background: var(--card-bg);
                border: 1px solid var(--border-color);
                flex-shrink: 0;
                font-size: 13px;
              "
              onclick="location.href = '/dashboard'"
            >
              ← Kembali
            </button>
            <input
              type="text"
              id="searchInp"
              class="search-inp"
              placeholder="🔍 Cari barang / scan barcode..."
              autofocus
              autocomplete="off"
              oninput="filterItems()"
              onkeydown="onSearchKey(event)"
            />

            <button
              class="btn"
              style="
                padding: 10px 16px;
                background: linear-gradient(135deg, var(--primary), #0284c7);
                color: #fff;
                border: none;
                border-radius: 100px;
                cursor: pointer;
                flex-shrink: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 18px;
                box-shadow: 0 4px 10px rgba(14, 165, 233, 0.3);
              "
              onclick="bukaKameraPOS()"
              title="Buka Kamera"
            >
              📷
            </button>

            <div class="fab-wrap">
              <button
                class="fab-btn"
                onclick="toggleCart()"
                title="Buka keranjang"
              >
                🛒
                <span class="fab-badge" id="fabBadge" style="display: none"
                  >0</span
                >
              </button>
            </div>
          </div>
          <div class="cat-scroll" id="catBar">
            <button class="cat-btn active" onclick="setCat('')" id="cat_all">
              Semua
            </button>
          </div>
        </div>
        <div class="item-grid-wrap">
          <div class="item-grid" id="itemGrid"></div>
          <div
            id="emptyItems"
            style="
              display: none;
              text-align: center;
              padding: 60px 20px;
              color: var(--text-muted);
            "
          >
            <div style="font-size: 48px; margin-bottom: 12px">📦</div>
            <p>Tidak ada barang</p>
          </div>
        </div>
      </div>

      <div class="pos-right" id="cartPanel">
        <div class="cart-header">
          <div style="font-size: 16px; font-weight: 800">
            🛒 Tagihan &nbsp;
            <span
              id="cartCount"
              style="
                background: var(--primary-light);
                color: var(--primary);
                padding: 2px 10px;
                border-radius: 99px;
                font-size: 13px;
              "
              >0</span
            >
          </div>
          <div style="display: flex; align-items: center; gap: 8px">
            <button
              onclick="clearCart()"
              style="
                font-size: 12px;
                color: var(--text-muted);
                background: none;
                border: none;
                cursor: pointer;
                font-family: inherit;
              "
            >
              Kosongkan
            </button>
            <button
              id="btnCloseCart"
              onclick="toggleCart()"
              style="
                display: none;
                background: none;
                border: none;
                font-size: 22px;
                cursor: pointer;
                color: var(--text-muted);
                line-height: 1;
              "
            >
              ×
            </button>
          </div>
        </div>

        <div
          style="
            padding: 8px 12px;
            border-bottom: 1px solid var(--border-color);
          "
        >
          <select
            id="custSel"
            class="input-control"
            style="margin: 0; padding: 9px 12px; font-size: 13px"
          >
            <option value="">👤 Pelanggan Umum</option>
          </select>
        </div>

        <div class="cart-items" id="cartList">
          <div
            style="
              padding: 32px;
              text-align: center;
              color: var(--text-muted);
              font-size: 14px;
            "
          >
            Belum ada barang
          </div>
        </div>

        <div class="cart-footer">
          <div class="ttl-row">
            <span style="color: var(--text-muted)">Subtotal</span
            ><span id="subtotalEl">Rp 0</span>
          </div>
          <div
            style="
              display: grid;
              grid-template-columns: 1fr 1fr;
              gap: 8px;
              margin-bottom: 8px;
            "
          >
            <div
              style="
                background: var(--bg-color);
                border-radius: 9px;
                padding: 7px 10px;
                display: flex;
                align-items: center;
                gap: 5px;
              "
            >
              <span
                style="
                  font-size: 11px;
                  color: var(--text-muted);
                  flex-shrink: 0;
                "
                >Disk%</span
              >
              <input
                id="discPct"
                type="number"
                min="0"
                max="100"
                value="0"
                oninput="recalc()"
                style="
                  flex: 1;
                  width: 0;
                  background: transparent;
                  border: none;
                  outline: none;
                  font-size: 14px;
                  font-weight: 700;
                  text-align: right;
                  font-family: inherit;
                  color: var(--text-main);
                "
              />
            </div>
            <div
              style="
                background: var(--bg-color);
                border-radius: 9px;
                padding: 7px 10px;
                display: flex;
                align-items: center;
                gap: 5px;
              "
            >
              <span
                style="
                  font-size: 11px;
                  color: var(--text-muted);
                  flex-shrink: 0;
                "
                >PPN%</span
              >
              <input
                id="taxPct"
                type="number"
                min="0"
                max="100"
                value="0"
                oninput="recalc()"
                style="
                  flex: 1;
                  width: 0;
                  background: transparent;
                  border: none;
                  outline: none;
                  font-size: 14px;
                  font-weight: 700;
                  text-align: right;
                  font-family: inherit;
                  color: var(--text-main);
                "
              />
            </div>
          </div>
          <div
            class="ttl-row"
            style="
              font-size: 19px;
              font-weight: 900;
              border-top: 2px solid var(--border-color);
              padding-top: 8px;
              margin-bottom: 10px;
            "
          >
            <span>TOTAL</span
            ><span id="totalEl" style="color: var(--primary)">Rp 0</span>
          </div>
          <div class="pay-btns">
            <button class="pay-btn active" id="payC" onclick="setPay('cash')">
              💵 Cash
            </button>
            <button class="pay-btn" id="payT" onclick="setPay('transfer')">
              🏦 Transfer
            </button>
            <button class="pay-btn" id="payK" onclick="setPay('card')">
              💳 Kartu
            </button>
          </div>
          <input
            id="paidInp"
            type="number"
            inputmode="numeric"
            placeholder="Uang diterima"
            value="0"
            oninput="calcChange()"
            style="
              width: 100%;
              padding: 10px 12px;
              border-radius: 10px;
              border: 2px solid var(--border-color);
              background: var(--bg-color);
              color: var(--text-main);
              font-size: 16px;
              font-weight: 700;
              text-align: right;
              margin-bottom: 7px;
              font-family: inherit;
              outline: none;
              box-sizing: border-box;
            "
          />
          <div class="qc-row">
            <button class="qc-btn" onclick="setQC(10000)">10rb</button>
            <button class="qc-btn" onclick="setQC(20000)">20rb</button>
            <button class="qc-btn" onclick="setQC(50000)">50rb</button>
            <button class="qc-btn" onclick="setQCExact()">Pas</button>
          </div>
          <div class="ttl-row" style="margin-bottom: 10px">
            <span style="color: var(--text-muted)">Kembalian</span>
            <span
              id="changeEl"
              style="font-size: 18px; font-weight: 800; color: #10b981"
              >Rp 0</span
            >
          </div>
          <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 8px">
            <button
              onclick="clearCart()"
              style="
                padding: 12px;
                border-radius: 10px;
                border: 2px solid var(--border-color);
                background: transparent;
                color: var(--text-muted);
                font-size: 14px;
                font-weight: 700;
                cursor: pointer;
                font-family: inherit;
              "
            >
              ✕
            </button>
            <button class="bayar-btn" onclick="prosesBayar()">✓ BAYAR</button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="rcptModal">
      <div
        id="rcptBox"
        style="
          background: #fff;
          color: #222;
          width: 100%;
          max-width: 360px;
          border-radius: 20px;
          padding: 24px;
          font-family: &quot;Courier New&quot;, monospace;
          max-height: 90vh;
          overflow-y: auto;
        "
      ></div>
    </div>

    <div
      class="modal-overlay"
      id="modalScannerPOS"
      style="
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        z-index: 9999;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        padding: 20px;
        backdrop-filter: blur(5px);
      "
    >
      <div class="scanner-modal-content">
        <h3
          style="
            margin-top: 0;
            color: var(--text-main);
            margin-bottom: 16px;
            font-size: 20px;
            font-weight: 800;
          "
        >
          📷 Arahkan Barcode
        </h3>

        <div class="scanner-view-wrapper">
          <div class="scanner-laser"></div>
          <div id="reader-pos" style="width: 100%; height: auto"></div>
        </div>

        <button
          class="btn"
          style="
            width: 100%;
            padding: 14px;
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid #ef4444;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
          "
          onclick="tutupKameraPOS()"
        >
          Tutup Scanner
        </button>
      </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/print.js"></script>
    <script>
      requireAuth();
      let allItems = [],
        cart = [],
        payMethod = "cash",
        lastSale = null,
        activeCat = "";

      async function init() {
        try {
          const [items, cats, custs] = await Promise.all([
            api("GET", "/items/?limit=500"),
            api("GET", "/items/categories"),
            api("GET", "/customers/?limit=300"),
          ]);
          allItems = items;
          const bar = document.getElementById("catBar");
          cats.forEach((c) => {
            const b = document.createElement("button");
            b.className = "cat-btn";
            b.textContent = c.name;
            b.id = "cat_" + c.id;
            b.onclick = () => setCat(c.id);
            bar.appendChild(b);
          });
          const s = document.getElementById("custSel");
          custs.forEach((c) => {
            const o = document.createElement("option");
            o.value = c.id;
            o.textContent = c.name;
            s.appendChild(o);
          });
          renderItems(allItems);
        } catch (e) {
          showToast("Gagal memuat: " + e.message, "error");
        }
      }

      function setCat(id) {
        activeCat = id;
        document
          .querySelectorAll(".cat-btn")
          .forEach((b) =>
            b.classList.toggle(
              "active",
              b.id === "cat_" + id || (id === "" && b.id === "cat_all"),
            ),
          );
        filterItems();
      }

      function filterItems() {
        const q = document
          .getElementById("searchInp")
          .value.toLowerCase()
          .trim();
        const f = allItems.filter((i) => {
          const mc = !activeCat || i.category_id == activeCat;
          const mq =
            !q ||
            i.name.toLowerCase().includes(q) ||
            i.code?.toLowerCase().includes(q) ||
            (i.barcode || "").includes(q);
          return mc && mq;
        });
        renderItems(f);
      }

      function onSearchKey(e) {
        if (e.key !== "Enter") return;
        const q = document.getElementById("searchInp").value.trim();
        const ex = allItems.find(
          (i) => i.barcode === q || i.code?.toLowerCase() === q.toLowerCase(),
        );
        if (ex) {
          addCart(ex.id);
          document.getElementById("searchInp").value = "";
          filterItems();
          return;
        }
        const vis = allItems.filter((i) =>
          i.name.toLowerCase().includes(q.toLowerCase()),
        );
        if (vis.length === 1) {
          addCart(vis[0].id);
          document.getElementById("searchInp").value = "";
          filterItems();
        } else if (q) showToast(`"${q}" tidak ditemukan`, "warning");
      }

      function renderItems(items) {
        const g = document.getElementById("itemGrid");
        document.getElementById("emptyItems").style.display = items.length
          ? "none"
          : "block";
        if (!items.length) {
          g.innerHTML = "";
          return;
        }
        g.innerHTML = items
          .map((i) => {
            let sc = "item-stock",
              st = "Stok " + i.stock;
            if (i.stock <= 0) {
              sc = "item-stock stock-empty";
              st = "Habis";
            } else if (i.stock <= i.min_stock) {
              sc = "item-stock stock-low";
              st = "Sisa " + i.stock;
            }
            return `<div class="item-card" onclick="addCart(${i.id})">
      <div class="item-name">${i.name}</div>
      <div class="item-price">${fmtRp(i.sell_price)}</div>
      <div class="${sc}">${st}</div>
    </div>`;
          })
          .join("");
      }

      // FUNGSI ADDCART YANG LEBIH KUAT
      function addCart(id) {
        const item = allItems.find((i) => i.id === id);
        if (!item) return false;

        if (item.stock <= 0) {
          showToast(item.name + " kehabisan stok!", "error");
          return false;
        }

        const ex = cart.find((c) => c.id === id);
        if (ex) {
          if (ex.qty >= item.stock) {
            showToast("Stok " + item.name + " tidak cukup", "error");
            return false;
          }
          ex.qty++;
        } else {
          cart.push({
            id,
            name: item.name,
            price: item.sell_price,
            qty: 1,
            stock: item.stock,
          });
        }

        renderCart();
        recalc();
        return true;
      }

      function changeQty(i, d) {
        cart[i].qty = Math.max(1, Math.min(cart[i].stock, cart[i].qty + d));
        renderCart();
        recalc();
      }
      function removeCart(i) {
        cart.splice(i, 1);
        renderCart();
        recalc();
      }
      function clearCart() {
        cart = [];
        renderCart();
        recalc();
        document.getElementById("paidInp").value = 0;
        document.getElementById("changeEl").textContent = "Rp 0";
      }

      function renderCart() {
        const n = cart.reduce((a, c) => a + c.qty, 0);
        document.getElementById("cartCount").textContent = n;
        const badge = document.getElementById("fabBadge");
        badge.textContent = n;
        badge.style.display = n ? "flex" : "none";
        const list = document.getElementById("cartList");
        if (!cart.length) {
          list.innerHTML =
            '<div style="padding:32px;text-align:center;color:var(--text-muted);font-size:14px">Belum ada barang</div>';
          return;
        }
        list.innerHTML = cart
          .map(
            (c, i) => `
    <div class="cart-item">
      <div class="ci-info"><div class="ci-name">${c.name}</div><div class="ci-price">${fmtRp(c.price)}</div></div>
      <div class="qty-ctrl">
        <button class="qty-btn" onclick="changeQty(${i},-1)">−</button>
        <span style="font-size:14px;font-weight:700;min-width:18px;text-align:center">${c.qty}</span>
        <button class="qty-btn" onclick="changeQty(${i},1)">+</button>
      </div>
      <div class="ci-sub">${fmtRp(c.price * c.qty)}</div>
      <button class="ci-del" onclick="removeCart(${i})">✕</button>
    </div>`,
          )
          .join("");
      }

      function recalc() {
        const sub = cart.reduce((s, c) => s + c.price * c.qty, 0);
        const dp = parseFloat(document.getElementById("discPct").value) || 0;
        const tp = parseFloat(document.getElementById("taxPct").value) || 0;
        const disc = sub * (dp / 100),
          tax = (sub - disc) * (tp / 100),
          total = sub - disc + tax;
        document.getElementById("subtotalEl").textContent = fmtRp(sub);
        document.getElementById("totalEl").textContent = fmtRp(total);
        calcChange();
      }
      function getTotal() {
        return (
          parseFloat(
            document
              .getElementById("totalEl")
              .textContent.replace(/[^0-9]/g, ""),
          ) || 0
        );
      }
      function calcChange() {
        const t = getTotal(),
          p = parseFloat(document.getElementById("paidInp").value) || 0;
        document.getElementById("changeEl").textContent = fmtRp(
          Math.max(0, p - t),
        );
      }
      function setQC(a) {
        document.getElementById("paidInp").value =
          Math.ceil(getTotal() / a) * a;
        calcChange();
      }
      function setQCExact() {
        document.getElementById("paidInp").value = getTotal();
        calcChange();
      }

      function setPay(m) {
        payMethod = m;
        ["C", "T", "K"].forEach((x) =>
          document.getElementById("pay" + x).classList.remove("active"),
        );
        document
          .getElementById("pay" + { cash: "C", transfer: "T", card: "K" }[m])
          .classList.add("active");
        if (m !== "cash") setQCExact();
      }

      function toggleCart() {
        const p = document.getElementById("cartPanel"),
          btn = document.getElementById("btnCloseCart");
        p.classList.toggle("show");
        btn.style.display = p.classList.contains("show") ? "block" : "none";
      }

      async function prosesBayar() {
        if (!cart.length) {
          showToast("Keranjang kosong", "error");
          return;
        }
        const total = getTotal(),
          paid = parseFloat(document.getElementById("paidInp").value) || 0;
        if (payMethod === "cash" && paid < total) {
          showToast("Uang kurang " + fmtRp(total - paid), "error");
          return;
        }
        const custId = document.getElementById("custSel").value;
        try {
          showLoading("Memproses transaksi...");
          const sale = await api("POST", "/sales/", {
            date: today(),
            customer_id: custId ? parseInt(custId) : null,
            discount: parseFloat(document.getElementById("discPct").value) || 0,
            tax: parseFloat(document.getElementById("taxPct").value) || 0,
            paid: payMethod === "cash" ? paid : total,
            payment_method: payMethod,
            items: cart.map((c) => ({
              item_id: c.id,
              qty: c.qty,
              sell_price: c.price,
              discount: 0,
            })),
          });
          hideLoading();
          cart.forEach((c) => {
            const it = allItems.find((x) => x.id === c.id);
            if (it) it.stock -= c.qty;
          });
          filterItems();
          lastSale = sale;
          showReceipt(sale);

          // Getar sukses bayar (kalau hp dukung)
          if (navigator.vibrate) navigator.vibrate([60, 30, 60]);
        } catch (e) {
          hideLoading();
          showToast(e.message, "error");
        }
      }

      function showReceipt(s) {
        // Paksa nama tokonya menjadi Eva Store jika belum disetting
        const ps = JSON.parse(
          localStorage.getItem("ipos_print_settings") || "{}",
        );
        const storeName = ps.storeName || "Eva Store";
        const storeFooter =
          ps.storeFooter || "Terima kasih telah berbelanja di Eva Store!";

        const items = (s.items || [])
          .map(
            (
              i,
            ) => `<div style="display:flex;justify-content:space-between;margin-bottom:4px">
                  <span>${i.item?.name || "Item"} ×${i.qty}</span>
                  <span>${fmtRp(i.total)}</span>
                </div>`,
          )
          .join("");

        document.getElementById("rcptBox").innerHTML = `
        <div style="text-align:center;margin-bottom:12px">
            <b style="font-size:17px">${storeName}</b>
            <div style="font-size:12px;color:#666">Struk • ${fmtDate(s.date)}</div>
        </div>
        <div style="border-top:2px dashed #ccc;border-bottom:2px dashed #ccc;padding:8px 0;margin:8px 0">${items}</div>
        <div style="font-size:13px">
            <div style="display:flex;justify-content:space-between;margin-bottom:5px"><span>Subtotal</span><span>${fmtRp(s.subtotal)}</span></div>
            <div style="display:flex;justify-content:space-between;font-size:17px;font-weight:900;border-top:2px solid #ccc;padding-top:7px;margin-top:3px"><span>TOTAL</span><span>${fmtRp(s.total)}</span></div>
            <div style="display:flex;justify-content:space-between;margin-top:5px"><span>Bayar</span><span>${fmtRp(s.paid)}</span></div>
            <div style="display:flex;justify-content:space-between;font-weight:900;color:#10b981;margin-top:3px"><span>Kembalian</span><span>${fmtRp(s.change)}</span></div>
        </div>
        <div style="text-align:center;margin-top:12px;font-size:11px;color:#888">${storeFooter}</div>
        
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px">
            <button onclick='printReceipt(${JSON.stringify(s)})' style="padding:11px;border-radius:9px;background:#10b981;color:#fff;border:none;font-size:13px;font-weight:700;cursor:pointer">🖨️ Cetak</button>
            <button onclick="newTrx()" style="padding:11px;border-radius:9px;background:#1e293b;color:#fff;border:none;font-size:13px;font-weight:700;cursor:pointer">✓ Selesai</button>
        </div>`;

        openModal("rcptModal");
      }

      // --- TAMBAHKAN FUNGSI BARU INI ---
      async function printReceipt(saleData) {
        const btnCetak = event.currentTarget; // Ambil elemen tombol yang diklik
        const teksAsli = btnCetak.innerHTML;

        try {
          btnCetak.innerHTML = "⏳ Mencetak...";
          btnCetak.disabled = true;

          const ps = JSON.parse(
            localStorage.getItem("ipos_print_settings") || "{}",
          );

          // Menembak API Python kita yang akan mengobrol dengan Windows
          const response = await fetch("/api/sales/print", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              sale: saleData,
              settings: {
                storeName: ps.storeName || "Eva Store",
                storeFooter: ps.storeFooter || "Terima kasih!",
              },
            }),
          });

          const result = await response.json();

          if (!response.ok) {
            throw new Error(result.detail || "Gagal mencetak");
          }

          btnCetak.innerHTML = "✅ Tercetak!";
          setTimeout(() => {
            btnCetak.innerHTML = teksAsli;
            btnCetak.disabled = false;
          }, 2000);
        } catch (error) {
          console.error("Print error:", error);
          alert("Gagal terhubung ke printer:\n" + error.message);
          btnCetak.innerHTML = teksAsli;
          btnCetak.disabled = false;
        }
      }

      function newTrx() {
        closeModal("rcptModal");
        clearCart();
      }

      // ==========================================
      // LOGIKA KAMERA MODERN (ANTI DOUBLE-SCAN)
      // ==========================================
      let html5QrCodeScannerPOS;
      let isScannerLocked = false; // Gembok pelindung double-scan

      // Bunyi Hardware Asli (Bukan MP3, tidak akan diblokir Chrome)
      function playBeep() {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          const ctx = new AudioContext();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = "sine";
          osc.frequency.setValueAtTime(880, ctx.currentTime); // Frekuensi 880Hz (Nada A5)
          gain.gain.setValueAtTime(0.1, ctx.currentTime); // Volume 10%
          osc.start();
          osc.stop(ctx.currentTime + 0.15); // Bunyi selama 150ms
        } catch (e) {
          console.log("AudioContext tidak didukung", e);
        }
      }

      function bukaKameraPOS() {
        document.getElementById("modalScannerPOS").style.display = "flex";
        isScannerLocked = false;
        html5QrCodeScannerPOS = new Html5Qrcode("reader-pos");

        // Setting Full-Frame (Bebas scan dari sudut manapun)
        const config = {
          fps: 15, // Dipercepat sedikit
          // qrbox SAYA HAPUS agar tidak mengunci fokus lensa HP A01
          videoConstraints: {
            facingMode: "environment",
            advanced: [{ focusMode: "continuous" }], // Paksa fokus otomatis (jika didukung HP)
          },
        };

        html5QrCodeScannerPOS
          .start(
            { facingMode: "environment" },
            config,
            function (decodedText) {
              // Kalau gembok tertutup (lagi memproses scan sebelumnya), abaikan!
              if (isScannerLocked) return;
              isScannerLocked = true; // Langsung tutup gembok

              // 1. Matikan Kamera
              tutupKameraPOS();

              // 2. Mainkan Suara & Getar Hardware (Mirip mesin kasir sungguhan)
              playBeep();
              if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

              // 3. Cari Barang di Database Offline
              let code = decodedText.trim();
              const ex = allItems.find(
                (i) =>
                  i.barcode === code ||
                  i.code?.toLowerCase() === code.toLowerCase(),
              );

              if (ex) {
                // Fungsi addCart mengembalikan 'true' jika berhasil masuk keranjang
                let success = addCart(ex.id);
                if (success) {
                  showToast("🛒 " + ex.name + " ditambahkan", "success");
                  document.getElementById("searchInp").value = "";
                }
              } else {
                showToast("❌ Barcode " + code + " tidak dikenali", "error");
              }
            },
            function (errorMessage) {
              // Abaikan error saat sedang mencari fokus (normal)
            },
          )
          .catch((err) => {
            tutupKameraPOS();
            showToast(
              "Gagal akses kamera! Pastikan pakai HTTPS/Ngrok.",
              "error",
            );
          });
      }

      function tutupKameraPOS() {
        document.getElementById("modalScannerPOS").style.display = "none";
        isScannerLocked = true;
        if (html5QrCodeScannerPOS) {
          html5QrCodeScannerPOS
            .stop()
            .catch((err) => console.log("Kamera sudah berhenti", err));
        }
      }

      init();
    </script>
  </body>
</html>
