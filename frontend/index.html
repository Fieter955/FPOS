<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login - FPOS</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body
    style="
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-image: radial-gradient(
        circle at top right,
        var(--primary-light),
        transparent 40%
      );
    "
  >
    <div class="card" style="width: 100%; max-width: 420px; text-align: center">
      <div style="margin-bottom: 32px">
        <div
          style="
            width: 72px;
            height: 72px;
            background: var(--primary);
            color: #fff;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin-bottom: 16px;
            box-shadow: 0 10px 24px var(--primary-light);
          "
        >
          🧱
        </div>
        <h1 style="font-size: 28px; margin: 0 0 6px">FPOS</h1>
        <p style="margin: 0">Sistem kasir toko bangunan</p>
      </div>
      <div
        id="errMsg"
        style="
          display: none;
          color: #ef4444;
          background: rgba(239, 68, 68, 0.1);
          padding: 12px;
          border-radius: 10px;
          margin-bottom: 20px;
          font-weight: 600;
          font-size: 14px;
        "
      ></div>
      <form id="loginForm">
        <div class="input-group">
          <label>Username</label
          ><input
            type="text"
            id="uname"
            class="input-control"
            placeholder="admin"
            required
            autocomplete="username"
          />
        </div>
        <div class="input-group">
          <label>Password</label
          ><input
            type="password"
            id="upass"
            class="input-control"
            placeholder="••••••••"
            required
          />
        </div>
        <button
          type="submit"
          id="btnLogin"
          class="btn btn-primary"
          style="width: 100%; margin-top: 8px; height: 54px; font-size: 17px"
        >
          Masuk Sekarang
        </button>
      </form>
      <p style="margin-top: 20px; font-size: 13px; color: var(--text-muted)">
        Default: <b>admin</b> / <b>admin123</b>
      </p>
    </div>
    <script src="/js/api.js"></script>
    <script src="/js/theme.js"></script>
    <script>
      if (getToken()) window.location.href = "/dashboard";
      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const btn = document.getElementById("btnLogin"),
            err = document.getElementById("errMsg");
          btn.disabled = true;
          btn.textContent = "Memproses...";
          err.style.display = "none";
          try {
            const fd = new FormData();
            fd.append(
              "username",
              document.getElementById("uname").value.trim(),
            );
            fd.append("password", document.getElementById("upass").value);
            const r = await apiForm("/auth/login", fd);
            setToken(r.access_token);
            localStorage.setItem("ipos_user", JSON.stringify(r.user));
            window.location.href = "/dashboard";
          } catch (ex) {
            err.textContent = ex.message || "Username atau password salah.";
            err.style.display = "block";
          } finally {
            btn.disabled = false;
            btn.textContent = "Masuk Sekarang";
          }
        });
    </script>
  </body>
</html>
