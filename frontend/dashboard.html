<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Dashboard - FPOS</title>
    <link rel="stylesheet" href="/css/style.css?v=20260820-workspace-hit-test" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f172a" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="iPos 5.0" />
    <style>
      .section-title {
        font-size: 18px;
        color: var(--text-muted);
        margin: 36px 0 16px;
        padding-bottom: 8px;
        border-bottom: 2px solid var(--border-color);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .grid-cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 20px;
      }
      .module-ribbon {
        margin-top: 32px;
        overflow: hidden;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-lg);
        background: var(--card-bg);
        box-shadow: var(--shadow-sm);
      }
      .module-ribbon-header {
        padding: 20px 22px 12px;
      }
      .module-ribbon-header h2 {
        margin: 0;
        color: var(--text-main);
        font-size: 20px;
      }
      .module-ribbon-header p {
        margin: 5px 0 0;
        color: var(--text-muted);
        font-size: 13px;
      }
      .menu-category-tabs {
        display: flex;
        gap: 4px;
        overflow-x: auto;
        padding: 0 14px;
        border-bottom: 1px solid var(--border-color);
        scrollbar-width: thin;
      }
      .menu-category-tab {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 48px;
        padding: 0 15px;
        border: 0;
        border-bottom: 3px solid transparent;
        background: transparent;
        color: var(--text-muted);
        cursor: pointer;
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        white-space: nowrap;
      }
      .menu-category-tab:hover {
        color: var(--primary);
        background: var(--primary-light);
      }
      .menu-category-tab.is-active {
        color: var(--primary);
        border-bottom-color: var(--primary);
      }
      .menu-category-tab:focus-visible {
        outline: 3px solid var(--primary-light);
        outline-offset: -3px;
      }
      .menu-category-panel {
        display: grid;
        gap: 24px;
        padding: 22px;
      }
      .menu-category-panel[hidden] {
        display: none;
      }
      .menu-group-title {
        margin: 0 0 11px;
        color: var(--text-muted);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .menu-group-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
        gap: 12px;
      }
      .menu-group-grid .menu-card {
        position: relative;
        min-height: 144px;
        padding: 18px 14px;
      }
      .menu-group-grid .menu-card h3 {
        margin: 10px 0 4px;
        font-size: 15px;
      }
      .menu-group-grid .icon-w {
        width: 52px;
        height: 52px;
        font-size: 24px;
      }
      .menu-badge {
        position: absolute;
        top: 9px;
        right: 9px;
        display: none;
        align-items: center;
        justify-content: center;
        min-width: 25px;
        height: 25px;
        padding: 0 6px;
        border: 2px solid var(--card-bg);
        border-radius: 999px;
        background: #ef4444;
        color: #fff;
        box-shadow: 0 4px 10px rgba(239, 68, 68, 0.3);
        font-size: 12px;
        font-weight: 900;
      }
      @media (max-width: 640px) {
        .module-ribbon-header,
        .menu-category-panel {
          padding-left: 16px;
          padding-right: 16px;
        }
        .menu-category-tab {
          padding: 0 12px;
        }
        .menu-group-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .menu-group-grid .menu-card {
          min-height: 132px;
        }
      }
      .menu-card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-lg);
        padding: 28px 20px;
        text-align: center;
        cursor: pointer;
        box-shadow: var(--shadow-sm);
        transition: var(--transition);
      }
      .menu-card:hover {
        transform: translateY(-6px);
        border-color: var(--primary);
        box-shadow: var(--shadow-lg);
      }
      .menu-card:focus-visible {
        outline: 3px solid var(--primary-light);
        outline-offset: 3px;
        border-color: var(--primary);
      }
      .menu-card h3 {
        font-size: 18px;
        margin: 14px 0 6px;
      }
      .menu-card p {
        font-size: 13px;
        margin: 0;
        color: var(--text-muted);
      }
      .icon-w {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 68px;
        height: 68px;
        border-radius: 50%;
        background: var(--primary-light);
        color: var(--primary);
        font-size: 30px;
        transition: var(--transition);
      }
      .menu-card:hover .icon-w {
        background: var(--primary);
        color: #fff;
      }
      .kpi-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-bottom: 8px;
      }
      .kpi-card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-lg);
        padding: 24px;
        box-shadow: var(--shadow-sm);
      }
      .kpi-card.is-clickable {
        cursor: pointer;
        transition: var(--transition);
      }
      .kpi-card.is-clickable:hover,
      .kpi-card.is-clickable:focus-visible {
        transform: translateY(-4px);
        border-color: var(--primary);
        box-shadow: var(--shadow-lg);
        outline: none;
      }
      .kpi-card[aria-disabled="true"] {
        cursor: default;
      }
      .kpi-val {
        font-size: clamp(1.25rem, 6vw, 1.75rem);
        font-weight: 700;
        color: var(--primary);
        margin: 0.5rem 0 0.25rem;
        overflow-wrap: anywhere;
      }
      .kpi-lbl {
        font-size: 14px;
        font-weight: 500;
        color: var(--text-muted);
      }
      .low-stock-preview {
        display: grid;
        gap: 8px;
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px solid var(--border-color);
      }
      .low-stock-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-width: 0;
      }
      .low-stock-info {
        min-width: 0;
      }
      .low-stock-name {
        display: block;
        overflow: hidden;
        color: var(--text-main);
        font-size: 13px;
        font-weight: 700;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .low-stock-code,
      .low-stock-qty,
      .low-stock-safe {
        color: var(--text-muted);
        font-size: 11px;
      }
      .low-stock-qty {
        flex: 0 0 auto;
        text-align: right;
      }
      .low-stock-status {
        display: block;
        color: #f59e0b;
        font-weight: 800;
      }
      .low-stock-status.is-empty {
        color: #ef4444;
      }
      .low-stock-safe {
        color: #10b981;
        font-size: 13px;
        font-weight: 700;
      }
      .low-stock-all {
        width: 100%;
        margin-top: 12px;
        padding: 8px 10px;
        border: 1px solid rgba(239, 68, 68, 0.35);
        border-radius: 8px;
        background: rgba(239, 68, 68, 0.08);
        color: #ef4444;
        cursor: pointer;
        font: inherit;
        font-size: 12px;
        font-weight: 800;
      }
      .low-stock-all:hover {
        background: rgba(239, 68, 68, 0.15);
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
        flex-wrap: wrap;
        gap: 12px;
      }
    </style>
  </head>

      <main class="main-content" style="max-width: 1200px; margin: 0 auto">
        <div class="topbar">
          <div>
            <h1 style="margin: 0; color: var(--primary)">FPOS 🧱</h1>
            <p style="margin: 0">Pilih modul operasional toko.</p>
          </div>
          <div style="display: flex; gap: 10px">
            <button
              class="btn"

                background: var(--card-bg);
                border: 1px solid var(--border-color);
              "

              🌓 Tema

            <button

              onclick="location.href = '/settings'"

              ⚙️ Pengaturan
            </button>
          </div>
        </div>

        <div class="kpi-grid" id="kpiGrid">
          <div class="kpi-card" data-kpi-target="sales">
            <div class="kpi-lbl">Omzet Hari Ini</div>
            <div class="kpi-val" id="kSales">—</div>
          </div>
          <div class="kpi-card" data-kpi-target="sales">
            <div class="kpi-lbl">Jumlah Transaksi</div>
            <div class="kpi-val" id="kTx">—</div>
          </div>
          <div class="kpi-card" data-kpi-target="purchases">
            <div class="kpi-lbl">Pembelian Hari Ini</div>
            <div class="kpi-val" id="kPur">—</div>
          </div>
          <div class="kpi-card" data-kpi-target="customers">
            <div class="kpi-lbl">Deposit Pelanggan</div>
            <div class="kpi-val" id="kCustDep">—</div>
          </div>
          <div class="kpi-card" data-kpi-target="suppliers">
            <div class="kpi-lbl">Deposit ke Supplier</div>
            <div class="kpi-val" id="kSuppDep">—</div>
          </div>
          <div class="kpi-card" id="lowStockCard" data-kpi-target="low-stock">
            <div class="kpi-lbl">Stok Menipis</div>
            <div class="kpi-val" id="kLow" style="color: #ef4444">—</div>
            <div
              class="low-stock-preview"
              id="kLowItems"
              aria-live="polite"
            ></div>
            <button
              class="low-stock-all"
              id="kLowAll"
              type="button"
              onclick="event.stopPropagation(); openLowStockList()"
              hidden
            >
              Lihat semua stok menipis →
            </button>
          </div>
        </div>

        <section class="module-ribbon" aria-labelledby="moduleRibbonTitle">
          <div class="module-ribbon-header">
            <h2 id="moduleRibbonTitle">Menu Modul</h2>
            <p>Pilih kategori, lalu buka fitur yang dibutuhkan.</p>
          </div>
          <div

            class="menu-category-tabs"
            role="tablist"
            aria-label="Kategori modul FPOS"
          ></div>
          <div id="menuCategoryPanels"></div>
        </section>
      </main>
    </div>

      function menuItemAllowed(item, category, state) {
        return (
          (!item.adminOnly || state?.is_admin) &&
          hasPermission(category.menuPermission, "show", state) &&
          hasPermission(item.permission, item.action, state) &&
          (item.requires || []).every(([key, action = "view"]) =>
            hasPermission(key, action, state),
          )
        );
      }

      function activateMenuCategory(categoryKey, { focus = false } = {}) {
        const tabs = Array.from(document.querySelectorAll(".menu-category-tab"));
        const panels = Array.from(document.querySelectorAll(".menu-category-panel"));
        tabs.forEach((tab) => {
          const active = tab.dataset.category === categoryKey;
          tab.classList.toggle("is-active", active);
          tab.setAttribute("aria-selected", String(active));
          tab.tabIndex = active ? 0 : -1;
          if (active && focus) tab.focus({ preventScroll: true });
        });
        panels.forEach((panel) => {
          panel.hidden = panel.dataset.category !== categoryKey;
        });
      }

      function createMenuCard(item) {
        const card = document.createElement("div");
        card.className = "menu-card";
        card.dataset.url = item.url;
        card.dataset.title = item.label;
        card.setAttribute("role", "link");
        card.tabIndex = 0;
        card.title = `Buka ${item.label}`;

        const icon = document.createElement("div");
        icon.className = "icon-w";
        icon.setAttribute("aria-hidden", "true");
        icon.textContent = item.icon;

        const title = document.createElement("h3");
        title.textContent = item.label;
        const description = document.createElement("p");
        description.textContent = item.description;
        card.append(icon, title, description);

        if (item.badgeId) {
          const badge = document.createElement("span");
          badge.id = item.badgeId;
          badge.className = "menu-badge";
          badge.textContent = "0";
          card.appendChild(badge);
        }

        card.addEventListener("click", () =>
          openWorkspaceTab(item.url, item.label),
        );
        return card;
      }

      function renderModuleRibbon(state) {
        const tabsRoot = document.getElementById("menuCategoryTabs");
        const panelsRoot = document.getElementById("menuCategoryPanels");
        tabsRoot.replaceChildren();
        panelsRoot.replaceChildren();

        const visibleCategories = MENU_CATEGORIES.map((category) => ({
          ...category,
          groups: category.groups
            .map((group) => ({
              ...group,
              items: group.items.filter((item) =>
                menuItemAllowed(item, category, state),
              ),
            }))
            .filter((group) => group.items.length),
        })).filter((category) => category.groups.length);

        visibleCategories.forEach((category) => {
          const tab = document.createElement("button");
          tab.type = "button";
          tab.className = "menu-category-tab";
          tab.dataset.category = category.key;
          tab.id = `menu-tab-${category.key}`;
          tab.setAttribute("role", "tab");
          tab.setAttribute("aria-controls", `menu-panel-${category.key}`);
          tab.innerHTML = `<span aria-hidden="true">${category.icon}</span><span>${category.label}</span>`;
          tab.addEventListener("click", () =>
            activateMenuCategory(category.key),
          );
          tab.addEventListener("keydown", (event) => {
            const tabs = Array.from(
              tabsRoot.querySelectorAll(".menu-category-tab"),
            );
            const index = tabs.indexOf(tab);
            let nextIndex = null;
            if (event.key === "ArrowRight") nextIndex = (index + 1) % tabs.length;
            if (event.key === "ArrowLeft") nextIndex = (index - 1 + tabs.length) % tabs.length;
            if (event.key === "Home") nextIndex = 0;
            if (event.key === "End") nextIndex = tabs.length - 1;
            if (nextIndex === null) return;
            event.preventDefault();
            activateMenuCategory(tabs[nextIndex].dataset.category, { focus: true });
            tabs[nextIndex].scrollIntoView({ behavior: "smooth", block: "nearest", inline: "nearest" });
          });
          tabsRoot.appendChild(tab);

          const panel = document.createElement("section");
          panel.className = "menu-category-panel";
          panel.dataset.category = category.key;
          panel.id = `menu-panel-${category.key}`;
          panel.setAttribute("role", "tabpanel");
          panel.setAttribute("aria-labelledby", tab.id);
          category.groups.forEach((group) => {
            const groupElement = document.createElement("section");
            const heading = document.createElement("h3");
            heading.className = "menu-group-title";
            heading.textContent = group.label;
            const grid = document.createElement("div");
            grid.className = "menu-group-grid";
            group.items.forEach((item) => grid.appendChild(createMenuCard(item)));
            groupElement.append(heading, grid);
            panel.appendChild(groupElement);
          });
          panelsRoot.appendChild(panel);
        });

        if (visibleCategories.length) {
          activateMenuCategory(visibleCategories[0].key);
        } else {
          document.querySelector(".module-ribbon").hidden = true;
        }
      }

      const kpiDestinations = {
        sales: {
          title: "Riwayat Penjualan",
          rule: ["sales.transaction", "view", "menu.sales"],
          url: () => {
            const date = today();
            return `/sales?start_date=${date}&end_date=${date}`;
          },
        },
        purchases: {
          title: "Pembelian",
          rule: ["purchase.transaction", "view", "menu.purchase"],
          url: () => {
            const date = today();
            return `/purchases?start_date=${date}&end_date=${date}`;
          },
        },
        customers: {
          title: "Data Pelanggan",
          rule: ["master.customer", "view", "menu.master"],
          url: () => "/customers?sort=deposit_desc",
        },
        suppliers: {
          title: "Data Supplier",
          rule: ["master.supplier", "view", "menu.master"],
          url: () => "/supplier/dashboard?sort=deposit_desc",
        },
        "low-stock": {
          title: "Mutasi Stok",
          rule: ["inventory.item_in", "view", "menu.inventory"],
          url: () => "/inventory?tab=low",
        },
      };

      function openKpiData(card) {
        if (!card?.classList.contains("is-clickable")) return;
        const destination = kpiDestinations[card.dataset.kpiTarget];
        if (!destination) return;
        openWorkspaceTab(destination.url(), destination.title);
      }

      function isKeyboardVisible(element) {
        if (!element || element.style.display === "none") return false;
        const style = window.getComputedStyle(element);
        return style.display !== "none" && style.visibility !== "hidden";
      }

      function moveDashboardCard(card, key, event) {
        const container = card.closest(".menu-group-grid, .grid-cards, .kpi-grid");
        if (!container) return;
        const selector = container.classList.contains("kpi-grid")
          ? ".kpi-card.is-clickable"
          : ".menu-card";
        const cards = Array.from(container.querySelectorAll(selector)).filter(
          isKeyboardVisible,
        );
        if (!cards.length) return;

        const currentRect = card.getBoundingClientRect();
        const currentCenterX = currentRect.left + currentRect.width / 2;
        const currentCenterY = currentRect.top + currentRect.height / 2;
        const isHorizontal = key === "ArrowLeft" || key === "ArrowRight";
        const direction = key === "ArrowLeft" || key === "ArrowUp" ? -1 : 1;
        const candidates = cards
          .filter((candidate) => candidate !== card)
          .map((candidate) => {
            const rect = candidate.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const delta = isHorizontal
              ? (centerX - currentCenterX) * direction
              : (centerY - currentCenterY) * direction;
            if (delta <= 0) return null;
            const crossDistance = isHorizontal
              ? Math.abs(centerY - currentCenterY)
              : Math.abs(centerX - currentCenterX);
            return { candidate, score: delta + crossDistance * 0.35 };
          })
          .filter(Boolean)
          .sort((a, b) => a.score - b.score);

        const next = candidates[0]?.candidate;
        if (!next) return;
        event.preventDefault();
        next.focus({ preventScroll: true });
        next.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }

      function configureMenuCardsKeyboard() {
        document.querySelectorAll(".menu-card").forEach((card) => {
          card.setAttribute("role", "link");
          card.tabIndex = isKeyboardVisible(card) ? 0 : -1;
        });
      }

      document.addEventListener("keydown", (event) => {
        if (event.defaultPrevented) return;
        const card = event.target.closest?.(".menu-card, .kpi-card");
        if (!card || event.target !== card) return;

        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          card.click();
          return;
        }

        if (
          ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(
            event.key,
          )
        ) {
          moveDashboardCard(card, event.key, event);
        }
      });

      function configureKpiCards(state) {
        document.querySelectorAll(".kpi-card[data-kpi-target]").forEach((card) => {
          const destination = kpiDestinations[card.dataset.kpiTarget];
          const rule = destination?.rule;
          const allowed = Boolean(
            rule &&
              hasPermission(rule[0], rule[1], state) &&
              hasPermission(rule[2], "show", state),
          );

          card.classList.toggle("is-clickable", allowed);
          card.setAttribute("aria-disabled", String(!allowed));
          if (allowed) {
            card.setAttribute("role", "link");
            card.tabIndex = 0;
            card.title = `Buka ${destination.title}`;
          } else {
            card.removeAttribute("role");
            card.removeAttribute("title");
            card.tabIndex = -1;
          }
        });
      }

      document.getElementById("kpiGrid").addEventListener("click", (event) => {
        const card = event.target.closest(".kpi-card[data-kpi-target]");
        if (card) openKpiData(card);
      });

      document.getElementById("kpiGrid").addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        const card = event.target.closest(".kpi-card[data-kpi-target]");
        if (!card || event.target !== card) return;
        event.preventDefault();
        openKpiData(card);
      });

      function formatStockQty(value) {
        return new Intl.NumberFormat("id-ID", {
          maximumFractionDigits: 4,
        }).format(Number(value) || 0);
      }

      function canOpenLowStockList() {
        const state = getPermissionState();
        return (
          hasPermission("inventory.item_in", "view", state) &&
          hasPermission("menu.inventory", "show", state)
        );
      }

      function renderLowStockItems(items) {
        const preview = document.getElementById("kLowItems");
        const viewAll = document.getElementById("kLowAll");
        const rows = Array.isArray(items) ? items : [];
        preview.replaceChildren();

        if (!rows.length) {
          const safe = document.createElement("div");
          safe.className = "low-stock-safe";
          safe.textContent = "✓ Semua stok aman";
          preview.appendChild(safe);
          viewAll.hidden = true;
          return;
        }

        rows.slice(0, 3).forEach((item) => {
          const row = document.createElement("div");
          row.className = "low-stock-row";

          const info = document.createElement("div");
          info.className = "low-stock-info";

          const name = document.createElement("span");
          name.className = "low-stock-name";
          name.textContent = item.name || "Barang tanpa nama";
          name.title = item.name || "Barang tanpa nama";

          const code = document.createElement("span");
          code.className = "low-stock-code";
          code.textContent = item.code || "Tanpa kode";

          const qty = document.createElement("div");
          qty.className = "low-stock-qty";
          qty.textContent = `${formatStockQty(item.stock)} / min ${formatStockQty(item.min_stock)}`;

          const status = document.createElement("span");
          const isEmpty = Number(item.stock) <= 0;
          status.className = `low-stock-status${isEmpty ? " is-empty" : ""}`;
          status.textContent = isEmpty ? "Habis" : "Menipis";

          info.append(name, code);
          qty.appendChild(status);
          row.append(info, qty);
          preview.appendChild(row);
        });

        viewAll.hidden = !canOpenLowStockList();
      }

      function openLowStockList() {
        if (!canOpenLowStockList()) return;
        openWorkspaceTab("/inventory?tab=low", "Mutasi Stok");
      }

      async function loadKPI() {
        try {
          console.log("1. Mulai memanggil API Dashboard...");
          const d = await api("GET", "/reports/dashboard");

          console.log("2. Data diterima dari server:", d);

          if (!document.getElementById("kSales"))
            console.error("Elemen kSales tidak ditemukan di HTML!");
          if (!document.getElementById("kTx"))
            console.error("Elemen kTx tidak ditemukan di HTML!");
          if (!document.getElementById("kPur"))
            console.error("Elemen kPur tidak ditemukan di HTML!");
          if (!document.getElementById("kLow"))
            console.error("Elemen kLow tidak ditemukan di HTML!");

          document.getElementById("kSales").textContent = fmtRp(
            d.total_sales_today || 0,
          );
          document.getElementById("kTx").textContent =
            (d.total_transactions_today || 0) + " transaksi";
          document.getElementById("kPur").textContent = fmtRp(
            d.total_purchases_today || 0,
          );
          document.getElementById("kCustDep").textContent = fmtRp(
            d.total_customer_deposit || 0,
          );
          document.getElementById("kSuppDep").textContent = fmtRp(
            d.total_supplier_deposit || 0,
          );
          document.getElementById("kLow").textContent =
            (d.low_stock_count || 0) + " item";
          renderLowStockItems(d.low_stock_items);

          console.log("3. Berhasil menempelkan data ke layar!");
        } catch (e) {
          console.error("❌ ERROR di loadKPI:", e);
          ["kSales", "kTx", "kPur", "kCustDep", "kSuppDep", "kLow"].forEach(
            (id) => {
              const element = document.getElementById(id);
              if (element) {
                element.textContent = "Gagal dimuat";
                element.title = e?.message || "Data dashboard tidak tersedia";
              }
            },
          );
          const preview = document.getElementById("kLowItems");
          preview.textContent = "Rincian stok tidak tersedia";
          document.getElementById("kLowAll").hidden = true;
        }
      }

      async function loadPOCount() {
          const badge = document.getElementById("poBadge");
          if (!badge) return;
          try {
              const res = await api("GET", "/po/count-pending");
              if (res.count > 0) {
                  badge.textContent = res.count;
                  badge.style.display = "flex";
              } else {
                  badge.style.display = "none";
              }
          } catch (e) { console.error("Gagal load PO count", e); }
      }
      // ==========================================
      // FITUR PENJAGA GERBANG (GATEKEEPER)
      // ==========================================
      async function checkGatekeeper() {
        try {
          // Asumsi prefix untuk accounting.py di main.py Anda adalah /accounting
          const res = await api("GET", "/accounting/setup-status");
          if (res.is_setup_completed === false) {
            // Di workspace, onboarding dibuka sebagai tab tanpa mengganti Dashboard.
            openWorkspaceTab("/onboarding.html", "Onboarding", true);
          }
        } catch (e) {
          console.error("Gagal mengecek status setup", e);
        }
      }

      async function initializeDashboardPermissions() {
        const state = await loadMyPermissions();
        configureKpiCards(state);
        renderModuleRibbon(state);
        configureMenuCardsKeyboard();

        const settingsButton = document.querySelector(".topbar button[onclick*='/settings']");
        if (settingsButton) {
          settingsButton.style.display =
            hasPermission("settings.general", "access", state) &&
            hasPermission("menu.settings", "show", state)
              ? ""
              : "none";
        }

        if (hasPermission("report.sales", "view", state)) loadKPI();
        else document.getElementById("kpiGrid").style.display = "none";
        if (hasPermission("purchase.order", "view", state)) loadPOCount();
        if (hasPermission("accounting.journal", "view", state)) checkGatekeeper();
      }

      initializeDashboardPermissions().catch((error) =>
        console.error("Gagal menerapkan hak akses dashboard", error),
      );

      // ==========================================
      // TAMBAHKAN KODE INI DI BAWAHNYA
      // ==========================================
      window.addEventListener("focus", () => {
        const state = getPermissionState();
        if (hasPermission("report.sales", "view", state)) loadKPI();
      });
    </script>
  </body>
</html>
