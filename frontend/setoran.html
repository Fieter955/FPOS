<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Setoran - FPOS</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/components.css" />
  </head>
  <body>
    <div class="app-container">
      <main class="main-content">
        <!-- Tombol Kembali Standard -->
        <button
          class="btn"
          style="background: transparent; color: var(--text-muted); padding: 0; margin-bottom: 16px;"
          onclick="location.href = '/dashboard'"
        >
          ← Kembali
        </button>

        <!-- Page Header Standard -->
        <div class="pg-header">
          <div>
            <h1 id="pageTitle">💸 Setoran Pendapatan</h1>
            <p id="pageDesc">Kelola penyetoran kas dari tiap shift ke Kas Utama/Pusat.</p>
          </div>
          <div style="display: flex; gap: 10px; align-items: center;">
            <div id="branchSelectorContainer" style="width: 250px; display: none;"></div>
            <button class="btn" style="background: var(--card-bg); border: 1px solid var(--border-color);" onclick="toggleTheme()">
              🌓 Tema
            </button>
          </div>
        </div>

        <!-- Summary Row Standard -->
        <div id="summaryRow" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 20px;">
          <div class="card" style="padding:18px">
            <div id="summaryLabel" style="font-size:13px;color:var(--text-muted);margin-bottom:4px">Kas Belum Disetor</div>
            <div id="kPending" style="font-size:22px;font-weight:800;color:var(--primary)">Rp 0</div>
            <div id="kCount" style="font-size:13px;color:var(--text-muted)">0 shift menunggu</div>
          </div>
        </div>

        <!-- Filter Bar Standard -->
        <div class="filter-bar">
          <input type="date" id="fStart" class="input-control" onchange="load()">
          <input type="date" id="fEnd" class="input-control" onchange="load()">
          <select id="fStatus" class="input-control" onchange="load()">
            <option value="pending">Belum Disetor (Pending)</option>
            <option value="deposited">Sudah Disetor (Shift)</option>
            <option value="history">Riwayat Setoran (Global)</option>
          </select>
          <button class="btn btn-primary" onclick="processAll()" id="btnAll" style="display:none">Setor Semua Sekaligus</button>
        </div>

        <!-- Table Wrap & Table Standard -->
        <div class="tbl-wrap">
          <table class="tbl">
            <thead id="tblHead">
              <tr>
                <th>No. Shift</th>
                <th>Waktu Tutup</th>
                <th>Kasir</th>
                <th>Kas Akhir</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="tblBody">
              <tr><td colspan="5" style="text-align:center;padding:24px;color:var(--text-muted)">Memuat data...</td></tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>

    <!-- Script Utama -->
    <script src="/js/api.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/components.js"></script>
    <script>
      requireAuth();
      let rawData = [];
      let currentUser = JSON.parse(localStorage.getItem("user") || "{}");
      let isMainBranch = currentUser.branch_id === 1;
      let selectedBranchId = null;
      let branchCombo = null;

      // Helper lokal untuk format
      const fmtDT = (d) => d ? new Date(d).toLocaleString("id-ID", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }) : "-";

      async function init() {
        if (isMainBranch) {
          document.getElementById("branchSelectorContainer").style.display = "block";
          document.getElementById("pageTitle").textContent = "📊 Monitoring Setoran Cabang";
          document.getElementById("pageDesc").textContent = "Pantau kas yang belum disetor dan riwayat setoran dari seluruh cabang.";
          
          try {
            const branches = await api("GET", "/branches");
            // Filter out Pusat from selector because we monitor other branches
            const subBranches = branches.filter(b => b.id !== 1);
            branchCombo = createPremiumCombo(document.getElementById("branchSelectorContainer"), subBranches, {
              placeholder: "🔍 Cari Cabang...",
              onSelect: (b) => {
                selectedBranchId = b ? b.id : null;
                load();
              }
            });
          } catch (e) {
            console.error("Failed to load branches", e);
          }
        }
        load();
      }

      async function load() {
        const start = document.getElementById("fStart").value;
        const end = document.getElementById("fEnd").value;
        const status = document.getElementById("fStatus").value;
        
        // Hide btnAll by default
        document.getElementById("btnAll").style.display = "none";

        if (status === 'history') {
          return loadHistory(start, end);
        }

        let url = `/branches/pending-deposits?status=${status}`;
        if (start) url += `&start_date=${start}`;
        if (end) url += `&end_date=${end}`;
        if (selectedBranchId) url += `&target_branch_id=${selectedBranchId}`;

        try {
          const res = await api("GET", url);
          
          if (res.is_summary) {
            renderSummaryView(res);
          } else {
            renderShiftView(res, status);
          }
        } catch (e) {
          showToast(e.message, "error");
        }
      }

      function renderSummaryView(res) {
        rawData = res.branches || [];
        const isPending = res.status === 'pending';
        
        document.getElementById("summaryLabel").textContent = isPending ? "Total Kas Pending (Semua Cabang)" : "Total Kas Sudah Setor (Semua Cabang)";
        document.getElementById("kPending").textContent = fmtRp(res.total);
        document.getElementById("kCount").textContent = `${rawData.length} cabang ${isPending ? 'memiliki kas pending' : 'telah menyetor kas'}`;

        const head = document.getElementById("tblHead");
        head.innerHTML = `
          <tr>
            <th>Kode</th>
            <th>Nama Cabang</th>
            <th style="text-align:right">${isPending ? 'Total Pending' : 'Total Sudah Setor'}</th>
            <th style="text-align:center">Jumlah Shift</th>
            <th>Aksi</th>
          </tr>
        `;

        const body = document.getElementById("tblBody");
        if (rawData.length === 0) {
          const msg = isPending ? 'Semua cabang sudah menyetorkan kas ✓' : 'Belum ada data setoran dari cabang';
          body.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:24px;color:var(--text-muted)">${msg}</td></tr>`;
          return;
        }

        body.innerHTML = rawData.map(b => `
          <tr>
            <td style="font-family:monospace;font-weight:700">${b.branch_code}</td>
            <td>${b.branch_name}</td>
            <td style="text-align:right;font-weight:700;color:var(--primary)">${fmtRp(b.total_amount)}</td>
            <td style="text-align:center">${b.shift_count} shift</td>
            <td>
              <button class="bsm" onclick="filterByBranch(${b.branch_id})">Lihat Detail</button>
            </td>
          </tr>
        `).join("");
      }

      function renderShiftView(res, status) {
        rawData = res.shifts || [];
        const label = status === 'pending' ? 'Kas Belum Disetor' : 'Total Kas Disetor';
        const countLabel = status === 'pending' ? 'shift menunggu' : 'shift disetor';
        
        document.getElementById("summaryLabel").textContent = label;
        document.getElementById("kPending").textContent = fmtRp(res.total);
        document.getElementById("kCount").textContent = `${rawData.length} ${countLabel}`;

        // Explicitly hide btnAll for Main Branch
        if (status === 'pending' && rawData.length > 1 && !isMainBranch) {
          document.getElementById("btnAll").style.display = "block";
        } else {
          document.getElementById("btnAll").style.display = "none";
        }

        const head = document.getElementById("tblHead");
        head.innerHTML = `
          <tr>
            <th>No. Shift</th>
            <th>Waktu Tutup</th>
            <th>Kasir</th>
            <th style="text-align:right">Kas Akhir</th>
            ${isMainBranch ? '' : '<th>Aksi</th>'}
          </tr>
        `;

        const body = document.getElementById("tblBody");
        if (rawData.length === 0) {
          const msg = status === 'pending' ? 'Semua shift sudah disetorkan ✓' : 'Tidak ada data shift ditemukan';
          body.innerHTML = `<tr><td colspan="${isMainBranch ? 4 : 5}" style="text-align:center;padding:24px;color:var(--text-muted)">${msg}</td></tr>`;
          return;
        }

        body.innerHTML = rawData.map(s => `
          <tr>
            <td style="font-family:monospace;font-weight:700;color:var(--primary)">${s.number}</td>
            <td style="font-size:13px">${fmtDT(s.closed_at)}</td>
            <td>${s.user}</td>
            <td style="font-weight:700;text-align:right">${fmtRp(s.closing_cash)}</td>
            ${isMainBranch ? '' : `
            <td>
              ${s.is_deposited ? '<span class="badge badge-success" style="background:#10b981;color:white;padding:4px 8px;border-radius:4px;font-size:12px">✓ Disetor</span>' : 
              `<button class="bsm bp" onclick="paySingle(${s.id}, ${s.closing_cash})">Setor Sekarang</button>`}
            </td>`}
          </tr>
        `).join("");
      }

      async function loadHistory(start, end) {
        let url = `/branches/deposits?dummy=1`;
        if (start) url += `&start_date=${start}`;
        if (end) url += `&end_date=${end}`;
        if (selectedBranchId) url += `&branch_id=${selectedBranchId}`;

        try {
          const res = await api("GET", url);
          const totalHistory = res.reduce((a, b) => a + b.amount, 0);
          
          document.getElementById("summaryLabel").textContent = "Total Riwayat Setoran";
          document.getElementById("kPending").textContent = fmtRp(totalHistory);
          document.getElementById("kCount").textContent = `${res.length} transaksi setoran`;

          const head = document.getElementById("tblHead");
          head.innerHTML = `
            <tr>
              <th>Waktu</th>
              <th>Cabang</th>
              <th>Metode</th>
              <th style="text-align:right">Total</th>
              <th>Catatan</th>
            </tr>
          `;

          const body = document.getElementById("tblBody");
          if (res.length === 0) {
            body.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:24px;color:var(--text-muted)">Belum ada riwayat setoran</td></tr>`;
            return;
          }

          body.innerHTML = res.map(d => {
            let method = [];
            if (d.cash_amount > 0) method.push("Kas");
            if (d.bank_amount > 0) method.push(`Bank (${d.bank_account_name || 'Transfer'})`);
            
            return `
              <tr>
                <td style="font-size:13px">
                  <b>${new Date(d.date).toLocaleDateString("id-ID")}</b><br>
                  <span style="color:var(--text-muted);font-size:11px">${new Date(d.created_at).toLocaleTimeString("id-ID")}</span>
                </td>
                <td><span class="badge" style="background:var(--primary);color:white">${d.branch_name}</span></td>
                <td style="font-size:12px">${method.join(" + ")}</td>
                <td style="text-align:right;font-weight:700">${fmtRp(d.amount)}</td>
                <td style="font-size:12px;color:var(--text-muted)">${d.notes || '-'}</td>
              </tr>
            `;
          }).join("");
        } catch (e) {
          showToast(e.message, "error");
        }
      }

      function filterByBranch(id) {
        if (branchCombo) {
          // Find the branch object from combo data
          // This is a bit hacky but works since we know the data
          const opt = branchCombo.options.find(o => o.id === id);
          if (opt) branchCombo.select(opt);
        } else {
          selectedBranchId = id;
          load();
        }
      }

      // --- CUSTOM COMPONENT: createDepositModal --- (Keep existing logic)
      // Mimics the standard createPaymentModal but tailored for Branch Deposits
      function createDepositModal(config = {}) {
        const { title, total, onConfirm } = config;
        const modalId = `mDep_${Math.floor(Math.random() * 1000)}`;
        const overlay = document.createElement("div");
        overlay.id = modalId;
        overlay.className = "modal-overlay";
        document.body.appendChild(overlay);

        overlay.innerHTML = `
          <div class="modal-box" style="max-width:480px; width:calc(100% - 32px)">
            <div class="modal-hdr">
              <h2>💸 ${title}</h2>
              <button class="btn-x">×</button>
            </div>
            
            <div class="p-info" style="background:var(--bg-color); border-radius:12px; padding:14px; margin-bottom:16px; font-size:15px; text-align:center">
                <div style="color:var(--text-muted); font-size:13px">Total yang Harus Disetor</div>
                <b style="font-size:24px; color:var(--primary)">${fmtRp(total)}</b>
            </div>

            <div class="input-group" style="margin-bottom:16px">
              <label>Metode Penyetoran *</label>
              <select class="input-control p-method">
                <option value="cash">Kas Cabang</option>
                <option value="bank">Transfer Bank</option>
                <option value="mix">Gabungan (Kas + Bank)</option>
              </select>
            </div>

            <div class="p-balances" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;">
              <div style="background:var(--bg-color); border-radius:10px; padding:12px">
                <div style="font-size:12px; color:var(--text-muted)">Saldo Kas</div>
                <div class="p-cash-balance" style="font-weight:800">Rp 0</div>
              </div>
              <div style="background:var(--bg-color); border-radius:10px; padding:12px">
                <div style="font-size:12px; color:var(--text-muted)">Saldo Bank</div>
                <div class="p-bank-balance" style="font-weight:800">Rp 0</div>
              </div>
            </div>

            <div class="row2 p-inputs-row" style="margin-bottom:16px">
              <div class="input-group p-cash-group">
                <label>Dari Kas</label>
                <input type="text" class="input-control p-cash-amt" placeholder="0" />
              </div>
              <div class="input-group p-bank-group">
                <label>Dari Bank</label>
                <input type="text" class="input-control p-bank-amt" placeholder="0" />
              </div>
            </div>

            <div class="input-group p-bank-select-group" style="display:none; margin-bottom:16px">
              <label>Akun Bank Tujuan Penarikan *</label>
              <div id="dep-bank-select"></div>
            </div>

            <div style="background:rgba(16,185,129,0.08); border:1px solid rgba(16,185,129,0.2); border-radius:12px; padding:14px; margin-bottom:16px;">
              <div style="display:flex; justify-content:space-between; align-items:center">
                <span>Total Input</span>
                <b class="p-total-label" style="font-size:18px; color:#10b981">${fmtRp(0)}</b>
              </div>
            </div>

            <div class="input-group">
              <label>Catatan Setoran</label>
              <input type="text" class="p-note input-control" placeholder="Misal: Setoran akhir pekan..." />
            </div>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px;">
              <button class="btn p-cancel">Batal</button>
              <button class="btn btn-primary p-submit">✓ Konfirmasi Setoran</button>
            </div>
          </div>
        `;

        const methodSel = overlay.querySelector(".p-method"),
              cashGroup = overlay.querySelector(".p-cash-group"),
              bankGroup = overlay.querySelector(".p-bank-group"),
              cashInp = overlay.querySelector(".p-cash-amt"),
              bankInp = overlay.querySelector(".p-bank-amt"),
              totalLabel = overlay.querySelector(".p-total-label"),
              bankSelectGroup = overlay.querySelector(".p-bank-select-group"),
              cashBalDiv = overlay.querySelector(".p-cash-balance"),
              bankBalDiv = overlay.querySelector(".p-bank-balance"),
              noteInp = overlay.querySelector(".p-note"),
              submitBtn = overlay.querySelector(".p-submit"),
              closeBtn = overlay.querySelector(".btn-x"),
              cancelBtn = overlay.querySelector(".p-cancel");

        const parseNum = (s) => parseFloat(String(s).replace(/\./g, "").replace(",", ".")) || 0;
        const formatNum = (n) => (n || 0).toLocaleString("id-ID");
        let bankCombo = null;

        const syncTotal = () => {
          const c = parseNum(cashInp.value);
          const b = parseNum(bankInp.value);
          const currentTotal = c + b;
          totalLabel.textContent = fmtRp(currentTotal);
          bankSelectGroup.style.display = b > 0 ? "block" : "none";
          
          if (round(currentTotal, 2) !== round(total, 2)) {
            totalLabel.style.color = "#ef4444";
          } else {
            totalLabel.style.color = "#10b981";
          }
        };

        const applyMethod = (reset = false) => {
          const method = methodSel.value;
          cashGroup.style.display = method === "bank" ? "none" : "block";
          bankGroup.style.display = method === "cash" ? "none" : "block";
          
          if (reset) {
            if (method === "cash") { cashInp.value = formatNum(total); bankInp.value = ""; }
            else if (method === "bank") { bankInp.value = formatNum(total); cashInp.value = ""; }
            else { cashInp.value = ""; bankInp.value = ""; }
          }
          syncTotal();
        };

        cashInp.oninput = (e) => { e.target.value = formatNum(parseNum(e.target.value)); syncTotal(); };
        bankInp.oninput = (e) => { e.target.value = formatNum(parseNum(e.target.value)); syncTotal(); };
        methodSel.onchange = () => applyMethod(true);

        const close = () => { overlay.remove(); document.body.style.overflow = ""; };
        closeBtn.onclick = close;
        cancelBtn.onclick = close;

        submitBtn.onclick = async () => {
          const cash = parseNum(cashInp.value);
          const bank = parseNum(bankInp.value);
          if (round(cash + bank, 2) !== round(total, 2)) return showToast("Total harus sesuai!", "error");
          
          let bId = null;
          if (bank > 0) {
            const sel = bankCombo.getSelected();
            if (!sel) return showToast("Pilih akun bank!", "error");
            bId = sel.id;
          }

          try {
            showLoading("Memproses Setoran...");
            await api("POST", "/branches/deposit", {
              amount: total,
              cash_amount: cash,
              bank_amount: bank,
              bank_account_id: bId,
              notes: noteInp.value
            });
            hideLoading();
            showToast("Setoran Berhasil ✓");
            close();
            if (onConfirm) onConfirm();
          } catch (e) {
            hideLoading();
            showToast(e.message, "error");
          }
        };

        // Init
        overlay.style.display = "flex";
        document.body.style.overflow = "hidden";
        applyMethod(true);

        api("GET", "/accounting/liquid-balances").then(bal => {
          cashBalDiv.textContent = fmtRp(bal.cash_balance);
          bankBalDiv.textContent = fmtRp(bal.bank_balance);
        });

        api("GET", "/accounting/accounts?type=asset").then(accounts => {
          const banks = accounts.filter(a => a.code === '1-1200');
          bankCombo = createPremiumCombo(overlay.querySelector("#dep-bank-select"), banks, { placeholder: "Pilih Bank..." });
        });
      }

      // Helper pembulatan
      function round(n, d) {
        return Number(Math.round(n + "e" + d) + "e-" + d);
      }

      async function paySingle(id, amount) {
        createDepositModal({
          title: "Setoran Per Shift",
          total: amount,
          onConfirm: () => load()
        });
      }

      async function processAll() {
        const total = rawData.reduce((a, b) => a + b.closing_cash, 0);
        createDepositModal({
          title: "Setor Seluruh Pendapatan",
          total: total,
          onConfirm: () => load()
        });
      }

      init();
    </script>
  </body>
</html>
