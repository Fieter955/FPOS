<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Retur - FPOS</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/components.css" />

    <style>
      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type="number"] {
        -moz-appearance: textfield;
      }

      .tabs .btn {
        white-space: nowrap;
        border-radius: 8px;
        font-weight: 600;
        font-size: 14px;
        padding: 8px 16px;
      }
      .tabs {
        position: relative;
        z-index: 100;
        width: 100%;
      }
      .view-section {
        animation: fadeIn 0.2s ease;
      }

      .badge {
        padding: 4px 10px;
        border-radius: 6px;
        font-weight: 700;
        font-size: 11px;
        text-transform: uppercase;
      }
      .badge-success {
        background: rgba(16, 185, 129, 0.15);
        color: #10b981;
      }
      .badge-warning {
        background: rgba(245, 158, 11, 0.15);
        color: #f59e0b;
      }
      .badge-danger {
        background: rgba(239, 68, 68, 0.15);
        color: #ef4444;
      }
    </style>
  </head>
  <body>
    <div class="app-container">
      <main class="main-content">
        <button
          class="btn"
          style="
            background: transparent;
            color: var(--text-muted);
            padding: 0;
            margin-bottom: 16px;
          "
          onclick="location.href = '/dashboard'"
        >
          ← Kembali
        </button>

        <div
          class="pg-header"
          style="flex-direction: column; align-items: flex-start; gap: 16px"
        >
          <div>
            <h1>📥 Retur Barang</h1>
            <p>Pilih barang dari riwayat transaksi untuk dilakukan retur.</p>
          </div>
          <div class="tabs">
            <div
              style="
                display: flex;
                gap: 8px;
                overflow-x: auto;
                width: 100%;
                padding-bottom: 4px;
              "
            >
              <button
                id="btnTabSales"
                class="btn btn-primary"
                onclick="switchTab('sales')"
              >
                Retur Penjualan
              </button>
              <button
                id="btnTabPurchase"
                class="btn"
                style="
                  background: var(--bg-color);
                  border: 1px solid var(--border-color);
                  color: var(--text-main);
                "
                onclick="switchTab('purchase')"
              >
                Retur Pembelian
              </button>
            </div>
          </div>
        </div>

        <div id="viewList" class="view-section">
          <div id="mainFilterContainer"></div>
          <div class="tbl-wrap">
            <table class="tbl">
              <thead>
                <tr id="tblHeader">
                  <!-- Dynamic headers -->
                </tr>
              </thead>
              <tbody id="tblBody"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>

    <!-- Modal Form Retur -->
    <div class="modal-overlay" id="mReturn">
      <div class="modal-box" style="max-width: 450px">
        <div class="modal-hdr">
          <h2 id="mReturnTitle">Retur Barang</h2>
          <button class="btn-x" onclick="closeModal('mReturn')">×</button>
        </div>
        <div class="modal-body" style="padding: 16px 0">
          <div
            id="mReturnItemInfo"
            style="
              background: var(--bg-color);
              padding: 14px;
              border-radius: 12px;
              margin-bottom: 16px;
              border: 1px solid var(--border-color);
            "
          >
            <!-- Item details built dynamically -->
          </div>
          <div class="input-group" style="margin-bottom: 12px">
            <label
              >Jumlah Retur * (Maks
              <span
                id="mReturnMax"
                style="font-weight: 700; color: var(--primary)"
                >0</span
              >)</label
            >
            <input
              type="number"
              id="mReturnQty"
              class="input-control"
              value="1"
              min="1"
            />
          </div>
          <div class="input-group" style="margin-bottom: 12px">
            <label>Alasan Retur</label>
            <input
              type="text"
              id="mReturnReason"
              class="input-control"
              placeholder="Contoh: Barang Rusak, Salah Ukuran, dll"
            />
          </div>
          <div class="input-group">
            <label>Catatan (Opsional)</label>
            <textarea
              id="mReturnNotes"
              class="input-control"
              rows="2"
              placeholder="Keterangan tambahan..."
            ></textarea>
          </div>
        </div>
        <div
          style="
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
          "
        >
          <button onclick="closeModal('mReturn')" class="btn">Batal</button>
          <button
            onclick="prosesRetur()"
            class="btn btn-primary"
            id="btnSimpanRetur"
          >
            ✓ Proses Retur
          </button>
        </div>
      </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/components.js"></script>
    <script>
      requireAuth();
      let currentTab = "sales"; // sales or purchase
      let mainFilter = null;
      let activeItem = null;
      let allSuppliers = [];
      let allCustomers = [];

      function switchTab(tab) {
        currentTab = tab;

        // Update tab buttons style
        document.querySelectorAll(".tabs .btn").forEach((btn) => {
          btn.classList.remove("btn-primary");
          btn.style.background = "var(--bg-color)";
          btn.style.color = "var(--text-main)";
        });

        const activeBtn =
          tab === "sales"
            ? document.getElementById("btnTabSales")
            : document.getElementById("btnTabPurchase");
        activeBtn.classList.add("btn-primary");
        activeBtn.style.background = ""; // Reset inline style to use class style
        activeBtn.style.color = "";

        // Update Filter Entities
        if (mainFilter) {
          mainFilter.updateEntities(
            tab === "sales" ? allCustomers : allSuppliers,
          );
        }

        load();
      }

      async function load() {
        if (!mainFilter) return;
        const f = mainFilter.getValues();
        const type = currentTab; // sales or purchase
        const entityParam = type === "sales" ? "customer_id" : "supplier_id";

        let url = `/returns/history/${type === "sales" ? "sales" : "purchases"}?start_date=${f.start_date}&end_date=${f.end_date}`;
        if (f.entity_id) url += `&${entityParam}=${f.entity_id}`;
        if (f.status) url += `&status=${f.status}`;

        try {
          showLoading();
          const data = await api("GET", url);
          hideLoading();
          renderTable(data, type);
        } catch (ex) {
          hideLoading();
          showToast(ex.message, "error");
        }
      }

      function renderTable(data, type) {
        const header = document.getElementById("tblHeader");
        const body = document.getElementById("tblBody");

        const isSales = type === "sales";
        header.innerHTML = `
          <th>Nama Barang</th>
          <th style="text-align:center">Tgl Faktur</th>
          <th style="text-align:center">No. Faktur</th>
          <th>${isSales ? "Pelanggan" : "Supplier"}</th>
          <th style="text-align:center">Qty Beli</th>
          <th style="text-align:center">Tersisa</th>
          <th style="text-align:right">Harga</th>
          <th style="text-align:center">Aksi</th>
        `;

        if (!data || data.length === 0) {
          body.innerHTML = `<tr><td colspan="8" style="text-align:center; padding: 40px; color: var(--text-muted)">Tidak ada riwayat barang yang ditemukan.</td></tr>`;
          return;
        }

        body.innerHTML = data
          .map((it) => {
            const price = isSales ? it.sell_price : it.buy_price;
            const date = isSales ? it.sale_date : it.purchase_date;
            const number = isSales ? it.sale_number : it.purchase_number;
            const entity = isSales
              ? it.customer_name || "Umum"
              : it.supplier_name || "-";
            const qtyTotal = isSales ? it.qty_sold : it.qty_bought;
            const qtyLeft = it.qty_available;

            let statusBadge = "";
            if (it.status === "returned")
              statusBadge =
                '<span class="badge badge-danger">Retur Full</span>';
            else if (it.status === "partial")
              statusBadge =
                '<span class="badge badge-warning">Retur Sebagian</span>';

            const canReturn = qtyLeft > 0;
            const returBtn = canReturn
              ? `<button class="btn btn-primary" style="padding: 4px 10px; font-size: 12px" onclick='openReturnModal(${JSON.stringify(it).replace(/'/g, "&apos;")})'>↩ Retur</button>`
              : `<button class="btn" disabled style="padding: 4px 10px; font-size: 12px; opacity: 0.5">Sudah Habis</button>`;

            return `
            <tr>
              <td style="font-weight: 600">
                ${it.item.name}
                <div style="font-size: 11px; color: var(--text-muted); font-weight: normal">${it.item.code}</div>
                ${statusBadge}
              </td>
              <td style="text-align:center; font-size: 13px">${fmtDate(date)}</td>
              <td style="text-align:center; font-family: monospace; font-weight: 700; color: var(--primary)">${number}</td>
              <td style="font-size: 13px">${entity}</td>
              <td style="text-align:center">${qtyTotal}</td>
              <td style="text-align:center; font-weight: 700; color: ${qtyLeft > 0 ? "var(--primary)" : "var(--text-muted)"}">${qtyLeft}</td>
              <td style="text-align:right">${fmtRp(price)}</td>
              <td style="text-align:center">${returBtn}</td>
            </tr>
          `;
          })
          .join("");
      }

      function openReturnModal(item) {
        activeItem = item;
        const isSales = currentTab === "sales";

        document.getElementById("mReturnTitle").textContent = isSales
          ? "Retur Penjualan"
          : "Retur Pembelian";
        document.getElementById("mReturnMax").textContent = item.qty_available;
        document.getElementById("mReturnQty").value = item.qty_available;
        document.getElementById("mReturnQty").max = item.qty_available;
        document.getElementById("mReturnReason").value = "";
        document.getElementById("mReturnNotes").value = "";

        const entityLabel = isSales ? "Pelanggan" : "Supplier";
        const entityName = isSales
          ? item.customer_name || "Umum"
          : item.supplier_name || "-";
        const price = isSales ? item.sell_price : item.buy_price;

        document.getElementById("mReturnItemInfo").innerHTML = `
          <div style="font-weight: 700; font-size: 16px; margin-bottom: 4px; color: var(--primary)">${item.item.name}</div>
          <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 10px">${item.item.code} | ${item.item.barcode || "-"}</div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 13px">
            <div><span style="color:var(--text-muted)">Faktur:</span> <span style="font-weight:600">${isSales ? item.sale_number : item.purchase_number}</span></div>
            <div><span style="color:var(--text-muted)">${entityLabel}:</span> <span style="font-weight:600">${entityName}</span></div>
            <div><span style="color:var(--text-muted)">Harga:</span> <span style="font-weight:600">${fmtRp(price)}</span></div>
            <div><span style="color:var(--text-muted)">Tersisa:</span> <span style="font-weight:600">${item.qty_available}</span></div>
          </div>
        `;

        openModal("mReturn");
      }

      async function prosesRetur() {
        const qty =
          parseFloat(document.getElementById("mReturnQty").value) || 0;
        if (qty <= 0) return showToast("Jumlah retur tidak valid", "error");
        if (qty > activeItem.qty_available)
          return showToast("Jumlah melebihi batas tersisa", "error");

        const reason = document.getElementById("mReturnReason").value;
        const notes = document.getElementById("mReturnNotes").value;
        const type = currentTab; // sales or purchase

        const payload = {
          date: new Date().toISOString().split("T")[0],
          reason: reason,
          notes: notes,
          items: [
            {
              item_id: activeItem.item_id,
              qty: qty,
            },
          ],
        };

        if (type === "sales") {
          payload.sale_id = activeItem.sale_id;
        } else {
          payload.purchase_id = activeItem.purchase_id;
        }

        try {
          showLoading("Memproses retur...");
          const res = await api(
            "POST",
            `/returns/${type === "sales" ? "sales" : "purchases"}`,
            payload,
          );
          hideLoading();

          showToast(`Berhasil! No. Retur: ${res.number}`);
          closeModal("mReturn");
          load();
        } catch (ex) {
          hideLoading();
          showToast(ex.message, "error");
        }
      }

      async function initFilters() {
        allSuppliers = await api(
          "GET",
          "/suppliers/?limit=5000&active_only=true",
        );
        allCustomers = await api("GET", "/customers/?limit=5000");

        const statusOpts = [
          { label: "Belum Retur", value: "not_returned" },
          { label: "Retur Sebagian", value: "partial" },
          { label: "Retur Penuh", value: "returned" },
        ];

        mainFilter = createFilterBar("mainFilterContainer", {
          onFilter: load,
          entities: allCustomers, // Default to sales
          statusOptions: statusOpts,
          useEntitySelect: true,
          entityPlaceholder: "Semua Supplier/Pelanggan",
        });
      }

      function fmtRp(n) {
        return new Intl.NumberFormat("id-ID", {
          style: "currency",
          currency: "IDR",
          minimumFractionDigits: 0,
        }).format(n || 0);
      }
      function fmtDate(d) {
        if (!d) return "-";
        return new Date(d + "T00:00:00").toLocaleDateString("id-ID", {
          day: "2-digit",
          month: "short",
          year: "numeric",
        });
      }

      (async () => {
        await initFilters();
        load();
      })();
    </script>
  </body>
</html>
