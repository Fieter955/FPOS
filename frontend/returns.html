<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Retur - FPOS</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/components.css" />

    <style>
      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type="number"] {
        -moz-appearance: textfield;
      }

      .tabs .btn {
        white-space: nowrap;
        border-radius: 8px;
        font-weight: 600;
        font-size: 14px;
        padding: 8px 16px;
      }
      .tabs {
        position: relative;
        z-index: 100;
        width: 100%;
      }
      .view-section {
        animation: fadeIn 0.2s ease;
      }

      .badge {
        padding: 4px 10px;
        border-radius: 6px;
        font-weight: 700;
        font-size: 11px;
        text-transform: uppercase;
      }
      .badge-success {
        background: rgba(16, 185, 129, 0.15);
        color: #10b981;
      }
      .badge-warning {
        background: rgba(245, 158, 11, 0.15);
        color: #f59e0b;
      }
      .badge-danger {
        background: rgba(239, 68, 68, 0.15);
        color: #ef4444;
      }
    </style>
  </head>
  <body>
    <div class="app-container">
      <main class="main-content">
        <button
          class="btn"
          style="
            background: transparent;
            color: var(--text-muted);
            padding: 0;
            margin-bottom: 16px;
          "
          onclick="location.href = '/dashboard'"
        >
          ← Kembali
        </button>

        <div
          class="pg-header"
          style="flex-direction: column; align-items: flex-start; gap: 16px"
        >
          <div>
            <h1>📥 Retur Barang</h1>
            <p>Pilih barang dari riwayat transaksi untuk dilakukan retur.</p>
          </div>
          <div class="tabs">
            <div
              style="
                display: flex;
                gap: 8px;
                overflow-x: auto;
                width: 100%;
                padding-bottom: 4px;
              "
            >
              <button
                id="btnTabSales"
                class="btn btn-primary"
                onclick="switchTab('sales')"
              >
                Retur Penjualan
              </button>
              <button
                id="btnTabPurchase"
                class="btn"
                style="
                  background: var(--bg-color);
                  border: 1px solid var(--border-color);
                  color: var(--text-main);
                "
                onclick="switchTab('purchase')"
              >
                Retur Pembelian
              </button>
            </div>
            <div id="tombolReturContainer">
              <div
                style="
                  display: flex;
                  justify-content: flex-end;
                  gap: 10px;
                  margin-bottom: 14px;
                "
              >
                <button
                  class="btn"
                  style="
                    background: #10b981;
                    color: white;
                    border: none;
                    font-weight: bold;
                  "
                  onclick="buatReturPembelian()"
                >
                  ➕ Buat Retur Pembelian
                </button>
                <button class="btn btn-primary" onclick="buatReturPenjualan()">
                  ➕ Buat Retur Penjualan
                </button>
              </div>
            </div>
          </div>
        </div>

        <div id="viewList" class="view-section">
          <div id="mainFilterContainer"></div>
          <div class="tbl-wrap">
            <table class="tbl">
              <thead>
                <tr id="tblHeader">
                  <!-- Dynamic headers -->
                </tr>
              </thead>
              <tbody id="tblBody"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>

    <!-- Modal Form Retur -->
    <div class="modal-overlay" id="mReturn">
      <div class="modal-box" style="max-width: 450px">
        <div class="modal-hdr">
          <h2 id="mReturnTitle">Retur Barang</h2>
          <button class="btn-x" onclick="closeModal('mReturn')">×</button>
        </div>
        <div class="modal-body" style="padding: 16px 0">
          <div
            id="mReturnItemInfo"
            style="
              background: var(--bg-color);
              padding: 14px;
              border-radius: 12px;
              margin-bottom: 16px;
              border: 1px solid var(--border-color);
            "
          >
            <!-- Item details built dynamically -->
          </div>
          <div class="input-group" style="margin-bottom: 12px">
            <label
              >Jumlah Retur * (Maks
              <span
                id="mReturnMax"
                style="font-weight: 700; color: var(--primary)"
                >0</span
              >)</label
            >
            <input
              type="number"
              id="mReturnQty"
              class="input-control"
              value="1"
              min="1"
            />
          </div>
          <div class="input-group" style="margin-bottom: 12px">
            <label>Alasan Retur</label>
            <input
              type="text"
              id="mReturnReason"
              class="input-control"
              placeholder="Contoh: Barang Rusak, Salah Ukuran, dll"
            />
          </div>
          <div class="input-group">
            <label>Catatan (Opsional)</label>
            <textarea
              id="mReturnNotes"
              class="input-control"
              rows="2"
              placeholder="Keterangan tambahan..."
            ></textarea>
          </div>
        </div>
        <div
          style="
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
          "
        >
          <button onclick="closeModal('mReturn')" class="btn">Batal</button>
          <button
            onclick="prosesRetur()"
            class="btn btn-primary"
            id="btnSimpanRetur"
          >
            ✓ Proses Retur
          </button>
        </div>
      </div>
    </div>

    <!-- Modal Form Retur Manual -->
    <div class="modal-overlay" id="mManualReturn">
      <div class="modal-box" style="max-width: 800px; width: 95%">
        <div class="modal-hdr">
          <h2 id="mManualReturnTitle">Buat Retur Pembelian</h2>
          <button class="btn-x" onclick="closeModal('mManualReturn')">×</button>
        </div>
        <div class="modal-body" style="padding: 16px 0">
          <div
            style="
              display: grid;
              grid-template-columns: 1fr 1fr;
              gap: 16px;
              margin-bottom: 16px;
            "
          >
            <div class="input-group">
              <label id="lblManualEntity">Pilih Supplier *</label>
              <div id="mManualEntityCombo"></div>
            </div>
            <div class="input-group">
              <label id="lblManualItemSearch">Cari Barang (Scan / Ketik) *</label>
              <input type="text" id="mManualItemSearch" class="input-control" placeholder="Pilih supplier dulu..." disabled />
            </div>
          </div>

          <div
            style="
              display: grid;
              grid-template-columns: 1fr 1fr;
              gap: 16px;
              margin-bottom: 16px;
            "
          >
            <div class="input-group">
              <label>Tanggal Retur *</label>
              <input type="date" id="mManualDate" class="input-control" />
            </div>
            <div class="input-group">
              <label>Alasan Retur</label>
              <input
                type="text"
                id="mManualReason"
                class="input-control"
                placeholder="Contoh: Barang Rusak"
              />
            </div>
          </div>

          <div
            id="mManualPpnInfo"
            style="
              background: rgba(16, 185, 129, 0.1);
              color: #059669;
              padding: 10px;
              border-radius: 8px;
              font-size: 13px;
              margin-bottom: 16px;
              display: none;
              border: 1px solid rgba(16, 185, 129, 0.2);
            "
          >
            <!-- Info PPN muncul di sini -->
          </div>

          <div
            class="tbl-wrap"
            style="border: 1px solid var(--border-color); border-radius: 8px"
          >
            <table class="tbl" style="margin-bottom: 0">
              <thead>
                <tr>
                  <th>Nama Barang</th>
                  <th style="width: 80px; text-align: center">Sisa</th>
                  <th style="width: 100px; text-align: center">Qty Retur</th>
                  <th style="width: 120px; text-align: right">Harga</th>
                  <th style="width: 120px; text-align: right">Total</th>
                  <th style="width: 40px"></th>
                </tr>
              </thead>
              <tbody id="mManualGridBody">
                <!-- Baris barang ditambahkan di sini -->
              </tbody>
            </table>
            <div
              style="
                padding: 12px;
                border-top: 1px solid var(--border-color);
                background: var(--bg-color);
              "
            >
              <button
                class="btn"
                onclick="addManualReturnRow()"
                style="font-size: 13px; padding: 6px 12px"
              >
                ➕ Tambah Barang
              </button>
            </div>
          </div>

          <div
            style="
              margin-top: 16px;
              display: flex;
              justify-content: flex-end;
              gap: 20px;
              align-items: center;
            "
          >
            <div style="text-align: right">
              <div style="font-size: 12px; color: var(--text-muted)">
                Grand Total Retur
              </div>
              <div
                id="mManualGrandTotal"
                style="font-size: 20px; font-weight: 800; color: var(--primary)"
              >
                Rp 0
              </div>
            </div>
          </div>
        </div>
        <div
          style="
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
          "
        >
          <button onclick="closeModal('mManualReturn')" class="btn">
            Batal
          </button>
          <button onclick="saveManualReturn()" class="btn btn-primary">
            ✓ Proses Retur
          </button>
        </div>
      </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/components.js"></script>
    <script>
      requireAuth();
      let currentTab = "sales"; // sales or purchase
      let mainFilter = null;
      let activeItem = null;
      let allSuppliers = [];
      let allCustomers = [];

      let mManualMode = "purchase"; // 'purchase' or 'sales'
      let mManualEntityCombo = null;
      let mManualSelectedEntity = null;
      let mManualValidItems = [];

      function switchTab(tab) {
        currentTab = tab;

        // Update tab buttons style
        document.querySelectorAll(".tabs .btn").forEach((btn) => {
          btn.classList.remove("btn-primary");
          btn.style.background = "var(--bg-color)";
          btn.style.color = "var(--text-main)";
        });

        const activeBtn =
          tab === "sales"
            ? document.getElementById("btnTabSales")
            : document.getElementById("btnTabPurchase");
        activeBtn.classList.add("btn-primary");
        activeBtn.style.background = ""; // Reset inline style to use class style
        activeBtn.style.color = "";

        // Update Filter Entities
        if (mainFilter) {
          mainFilter.updateEntities(
            tab === "sales" ? allCustomers : allSuppliers,
          );
        }

        load();
      }

      function buatReturPembelian() {
        mManualMode = "purchase";
        openManualReturnModal();
      }

      function buatReturPenjualan() {
        mManualMode = "sales";
        openManualReturnModal();
      }

      function openManualReturnModal() {
        const isPurchase = mManualMode === "purchase";
        document.getElementById("mManualReturnTitle").textContent = isPurchase
          ? "Buat Retur Pembelian"
          : "Buat Retur Penjualan";
        document.getElementById("lblManualEntity").textContent = isPurchase
          ? "Pilih Supplier *"
          : "Pilih Pelanggan *";
        document.getElementById("mManualDate").value = new Date()
          .toISOString()
          .split("T")[0];
        document.getElementById("mManualReason").value = "";
        document.getElementById("mManualGridBody").innerHTML = "";
        document.getElementById("mManualGrandTotal").textContent = "Rp 0";
        document.getElementById("mManualPpnInfo").style.display = "none";

        const searchInp = document.getElementById("mManualItemSearch");
        searchInp.value = "";
        searchInp.disabled = true;
        searchInp.placeholder =
          "Pilih " + (isPurchase ? "supplier" : "pelanggan") + " dulu...";

        mManualSelectedEntity = null;
        mManualValidItems = [];

        // Reset Combo
        if (mManualEntityCombo) mManualEntityCombo.clear();

        // Initialize Entity Combo
        if (!mManualEntityCombo) {
          mManualEntityCombo = createPremiumCombo(
            "mManualEntityCombo",
            isPurchase ? allSuppliers : allCustomers,
            {
              onSelect: (sel) => onManualEntitySelected(sel),
            },
          );
        } else {
          mManualEntityCombo.updateData(
            isPurchase ? allSuppliers : allCustomers,
          );
        }

        openModal("mManualReturn");
      }

      async function onManualEntitySelected(entity) {
        mManualSelectedEntity = entity;
        const searchInp = document.getElementById("mManualItemSearch");

        if (!entity) {
          searchInp.disabled = true;
          mManualValidItems = [];
          return;
        }

        searchInp.disabled = false;
        searchInp.placeholder = "Scan Barcode atau Ketik Nama...";
        searchInp.focus();

        showLoading("Mencari daftar barang...");
        try {
          if (mManualMode === "purchase") {
            mManualValidItems = await api(
              "GET",
              `/suppliers/${entity.id}/purchased-items`,
            );
          } else {
            // Untuk penjualan, sementara list semua barang (atau implementasikan backend serupa)
            mManualValidItems = await api("GET", "/items/?limit=1000");
          }
          hideLoading();
        } catch (ex) {
          hideLoading();
          showToast("Gagal memuat daftar barang.", "error");
        }
      }

      // Scanner Hook for Manual Return
      setupBarcodeScanner((scode) => {
        const modal = document.getElementById("mManualReturn");
        if (modal.style.display !== "flex") return;
        handleManualItemInput(scode);
      });

      document.getElementById("mManualItemSearch").onkeydown = (e) => {
        if (e.key === "Enter") {
          handleManualItemInput(e.target.value);
          e.target.value = "";
        }
      };

      async function handleManualItemInput(query) {
        if (!query) return;
        const scode = query.toLowerCase().trim();
        const item = mManualValidItems.find(
          (i) =>
            (i.barcode && i.barcode.toLowerCase() === scode) ||
            (i.code && i.code.toLowerCase() === scode) ||
            (i.name && i.name.toLowerCase().includes(scode)),
        );

        if (item) {
          addManualReturnRow(item);
        } else {
          showToast(
            "Barang tidak ditemukan dalam riwayat transaksi entity ini.",
            "error",
          );
        }
      }

      async function addManualReturnRow(item) {
        const body = document.getElementById("mManualGridBody");

        // Cek jika sudah ada
        const existing = Array.from(body.querySelectorAll("tr")).find(
          (r) => r.dataset.itemId == item.id,
        );
        if (existing) {
          const qtyInp = existing.querySelector(".row-qty");
          qtyInp.value = (parseFloat(qtyInp.value) || 0) + 1;
          calculateManualReturnTotal();
          return;
        }

        const idx = body.children.length;
        const row = document.createElement("tr");
        row.dataset.itemId = item.id;
        row.innerHTML = `
          <td>
            <div style="font-weight:600">${item.name}</div>
            <div style="font-size:11px; color:var(--text-muted)">${item.code}</div>
            <div class="row-factur-info" style="font-size:10px; color:var(--primary); margin-top:4px"></div>
          </td>
          <td style="text-align: center; font-weight: 700" class="row-avail">-</td>
          <td><input type="number" class="input-control row-qty" value="1" style="text-align: center" oninput="calculateManualReturnTotal()" /></td>
          <td style="text-align: right">
            <div style="display:flex; align-items:center; gap:4px; justify-content:flex-end">
                <input type="number" class="input-control row-price-inp" value="0" style="text-align:right; width:90px; padding:4px" oninput="calculateManualReturnTotal()" />
                <button class="btn" onclick="showPriceHistory(${item.id}, this)" style="padding:4px; background:var(--bg-color); border:1px solid var(--border-color)" title="Cari Faktur">📜</button>
            </div>
          </td>
          <td style="text-align: right; font-weight: 700" class="row-total">Rp 0</td>
          <td><button class="btn" style="color:var(--danger); background:transparent; padding:0" onclick="this.closest('tr').remove(); calculateManualReturnTotal()">✕</button></td>
        `;
        body.appendChild(row);

        // Auto-fetch history and pick latest if purchase
        if (mManualMode === "purchase") {
          try {
            const history = await api(
              "GET",
              `/suppliers/${mManualSelectedEntity.id}/items/${item.id}/history`,
            );
            if (history && history.length > 0) {
              const latest = history[0];
              row.querySelector(".row-price-inp").value = latest.price;
              row.querySelector(".row-avail").textContent =
                latest.qty_available;
              row.querySelector(".row-factur-info").textContent = latest.number;
              row.dataset.purchaseId = latest.purchase_id;
            }
          } catch (e) {}
        }

        calculateManualReturnTotal();
      }

      async function showPriceHistory(itemId, btn) {
        if (!mManualSelectedEntity) return;
        const row = btn.closest("tr");
        showLoading("Mengambil riwayat harga...");
        try {
          let history = [];
          if (mManualMode === "purchase") {
            history = await api(
              "GET",
              `/suppliers/${mManualSelectedEntity.id}/items/${itemId}/history`,
            );
          } else {
            // Untuk penjualan, ambil dari /returns/history/sales filter entity & item
            const allHistory = await api(
              "GET",
              `/returns/history/sales?customer_id=${mManualSelectedEntity.id}`,
            );
            history = allHistory
              .filter((h) => h.item_id === itemId)
              .map((h) => ({
                purchase_id: h.sale_id,
                number: h.sale_number,
                date: h.sale_date,
                qty: h.qty_sold,
                qty_available: h.qty_available,
                price: h.sell_price,
              }));
          }
          hideLoading();

          if (history.length === 0)
            return showToast("Tidak ada riwayat transaksi.", "warning");

          const listHtml = history
            .map(
              (h) => `
                <div onclick="selectPrice(this, ${h.purchase_id}, ${h.price}, '${h.number}', ${h.qty_available})" 
                     style="padding:10px; border-bottom:1px solid var(--border-color); cursor:pointer"
                     onmouseover="this.style.background='rgba(0,0,0,0.05)'"
                     onmouseout="this.style.background='transparent'">
                    <div style="display:flex; justify-content:space-between">
                        <strong>${h.number}</strong>
                        <span style="color:var(--primary); font-weight:700">${fmtRp(h.price)}</span>
                    </div>
                    <div style="font-size:11px; color:var(--text-muted)">Tgl: ${fmtDate(h.date)} | Sisa: ${h.qty_available} / ${h.qty}</div>
                </div>
              `,
            )
            .join("");

          const div = document.createElement("div");
          div.id = "tempHistoryModal";
          div.className = "modal-overlay";
          div.style.zIndex = "9999";
          div.style.display = "flex";
          div.innerHTML = `
                <div class="modal-box" style="max-width:400px">
                    <div class="modal-hdr">
                        <h2>Pilih Faktur</h2>
                        <button class="btn-x" onclick="document.getElementById('tempHistoryModal').remove()">×</button>
                    </div>
                    <div class="modal-body" style="max-height:300px; overflow-y:auto; padding:0">
                        ${listHtml}
                    </div>
                </div>
              `;
          document.body.appendChild(div);

          // Helper function global agar bisa dipanggil dari HTML string
          window.selectPrice = (el, pid, price, num, avail) => {
            row.querySelector(".row-price-inp").value = price;
            row.querySelector(".row-avail").textContent = avail;
            row.querySelector(".row-factur-info").textContent = num;
            row.dataset.purchaseId = pid;

            // Pastikan qty retur tidak melebihi sisa faktur yang baru dipilih
            let currentQty = parseFloat(row.querySelector(".row-qty").value) || 0;
            if (currentQty > avail) {
              row.querySelector(".row-qty").value = avail;
            }

            calculateManualReturnTotal();
            document.getElementById("tempHistoryModal").remove();
          };
        } catch (ex) {
          hideLoading();
          showToast(ex.message, "error");
        }
      }

      function calculateManualReturnTotal() {
        let grand = 0;
        document.querySelectorAll("#mManualGridBody tr").forEach((row) => {
          const qty = parseFloat(row.querySelector(".row-qty").value) || 0;
          const price =
            parseFloat(row.querySelector(".row-price-inp").value) || 0;
          const total = qty * price;
          row.querySelector(".row-total").textContent = fmtRp(total);
          grand += total;
        });
        document.getElementById("mManualGrandTotal").textContent = fmtRp(grand);
      }

      async function saveManualReturn() {
        if (!mManualSelectedEntity)
          return showToast("Pilih supplier/pelanggan terlebih dahulu", "error");

        const rows = Array.from(
          document.querySelectorAll("#mManualGridBody tr"),
        );
        if (rows.length === 0)
          return showToast("Tambahkan minimal 1 barang", "error");

        // Kelompokkan item berdasarkan purchase_id karena backend memproses per faktur
        const groups = {};
        let hasError = false;

        rows.forEach((row) => {
          const itemId = row.dataset.itemId;
          const pid = row.dataset.purchaseId;
          const qty = parseFloat(row.querySelector(".row-qty").value) || 0;
          const avail =
            parseFloat(row.querySelector(".row-avail").textContent) || 0;

          if (!itemId || qty <= 0) return;
          if (!pid) {
            hasError = true;
            showToast(
              "Ada barang yang belum dipilih fakturnya (klik icon 📜)",
              "error",
            );
            return;
          }
          if (row.querySelector(".row-avail").textContent !== "-" && qty > avail) {
            hasError = true;
            showToast("Qty retur melebihi sisa tersedia di faktur", "error");
            return;
          }

          if (!groups[pid]) groups[pid] = [];
          groups[pid].push({ item_id: parseInt(itemId), qty: qty });
        });

        if (hasError) return;

        showLoading("Memproses retur...");
        try {
          const type = mManualMode === "purchase" ? "purchases" : "sales";
          // Proses setiap grup faktur secara berurutan
          for (const pid in groups) {
            const payload = {
              date: document.getElementById("mManualDate").value,
              reason: document.getElementById("mManualReason").value,
              items: groups[pid],
            };
            if (mManualMode === "purchase") payload.purchase_id = parseInt(pid);
            else payload.sale_id = parseInt(pid);

            await api("POST", `/returns/${type}`, payload);
          }
          hideLoading();
          showToast("Semua retur berhasil diproses!");
          closeModal("mManualReturn");
          load();
        } catch (ex) {
          hideLoading();
          showToast(ex.message, "error");
        }
      }

      async function load() {
        if (!mainFilter) return;
        const f = mainFilter.getValues();
        const type = currentTab; // sales or purchase
        const entityParam = type === "sales" ? "customer_id" : "supplier_id";

        let url = `/returns/history/${type === "sales" ? "sales" : "purchases"}?start_date=${f.start_date}&end_date=${f.end_date}`;
        if (f.entity_id) url += `&${entityParam}=${f.entity_id}`;
        if (f.status) url += `&status=${f.status}`;

        try {
          showLoading();
          const data = await api("GET", url);
          hideLoading();
          renderTable(data, type);
        } catch (ex) {
          hideLoading();
          showToast(ex.message, "error");
        }
      }

      function renderTable(data, type) {
        const header = document.getElementById("tblHeader");
        const body = document.getElementById("tblBody");

        const isSales = type === "sales";
        header.innerHTML = `
          <th>Nama Barang</th>
          <th style="text-align:center">Tgl Faktur</th>
          <th style="text-align:center">No. Faktur</th>
          <th>${isSales ? "Pelanggan" : "Supplier"}</th>
          <th style="text-align:center">Qty Beli</th>
          <th style="text-align:center">Tersisa</th>
          <th style="text-align:right">Harga</th>
          <th style="text-align:center">Aksi</th>
        `;

        if (!data || data.length === 0) {
          body.innerHTML = `<tr><td colspan="8" style="text-align:center; padding: 40px; color: var(--text-muted)">Tidak ada riwayat barang yang ditemukan.</td></tr>`;
          return;
        }

        body.innerHTML = data
          .map((it) => {
            const price = isSales ? it.sell_price : it.buy_price;
            const date = isSales ? it.sale_date : it.purchase_date;
            const number = isSales ? it.sale_number : it.purchase_number;
            const entity = isSales
              ? it.customer_name || "Umum"
              : it.supplier_name || "-";
            const qtyTotal = isSales ? it.qty_sold : it.qty_bought;
            const qtyLeft = it.qty_available;

            let statusBadge = "";
            if (it.status === "returned")
              statusBadge =
                '<span class="badge badge-danger">Retur Full</span>';
            else if (it.status === "partial")
              statusBadge =
                '<span class="badge badge-warning">Retur Sebagian</span>';

            const canReturn = qtyLeft > 0;
            const returBtn = canReturn
              ? `<button class="btn btn-primary" style="padding: 4px 10px; font-size: 12px" onclick='openReturnModal(${JSON.stringify(it).replace(/'/g, "&apos;")})'>↩ Retur</button>`
              : `<button class="btn" disabled style="padding: 4px 10px; font-size: 12px; opacity: 0.5">Sudah Habis</button>`;

            return `
            <tr>
              <td style="font-weight: 600">
                ${it.item.name}
                <div style="font-size: 11px; color: var(--text-muted); font-weight: normal">${it.item.code}</div>
                ${statusBadge}
              </td>
              <td style="text-align:center; font-size: 13px">${fmtDate(date)}</td>
              <td style="text-align:center; font-family: monospace; font-weight: 700; color: var(--primary)">${number}</td>
              <td style="font-size: 13px">${entity}</td>
              <td style="text-align:center">${qtyTotal}</td>
              <td style="text-align:center; font-weight: 700; color: ${qtyLeft > 0 ? "var(--primary)" : "var(--text-muted)"}">${qtyLeft}</td>
              <td style="text-align:right">${fmtRp(price)}</td>
              <td style="text-align:center">${returBtn}</td>
            </tr>
          `;
          })
          .join("");
      }

      function openReturnModal(item) {
        activeItem = item;
        const isSales = currentTab === "sales";

        document.getElementById("mReturnTitle").textContent = isSales
          ? "Retur Penjualan"
          : "Retur Pembelian";
        document.getElementById("mReturnMax").textContent = item.qty_available;
        document.getElementById("mReturnQty").value = item.qty_available;
        document.getElementById("mReturnQty").max = item.qty_available;
        document.getElementById("mReturnReason").value = "";
        document.getElementById("mReturnNotes").value = "";

        const entityLabel = isSales ? "Pelanggan" : "Supplier";
        const entityName = isSales
          ? item.customer_name || "Umum"
          : item.supplier_name || "-";
        const basePrice = isSales ? item.sell_price : item.buy_price;
        const tax = item.tax_percent || 0;
        const price = item.is_tax_included
          ? basePrice
          : basePrice + (basePrice * tax) / 100;
        tax > 0 ? console.log("PPN") : console.log("No PPN");
        console.log(item.tax_percent, item.is_tax_included, price);

        document.getElementById("mReturnItemInfo").innerHTML = `
          <div style="font-weight: 700; font-size: 16px; margin-bottom: 4px; color: var(--primary)">${item.item.name}</div>
          <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 10px">${item.item.code} | ${item.item.barcode || "-"}</div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 13px">
            <div><span style="color:var(--text-muted)">Faktur:</span> <span style="font-weight:600">${isSales ? item.sale_number : item.purchase_number}</span></div>
            <div><span style="color:var(--text-muted)">${entityLabel}:</span> <span style="font-weight:600">${entityName}</span></div>
            <div><span style="color:var(--text-muted)">Harga:</span> <span style="font-weight:600">${fmtRp(price)}</span></div>
            <div><span style="color:var(--text-muted)">Tersisa:</span> <span style="font-weight:600">${item.qty_available}</span></div>
          </div>
        `;

        openModal("mReturn");
      }

      async function prosesRetur() {
        const qty =
          parseFloat(document.getElementById("mReturnQty").value) || 0;
        if (qty <= 0) return showToast("Jumlah retur tidak valid", "error");
        if (qty > activeItem.qty_available)
          return showToast("Jumlah melebihi batas tersisa", "error");

        const reason = document.getElementById("mReturnReason").value;
        const notes = document.getElementById("mReturnNotes").value;
        const type = currentTab; // sales or purchase

        const payload = {
          date: new Date().toISOString().split("T")[0],
          reason: reason,
          notes: notes,
          items: [
            {
              item_id: activeItem.item_id,
              qty: qty,
            },
          ],
        };

        if (type === "sales") {
          payload.sale_id = activeItem.sale_id;
        } else {
          payload.purchase_id = activeItem.purchase_id;
        }

        try {
          showLoading("Memproses retur...");
          const res = await api(
            "POST",
            `/returns/${type === "sales" ? "sales" : "purchases"}`,
            payload,
          );
          hideLoading();

          showToast(`Berhasil! No. Retur: ${res.number}`);
          closeModal("mReturn");
          load();
        } catch (ex) {
          hideLoading();
          showToast(ex.message, "error");
        }
      }

      async function initFilters() {
        allSuppliers = await api(
          "GET",
          "/suppliers/?limit=5000&active_only=true",
        );
        allCustomers = await api("GET", "/customers/?limit=5000");

        const statusOpts = [
          { label: "Belum Retur", value: "not_returned" },
          { label: "Retur Sebagian", value: "partial" },
          { label: "Retur Penuh", value: "returned" },
        ];

        mainFilter = createFilterBar("mainFilterContainer", {
          onFilter: load,
          entities: allCustomers, // Default to sales
          statusOptions: statusOpts,
          useEntitySelect: true,
          entityPlaceholder: "Semua Supplier/Pelanggan",
        });
      }

      function fmtRp(n) {
        return new Intl.NumberFormat("id-ID", {
          style: "currency",
          currency: "IDR",
          minimumFractionDigits: 0,
        }).format(n || 0);
      }
      function fmtDate(d) {
        if (!d) return "-";
        return new Date(d + "T00:00:00").toLocaleDateString("id-ID", {
          day: "2-digit",
          month: "short",
          year: "numeric",
        });
      }

      (async () => {
        await initFilters();
        load();
      })();
    </script>
  </body>
</html>
