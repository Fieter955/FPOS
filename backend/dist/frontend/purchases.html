<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Pembelian - iPos 5.0</title>
    <link rel="stylesheet" href="/css/style.css" />

    <style>
      /* ========== HILANGKAN SPINNER ATAS/BAWAH PADA INPUT NUMBER ========== */
      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type="number"] {
        -moz-appearance: textfield; /* Untuk Firefox */
      }

      /* ========== KOMPONEN KHUSUS PEMBELIAN (Dipertahankan karena tidak ada di style.css global) ========== */

      /* --- COMBOBOX --- */
      .combobox-container {
        position: relative;
        width: 100%;
      }
      .combobox-input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        background: var(--input-bg);
        color: var(--text-main);
        font-size: 14px;
        outline: none;
        transition: border-color 0.2s;
      }
      .combobox-input:focus {
        border-color: var(--primary);
      }
      .combobox-dropdown {
        position: fixed;
        width: calc(100% - 32px);
        max-width: 500px;
        max-height: 240px;
        overflow-y: auto;
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        z-index: 9999;
        display: none;
      }
      .combobox-dropdown.show {
        display: block;
        animation: fadeIn 0.15s ease;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .combobox-item {
        padding: 12px 16px;
        cursor: pointer;
        border-bottom: 1px solid var(--border-color);
        color: var(--text-main);
        font-size: 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: background 0.15s;
      }
      .combobox-item:last-child {
        border-bottom: none;
      }
      .combobox-item:hover,
      .combobox-item.highlight {
        background: var(--primary-light);
        color: var(--primary);
      }
      .combobox-item .item-code {
        font-size: 12px;
        color: var(--text-muted);
        margin-left: 8px;
      }
      .combobox-empty {
        padding: 16px;
        text-align: center;
        color: var(--text-muted);
        font-style: italic;
        font-size: 13px;
      }

      /* --- TABEL RESPONSIF & GRID --- */
      .table-responsive {
        width: 100%;
        overflow-x: visible;
        padding-bottom: 12px;
        transition: overflow-x 0.2s ease;
      }
      .table-responsive.scroll-enabled {
        overflow-x: auto;
      }
      .purchase-grid {
        display: grid;
        grid-template-columns:
          minmax(180px, 1.5fr) 70px minmax(120px, 1.2fr)
          auto minmax(110px, 1fr) minmax(110px, 1fr) 40px;
        row-gap: 12px;
        column-gap: 12px;
        align-items: center;
        min-width: max-content;
        margin-bottom: 8px;
      }
      .purchase-header,
      #barisContainer,
      .purchase-row {
        display: contents;
      }
      .purchase-header > span {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-muted);
        padding-bottom: 8px;
        border-bottom: 1px solid var(--border-color);
      }
      .purchase-row .field-label {
        display: none;
      }
      .purchase-row .input-wrapper {
        width: 100%;
      }
      .purchase-row .input-wrapper .input-control {
        margin: 0;
        width: 100%;
        padding: 10px 12px;
        font-size: 14px;
      }
      .purchase-row > button {
        height: 42px;
        border-radius: 8px;
        font-size: 18px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .baris-netto {
        font-weight: 700;
        font-size: 15px;
        text-align: right;
        color: var(--primary);
        padding-right: 5px;
      }
      .baris-harga-per-qty {
        font-weight: 600;
        font-size: 14px;
        text-align: right;
        color: var(--text-main);
        padding-right: 5px;
      }

      /* --- DYNAMIC ISLAND (DISKON) --- */
      .diskon-wrapper {
        display: flex;
        flex-wrap: nowrap;
        align-items: center;
        gap: 8px;
        background: var(--input-bg);
        border: 1px solid var(--border-color);
        border-radius: 48px;
        padding: 6px 8px;
        transition: all 0.3s ease;
        min-height: 44px;
        min-width: max-content;
      }
      .disc-block {
        display: flex;
        align-items: center;
        gap: 6px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 32px;
        padding: 4px 8px;
        clip-path: inset(0 100% 0 0);
        opacity: 0;
        transform: translateX(-8px);
        transition:
          clip-path 0.35s ease,
          opacity 0.25s ease,
          transform 0.3s ease;
        min-width: max-content;
      }
      .disc-block.show {
        clip-path: inset(0 0% 0 0);
        opacity: 1;
        transform: translateX(0);
      }
      .disc-block .baris-disc {
        width: 32px;
        flex-shrink: 0;
        background: transparent;
        border: none;
        border-bottom: 2px solid var(--primary-light);
        border-radius: 0;
        padding: 4px 2px;
        text-align: center;
        font-size: 14px;
        font-weight: 600;
        color: var(--text-main);
      }
      .disc-block .after-disc-label {
        min-width: 64px;
        flex-shrink: 0;
        font-size: 12px;
        font-weight: 800;
        color: var(--text-main);
        text-align: right;
        overflow: visible;
        white-space: nowrap;
      }
      .disc-block .baris-disc:focus {
        border-bottom-color: var(--primary);
        outline: none;
      }

      /* --- MODAL WIDE (KHUSUS PEMBELIAN) --- */
      .modal-box.wide {
        width: 90%;
        min-width: 320px;
        margin: 16px auto;
        max-height: calc(100vh - 40px);
        overflow-y: auto !important;
        overflow-x: visible;
        padding: 24px 28px 40px;
        background: var(--card-bg);
        border-radius: 20px;
        transition:
          width 0.15s ease,
          overflow-x 0.15s ease;
      }
      .modal-box.wide.scroll-enabled {
        overflow-x: auto !important;
      }

      /* --- RESPONSIVE MOBILE --- */
      @media (max-width: 700px) {
        .purchase-grid {
          display: block;
          min-width: 100%;
        }
        .purchase-header {
          display: none;
        }
        #barisContainer {
          display: block;
        }
        .purchase-row {
          display: flex;
          flex-direction: column;
          gap: 10px;
          padding: 14px;
          background: var(--card-bg);
          border-radius: 12px;
          border: 1px solid var(--border-color);
          margin-bottom: 12px;
          min-width: 100%;
        }
        .purchase-row .field-label {
          display: block;
          font-size: 11px;
          font-weight: 700;
          color: var(--text-muted);
          text-transform: uppercase;
          margin-bottom: 6px;
        }
        .purchase-row .combobox-dropdown {
          width: calc(100vw - 48px);
          left: 50%;
          transform: translateX(-50%);
        }
        .purchase-row > button.btn-hapus-baris {
          align-self: flex-end;
          width: 32px;
          height: 32px;
          border-radius: 50%;
          font-size: 14px;
          margin-top: -8px;
          margin-right: -8px;
        }
        .baris-netto {
          text-align: center;
          font-size: 18px;
          margin-top: 10px;
          padding-top: 10px;
          border-top: 1px dashed var(--border-color);
          width: 100%;
        }
        .baris-harga-per-qty {
          text-align: center;
          font-size: 14px;
          color: var(--text-muted);
          width: 100%;
          padding-top: 0;
        }
        .diskon-wrapper {
          flex-wrap: wrap;
          background: var(--bg-color);
          padding: 10px;
          border-radius: 12px;
          border: 1px dashed var(--border-color);
        }
        .disc-block.show {
          max-width: calc(100vw - 48px);
        }
        .mobile-add-btn {
          display: block !important;
          position: sticky;
          bottom: 16px;
          width: calc(100% - 32px);
          margin: 16px auto;
          padding: 14px;
          font-size: 15px;
          font-weight: 700;
          box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }
        .desktop-add-btn {
          display: none !important;
        }
        .modal-box.wide {
          width: calc(100% - 32px) !important;
          overflow-x: auto !important;
        }
      }
      @media (min-width: 701px) {
        .mobile-add-btn {
          display: none !important;
        }
        .desktop-add-btn {
          display: inline-flex !important;
        }
      }

      /* --- SCROLLBAR KHUSUS --- */
      ::-webkit-scrollbar {
        width: 6px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border-color);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--text-muted);
      }
    </style>
  </head>
  <body>
    <div class="app-container">
      <main class="main-content">
        <button
          class="btn"
          style="
            background: transparent;
            color: var(--text-muted);
            padding: 0;
            margin-bottom: 16px;
          "
          onclick="location.href = '/dashboard'"
        >
          ← Kembali
        </button>
        <div class="pg-header">
          <div>
            <h1>📥 Pembelian (Restock)</h1>
            <p>Catat pembelian barang dari supplier.</p>
          </div>
          <button class="btn btn-primary" onclick="openBuatModal()">
            ➕ Catat Pembelian
          </button>
        </div>

        <div class="filter-bar">
          <input
            id="fStart"
            type="date"
            class="input-control"
            onchange="load()"
          />
          <input
            id="fEnd"
            type="date"
            class="input-control"
            onchange="load()"
          />
          <select id="fStatus" class="input-control" onchange="load()">
            <option value="">Semua Status</option>
            <option value="unpaid">Belum Lunas</option>
            <option value="partial">Sebagian</option>
            <option value="paid">Lunas</option>
          </select>
        </div>

        <div class="tbl-wrap">
          <table class="tbl">
            <thead>
              <tr>
                <th>No. Faktur</th>
                <th>Tanggal</th>
                <th>Supplier</th>
                <th>Total</th>
                <th>Terbayar</th>
                <th>Status</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="tblBody"></tbody>
          </table>
        </div>
      </main>
    </div>

    <div class="modal-overlay" id="mBuat">
      <div class="modal-box wide" id="modalBuatContent">
        <div class="modal-hdr">
          <h2>📥 Catat Pembelian Baru</h2>
          <button class="btn-x" onclick="closeModal('mBuat')">×</button>
        </div>

        <div
          style="
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
          "
        >
          <div class="input-group">
            <label style="margin-bottom: 6px">Supplier *</label>
            <div id="supplierCombobox" class="combobox-container"></div>
          </div>
          <div class="input-group">
            <label style="margin-bottom: 6px">Tanggal *</label>
            <input type="date" id="bDate" class="input-control" />
          </div>
        </div>
        <div
          style="
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
          "
        >
          <div class="input-group">
            <label style="margin-bottom: 6px">Diskon Global (%)</label>
            <input
              type="number"
              id="bDisc"
              class="input-control"
              value="0"
              min="0"
              max="100"
              oninput="hitungTotal()"
            />
          </div>
          <div class="input-group">
            <label style="margin-bottom: 6px">PPN (%)</label>
            <input
              type="number"
              id="bTax"
              class="input-control"
              value="0"
              min="0"
              max="100"
              oninput="hitungTotal()"
            />
          </div>
        </div>

        <div style="margin-bottom: 12px">
          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
              margin-bottom: 12px;
            "
          >
            <label style="font-weight: 600; color: var(--text-muted)"
              >Daftar Barang</label
            >
            <button
              type="button"
              onclick="addBaris()"
              class="btn desktop-add-btn"
              style="
                padding: 8px 16px;
                background: var(--primary-light);
                color: var(--primary);
                border: none;
                font-weight: 700;
              "
            >
              + Tambah Baris
            </button>
          </div>

          <div class="table-responsive" id="tableResponsiveWrapper">
            <div class="purchase-grid">
              <div class="purchase-header">
                <span>Barang</span>
                <span>Qty</span>
                <span>Harga Beli</span>
                <span>Diskon Bertingkat</span>
                <span style="text-align: right">Harga/Qty</span>
                <span style="text-align: right">Total</span>
                <span></span>
              </div>
              <div id="barisContainer"></div>
            </div>
          </div>

          <button
            type="button"
            onclick="addBaris()"
            class="btn btn-primary mobile-add-btn"
            style="display: none"
          >
            ➕ Tambah Barang
          </button>
        </div>

        <div
          style="
            background: var(--bg-color);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
          "
        >
          <span
            style="font-size: 15px; font-weight: 600; color: var(--text-muted)"
            >TOTAL PEMBELIAN</span
          >
          <span
            id="totalLabel"
            style="font-size: 24px; font-weight: 900; color: var(--primary)"
            >Rp 0</span
          >
        </div>

        <div class="input-group">
          <label style="margin-bottom: 6px">Catatan</label>
          <textarea
            id="bNotes"
            class="input-control"
            rows="2"
            placeholder="No. surat jalan, keterangan, dll..."
          ></textarea>
        </div>

        <div
          style="
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
          "
        >
          <button
            onclick="closeModal('mBuat')"
            class="btn"
            style="
              background: var(--bg-color);
              border: 1px solid var(--border-color);
              color: var(--text-main);
            "
          >
            Batal
          </button>
          <button onclick="simpanPembelian()" class="btn btn-primary">
            ✓ Simpan Pembelian
          </button>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="mBayar">
      <div class="modal-box">
        <div class="modal-hdr">
          <h2>💸 Bayar Hutang Supplier</h2>
          <button class="btn-x" onclick="closeModal('mBayar')">×</button>
        </div>
        <input type="hidden" id="bayarId" />
        <div
          id="bayarInfo"
          style="
            background: var(--bg-color);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 16px;
            font-size: 15px;
          "
        ></div>
        <div class="input-group">
          <label style="margin-bottom: 6px">Jumlah Bayar (Rp)</label>
          <input
            type="text"
            inputmode="numeric"
            id="bayarAmt"
            class="input-control"
            min="0"
            oninput="
              (() => {
                const raw = parseNum(this.value);
                const pos = this.selectionStart;
                const oldLen = this.value.length;
                this.value = formatNum(raw);
                const newLen = this.value.length;
                this.setSelectionRange(
                  pos + (newLen - oldLen),
                  pos + (newLen - oldLen),
                );
              })()
            "
          />
        </div>
        <div class="input-group" style="margin-top: 16px">
          <label style="margin-bottom: 6px">Catatan</label>
          <input
            type="text"
            id="bayarNote"
            class="input-control"
            placeholder="No. transfer, bukti bayar, dll..."
          />
        </div>
        <div
          style="
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
          "
        >
          <button
            onclick="closeModal('mBayar')"
            class="btn"
            style="
              background: var(--bg-color);
              border: 1px solid var(--border-color);
              color: var(--text-main);
            "
          >
            Batal
          </button>
          <button onclick="doBayar()" class="btn btn-primary">✓ Bayar</button>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="mDetail">
      <div class="modal-box wide">
        <div class="modal-hdr">
          <h2 id="mDetailTitle">Detail Pembelian</h2>
          <button class="btn-x" onclick="closeModal('mDetail')">×</button>
        </div>
        <div id="mDetailBody"></div>
      </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/theme.js"></script>
    <script>
      requireAuth();

      let allSuppliers = [];
      let currentSupplierItems = [];
      let barisIdx = 0;
      let activeCombobox = null;
      let resizeObserver = null;

      function formatNum(n) {
        return new Intl.NumberFormat("id-ID").format(n || 0);
      }
      function parseNum(s) {
        return parseFloat(String(s).replace(/\./g, "").replace(",", ".")) || 0;
      }

      // GAYA BADGE STATUS MENYESUAIKAN MANAJEMEN CABANG
      const sb = (s) => {
        if (s === "paid")
          return '<span style="background:rgba(16,185,129,0.15);color:#10b981;padding:4px 10px;border-radius:6px;font-weight:700;font-size:12px;">✓ Lunas</span>';
        if (s === "unpaid")
          return '<span style="background:rgba(239,68,68,0.15);color:#ef4444;padding:4px 10px;border-radius:6px;font-weight:700;font-size:12px;">✗ Belum Lunas</span>';
        if (s === "partial")
          return '<span style="background:rgba(245,158,11,0.15);color:#f59e0b;padding:4px 10px;border-radius:6px;font-weight:700;font-size:12px;">~ Sebagian</span>';
        return `<span style="background:rgba(148,163,184,0.15);color:#94a3b8;padding:4px 10px;border-radius:6px;font-weight:700;font-size:12px;">${s}</span>`;
      };

      function today() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      }
      function fmtRp(n) {
        return new Intl.NumberFormat("id-ID", {
          style: "currency",
          currency: "IDR",
          minimumFractionDigits: 0,
        }).format(n || 0);
      }
      function fmtDate(d) {
        if (!d) return "-";
        const dt = new Date(d + "T00:00:00");
        return dt.toLocaleDateString("id-ID", {
          day: "2-digit",
          month: "short",
          year: "numeric",
        });
      }

      function positionDropdown(inputEl, dropdownEl) {
        const rect = inputEl.getBoundingClientRect();
        const viewportHeight = window.innerHeight;
        const dropdownHeight = 240;
        let top = rect.bottom + window.scrollY + 4;
        if (rect.bottom + dropdownHeight > viewportHeight - 20)
          top = rect.top + window.scrollY - dropdownHeight - 4;
        const isMobile = window.innerWidth <= 700;
        dropdownEl.style.top = `${Math.max(8, top)}px`;
        dropdownEl.style.left = isMobile
          ? "50%"
          : `${rect.left + window.scrollX}px`;
        dropdownEl.style.transform = isMobile ? "translateX(-50%)" : "none";
        dropdownEl.style.width = isMobile
          ? "calc(100vw - 32px)"
          : `${Math.min(rect.width, 500)}px`;
      }

      function createComboboxDynamic(container, options) {
        const {
          placeholder = "Ketik untuk mencari...",
          data = [],
          valueField = "id",
          labelField = "name",
          onSelect = null,
        } = options;
        container.innerHTML = `<input type="text" class="combobox-input" placeholder="${placeholder}" autocomplete="off" /><div class="combobox-dropdown"></div><input type="hidden" class="combobox-value" />`;
        const input = container.querySelector(".combobox-input");
        const dropdown = container.querySelector(".combobox-dropdown");
        const hidden = container.querySelector(".combobox-value");
        let items = data,
          highlightedIndex = -1;

        const render = (searchText = "") => {
          const search = searchText.toLowerCase();
          const filtered = items.filter(
            (item) =>
              String(item[labelField]).toLowerCase().includes(search) ||
              (item.code && item.code.toLowerCase().includes(search)) ||
              (item.barcode && String(item.barcode).includes(search)),
          );
          if (filtered.length === 0) {
            dropdown.innerHTML = `<div class="combobox-empty">Tidak ditemukan</div>`;
            dropdown.classList.add("show");
            return;
          }
          dropdown.innerHTML = filtered
            .map(
              (item, idx) =>
                `<div class="combobox-item ${idx === highlightedIndex ? "highlight" : ""}" data-id="${item[valueField]}" data-label="${item[labelField]}"><span>${item[labelField]}</span>${item.code ? `<span class="item-code">[${item.code}]</span>` : ""}</div>`,
            )
            .join("");
          dropdown.classList.add("show");
          dropdown.querySelectorAll(".combobox-item").forEach((el) => {
            el.addEventListener("click", () => {
              const id = el.dataset.id,
                label = el.dataset.label;
              input.value = label;
              hidden.value = id;
              dropdown.classList.remove("show");
              if (onSelect)
                onSelect({
                  id,
                  label,
                  item: items.find((i) => i[valueField] == id),
                });
            });
          });
        };
        const showDropdown = () => {
          render(input.value);
          positionDropdown(input, dropdown);
          activeCombobox = {
            container,
            input,
            dropdown,
            hidden,
            render,
            items,
            highlightedIndex,
          };
        };
        input.addEventListener("focus", showDropdown);
        input.addEventListener("input", () => {
          highlightedIndex = -1;
          render(input.value);
          positionDropdown(input, dropdown);
        });
        input.addEventListener("keydown", (e) => {
          if (!dropdown.classList.contains("show")) return;
          const itemsList = dropdown.querySelectorAll(".combobox-item");
          if (e.key === "ArrowDown") {
            e.preventDefault();
            highlightedIndex = Math.min(
              highlightedIndex + 1,
              itemsList.length - 1,
            );
            render(input.value);
          } else if (e.key === "ArrowUp") {
            e.preventDefault();
            highlightedIndex = Math.max(highlightedIndex - 1, -1);
            render(input.value);
          } else if (e.key === "Enter") {
            e.preventDefault();
            if (highlightedIndex >= 0 && itemsList[highlightedIndex])
              itemsList[highlightedIndex].click();
          } else if (e.key === "Escape") dropdown.classList.remove("show");
        });
        document.addEventListener("click", (e) => {
          if (!container.contains(e.target)) dropdown.classList.remove("show");
        });
        window.addEventListener("resize", () => {
          if (activeCombobox?.dropdown?.classList.contains("show"))
            positionDropdown(activeCombobox.input, activeCombobox.dropdown);
        });
        return {
          setItems: (newItems) => {
            items = newItems;
            if (dropdown.classList.contains("show")) render(input.value);
          },
          getValue: () => hidden.value,
          clear: () => {
            hidden.value = "";
            input.value = "";
          },
        };
      }

      function createSupplierCombobox(containerId) {
        const container = document.getElementById(containerId);
        if (!container) return null;
        container.innerHTML = `<input type="text" class="combobox-input" placeholder="Cari supplier..." autocomplete="off" /><div class="combobox-dropdown"></div><input type="hidden" class="combobox-value" />`;
        const input = container.querySelector(".combobox-input");
        const dropdown = container.querySelector(".combobox-dropdown");
        const hidden = container.querySelector(".combobox-value");
        let highlightedIndex = -1;
        const render = (searchText = "") => {
          const search = searchText.toLowerCase();
          const filtered = allSuppliers.filter(
            (s) =>
              s.name.toLowerCase().includes(search) ||
              (s.code && s.code.toLowerCase().includes(search)),
          );
          if (filtered.length === 0) {
            dropdown.innerHTML = `<div class="combobox-empty">Tidak ditemukan</div>`;
            dropdown.classList.add("show");
            return;
          }
          dropdown.innerHTML = filtered
            .map(
              (s, idx) =>
                `<div class="combobox-item ${idx === highlightedIndex ? "highlight" : ""}" data-id="${s.id}" data-name="${s.name}">${s.name}</div>`,
            )
            .join("");
          dropdown.classList.add("show");
          dropdown.querySelectorAll(".combobox-item").forEach((el) => {
            el.addEventListener("click", async () => {
              const id = parseInt(el.dataset.id),
                name = el.dataset.name;
              input.value = name;
              hidden.value = id;
              dropdown.classList.remove("show");
              await loadSupplierItems(id);
            });
          });
        };
        const showDropdown = () => {
          render(input.value);
          positionDropdown(input, dropdown);
        };
        input.addEventListener("focus", showDropdown);
        input.addEventListener("input", () => {
          highlightedIndex = -1;
          render(input.value);
          positionDropdown(input, dropdown);
        });
        input.addEventListener("keydown", (e) => {
          if (!dropdown.classList.contains("show")) return;
          const itemsList = dropdown.querySelectorAll(".combobox-item");
          if (e.key === "ArrowDown") {
            e.preventDefault();
            highlightedIndex = Math.min(
              highlightedIndex + 1,
              itemsList.length - 1,
            );
            render(input.value);
          } else if (e.key === "ArrowUp") {
            e.preventDefault();
            highlightedIndex = Math.max(highlightedIndex - 1, -1);
            render(input.value);
          } else if (e.key === "Enter") {
            e.preventDefault();
            if (highlightedIndex >= 0 && itemsList[highlightedIndex])
              itemsList[highlightedIndex].click();
          } else if (e.key === "Escape") dropdown.classList.remove("show");
        });
        document.addEventListener("click", (e) => {
          if (!container.contains(e.target)) dropdown.classList.remove("show");
        });
        return {
          getValue: () => (hidden.value ? parseInt(hidden.value) : null),
          clear: () => {
            hidden.value = "";
            input.value = "";
            currentSupplierItems = [];
          },
        };
      }

      async function loadSupplierItems(supplierId) {
        try {
          currentSupplierItems = await api(

            `/purchases/items/?supplier_id=${supplierId}`,

            .querySelectorAll("#barisContainer .item-combobox-container")

              const combo = container._combobox;

            addBaris();
          updateScrollLogic();

      function updateScrollLogic() {
        const modal = document.getElementById("modalBuatContent");
        const tableWrapper = document.getElementById("tableResponsiveWrapper");
        if (!modal || !tableWrapper) return;
        const viewportWidth = window.innerWidth,
          contentWidth = tableWrapper.scrollWidth;
        if (contentWidth > viewportWidth - 40) {
          modal.style.width = "calc(100% - 32px)";
          modal.classList.add("scroll-enabled");
          tableWrapper.classList.add("scroll-enabled");
        } else {
          modal.style.width = "auto";
          modal.style.minWidth = "90%";
          modal.classList.remove("scroll-enabled");
          tableWrapper.classList.remove("scroll-enabled");
        }
      }

      function setupResizeObserver() {
        const tableWrapper = document.getElementById("tableResponsiveWrapper");
        if (!tableWrapper) return;
        if (resizeObserver) resizeObserver.disconnect();
        resizeObserver = new ResizeObserver(() => {
          clearTimeout(window._scrollLogicTimeout);
          window._scrollLogicTimeout = setTimeout(updateScrollLogic, 50);
        });
        resizeObserver.observe(tableWrapper);
      }

        document.getElementById("barisContainer").innerHTML = "";

        currentSupplierItems = [];

        document.getElementById("bTax").value = 0;
        document.getElementById("bNotes").value = "";

        const modal = document.getElementById("modalBuatContent");
        if (modal) {
          modal.style.width = "90%";
          modal.classList.remove("scroll-enabled");
        }
        const tableWrapper = document.getElementById("tableResponsiveWrapper");
        if (tableWrapper) tableWrapper.classList.remove("scroll-enabled");
        allSuppliers = await api(
          "GET",
          "/suppliers/?limit=200&active_only=true",
        );
        createSupplierCombobox("supplierCombobox");
        openModal("mBuat");
        setTimeout(() => {
          setupResizeObserver();
          updateScrollLogic();
        }, 100);
      }

        delBtn.style.cssText =
          "width:36px;height:36px;border-radius:50%;background:rgba(239,68,68,.15);color:#ef4444;border:none;cursor:pointer;font-size:16px;font-weight:700;flex-shrink:0;display:flex;align-items:center;justify-content:center";

      function appendDiscountBlock(container, btn) {
        const block = document.createElement("div");
        block.className = "disc-block";
        const inp = document.createElement("input");
        inp.type = "number";
        inp.className = "input-control baris-disc";
        inp.value = "0";
        inp.min = "0";
        inp.max = "100";
        inp.onclick = () => inp.select(); // Langsung select saat diklik
        inp.oninput = () => {
          hitungTotal();
          updateScrollLogic();
        };
        const pct = document.createElement("span");
        pct.textContent = "%";
        pct.style.cssText =
          "font-size:11px;font-weight:bold;color:var(--text-muted);flex-shrink:0;";
        const arrow = document.createElement("span");
        arrow.textContent = "→";
        arrow.style.cssText =
          "color:var(--primary);font-size:12px;flex-shrink:0;margin:0 2px;";
        const lblAfter = document.createElement("div");
        lblAfter.className = "after-disc-label";
        lblAfter.textContent = "Rp 0";
        const del = document.createElement("button");
        del.type = "button";
        del.innerHTML = "&times;";
        del.style.cssText =
          "background:none;border:none;color:#ef4444;cursor:pointer;font-size:24px;line-height:0.8;font-weight:bold;padding:0 2px;outline:none;flex-shrink:0;margin-left:4px;";
        del.title = "Hapus diskon ini";
        del.onclick = () => {
          block.classList.remove("show");
          setTimeout(() => {
            block.remove();
            hitungTotal();
            updateScrollLogic();
          }, 350);
        };

        block.appendChild(inp);
        block.appendChild(pct);
        block.appendChild(arrow);
        block.appendChild(lblAfter);
        block.appendChild(del);
        container.insertBefore(block, btn);
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            block.classList.add("show");
            inp.focus();
            inp.select();
            updateScrollLogic();
          });
        });
      }

      function hitungTotal() {
        const discGlobal =
          parseFloat(document.getElementById("bDisc").value) || 0;
        const taxGlobal =
          parseFloat(document.getElementById("bTax").value) || 0;
        let sub = 0;
        document
          .querySelectorAll("#barisContainer > .purchase-row")
          .forEach((row) => {
            const qtyInp = row.querySelector(".qty-input"),
              hargaInp = row.querySelector(".baris-harga"),
              hargaPerQtyLabel = row.querySelector(".baris-harga-per-qty"),
              nettoLabel = row.querySelector(".baris-netto");
            if (qtyInp && hargaInp) {
              let qty = parseNum(qtyInp.value) || 0,
                hargaAwal = parseNum(hargaInp.value) || 0,
                hargaSekarang = hargaAwal;
              row.querySelectorAll(".disc-block").forEach((block) => {
                const discVal =
                  parseFloat(block.querySelector(".baris-disc").value) || 0;
                hargaSekarang = hargaSekarang * (1 - discVal / 100);
                const labelAfter = block.querySelector(".after-disc-label");
                if (labelAfter) labelAfter.textContent = fmtRp(hargaSekarang);
              });
              const barisTotal = hargaSekarang * qty;
              sub += barisTotal;
              if (hargaPerQtyLabel)
                hargaPerQtyLabel.textContent = fmtRp(hargaSekarang);
              if (nettoLabel) nettoLabel.textContent = fmtRp(barisTotal);
            }
          });
        const discAmt = sub * (discGlobal / 100),
          taxAmt = (sub - discAmt) * (taxGlobal / 100);
        document.getElementById("totalLabel").textContent = fmtRp(
          sub - discAmt + taxAmt,
        );
      }

      async function simpanPembelian() {
        const supplierId = document.querySelector(
          "#supplierCombobox .combobox-value",
        )?.value;
        if (!supplierId) return showToast("Pilih supplier dulu", "error");
        const rows = [];
        document
          .querySelectorAll("#barisContainer > .purchase-row")
          .forEach((row) => {
            const hiddenItem = row.querySelector(".combobox-value");
            if (!hiddenItem || !hiddenItem.value) return;
            const qty = parseNum(row.querySelector(".qty-input").value) || 1,
              buy_price =
                parseNum(row.querySelector(".baris-harga").value) || 0;
            let hargaSekarang = buy_price;
            row.querySelectorAll(".baris-disc").forEach((inp) => {
              const d = parseFloat(inp.value) || 0;
              hargaSekarang = hargaSekarang * (1 - d / 100);
            });
            let ekuivalenDiskon = 0;
            if (buy_price > 0)
              ekuivalenDiskon = ((buy_price - hargaSekarang) / buy_price) * 100;
            rows.push({
              item_id: parseInt(hiddenItem.value),
              qty,
              buy_price,
              discount: parseFloat(ekuivalenDiskon.toFixed(4)),
            });
          });
        if (!rows.length)
          return showToast("Tambahkan minimal 1 barang", "error");
        try {
          showLoading("Menyimpan...");
          await api("POST", "/purchases/", {
            date: document.getElementById("bDate").value,
            supplier_id: parseInt(supplierId),
            discount: parseFloat(document.getElementById("bDisc").value) || 0,
            tax: parseFloat(document.getElementById("bTax").value) || 0,
            notes: document.getElementById("bNotes").value || null,
            items: rows,
            paid: 0,
          });
          hideLoading();
          showToast("Pembelian disimpan ✓");
          closeModal("mBuat");
          load();
        } catch (ex) {
          hideLoading();
          showToast(ex.message, "error");
        }
      }

      const originalCloseModal = closeModal;

        if (modalId === "mBuat" && resizeObserver) {
          resizeObserver.disconnect();
          resizeObserver = null;
        }
        originalCloseModal(modalId);
      };
      document.getElementById("fStart").value = today().slice(0, 7) + "-01";
      document.getElementById("fEnd").value = today();
      load();
    </script>
  </body>
</html>
