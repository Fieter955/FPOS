<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Perakitan (BOM) - FPOS</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="app-container">
      <main class="main-content">
        <button
          class="btn"
          style="
            background: transparent;
            color: var(--text-muted);
            padding: 0;
            margin-bottom: 16px;
          "
          onclick="location.href = '/dashboard'"
        >
          ← Kembali
        </button>
        <div class="pg-header">
          <div>
            <h1>🔧 Perakitan (BOM)</h1>
            <p>
              Buat formula bahan baku menjadi produk jadi, lalu proses
              perakitan.
            </p>
          </div>
        </div>

        <!-- Tab -->
        <div style="display: flex; gap: 8px; margin-bottom: 20px">
          <button
            id="tbBOM"
            onclick="switchTab('bom')"
            style="
              padding: 8px 20px;
              border-radius: 100px;
              border: 2px solid var(--primary);
              background: var(--primary);
              color: #fff;
              font-weight: 700;
              cursor: pointer;
              font-family: inherit;
            "
          >
            📋 Formula (BOM)
          </button>
          <button
            id="tbOrder"
            onclick="switchTab('order')"
            style="
              padding: 8px 20px;
              border-radius: 100px;
              border: 2px solid var(--border-color);
              background: transparent;
              color: var(--text-muted);
              font-weight: 700;
              cursor: pointer;
              font-family: inherit;
            "
          >
            ⚙️ Order Perakitan
          </button>
        </div>

        <!-- Panel BOM -->
        <div id="pnlBOM">
          <div
            style="
              display: flex;
              justify-content: flex-end;
              margin-bottom: 14px;
            "
          >
            <button class="btn btn-primary" onclick="openModal('mBOM')">
              ➕ Buat Formula BOM
            </button>
          </div>
          <div class="tbl-wrap">
            <table class="tbl">
              <thead>
                <tr>
                  <th>Produk Hasil</th>
                  <th>Output per Proses</th>
                  <th>Jumlah Komponen</th>
                  <th>Estimasi Biaya</th>
                  <th>Aksi</th>
                </tr>
              </thead>
              <tbody id="tblBOM"></tbody>
            </table>
          </div>
        </div>

        <!-- Panel Order -->
        <div id="pnlOrder" style="display: none">
          <div
            style="
              display: flex;
              justify-content: flex-end;
              margin-bottom: 14px;
            "
          >
            <button class="btn btn-primary" onclick="openModal('mOrder')">
              ➕ Buat Order Perakitan
            </button>
          </div>
          <div class="tbl-wrap">
            <table class="tbl">
              <thead>
                <tr>
                  <th>No. Order</th>
                  <th>Produk</th>
                  <th>Qty Target</th>
                  <th>Tanggal</th>
                  <th>Status</th>
                  <th>Aksi</th>
                </tr>
              </thead>
              <tbody id="tblOrder"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>

    <!-- Modal: BOM -->
    <div class="modal-overlay" id="mBOM">
      <div class="modal-box wide">
        <div class="modal-hdr">
          <h2 id="mBOMTitle">Buat Formula BOM</h2>
          <button class="btn-x" onclick="closeModal('mBOM')">×</button>
        </div>
        <input type="hidden" id="bomId" />
        <div class="row2" style="margin-bottom: 16px">
          <div class="input-group">
            <label>Produk Hasil *</label
            ><select id="bomProd" class="input-control">
              <option value="">-- Pilih Produk --</option>
            </select>
          </div>
          <div class="input-group">
            <label>Qty Output per Proses *</label
            ><input
              id="bomQty"
              type="number"
              class="input-control"
              value="1"
              min="0.01"
              step="0.01"
            />
          </div>
        </div>
        <div style="margin-bottom: 12px">
          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
              margin-bottom: 8px;
            "
          >
            <label style="font-weight: 700; color: var(--text-muted)"
              >🔩 Komponen / Bahan Baku</label
            >
            <button
              onclick="addKomponen()"
              class="btn"
              style="
                padding: 8px 14px;
                background: var(--primary-light);
                color: var(--primary);
                border: none;
                border-radius: 10px;
                font-weight: 700;
                font-size: 13px;
              "
            >
              + Tambah Komponen
            </button>
          </div>
          <div
            style="
              display: grid;
              grid-template-columns: 3fr 1fr 1fr 36px;
              gap: 8px;
              margin-bottom: 6px;
              font-size: 12px;
              font-weight: 600;
              color: var(--text-muted);
            "
          >
            <span>Komponen</span><span>Qty Pakai</span><span>Est. Biaya</span
            ><span></span>
          </div>
          <div id="komponenRows"></div>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px">
          <button
            onclick="closeModal('mBOM')"
            class="btn"
            style="
              background: var(--bg-color);
              border: 1px solid var(--border-color);
              color: var(--text-main);
            "
          >
            Batal
          </button>
          <button onclick="saveBOM()" class="btn btn-primary">
            ✓ Simpan BOM
          </button>
        </div>
      </div>
    </div>

    <!-- Modal: Detail BOM -->
    <div class="modal-overlay" id="mBOMDetail">
      <div class="modal-box wide">
        <div class="modal-hdr">
          <h2 id="mBOMDetailTitle">Detail Formula</h2>
          <button class="btn-x" onclick="closeModal('mBOMDetail')">×</button>
        </div>
        <div id="mBOMDetailBody"></div>
      </div>
    </div>

    <!-- Modal: Order Perakitan -->
    <div class="modal-overlay" id="mOrder">
      <div class="modal-box">
        <div class="modal-hdr">
          <h2>⚙️ Buat Order Perakitan</h2>
          <button class="btn-x" onclick="closeModal('mOrder')">×</button>
        </div>
        <div class="input-group">
          <label>Pilih Formula (BOM) *</label
          ><select id="orderBOM" class="input-control">
            <option value="">-- Pilih BOM --</option>
          </select>
        </div>
        <div
          id="orderBOMInfo"
          style="
            background: var(--bg-color);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 14px;
            font-size: 14px;
            display: none;
          "
        ></div>
        <div class="row2" style="margin-bottom: 16px">
          <div class="input-group">
            <label>Qty yang Akan Dirakit *</label
            ><input
              id="orderQty"
              type="number"
              class="input-control"
              value="1"
              min="1"
            />
          </div>
          <div class="input-group">
            <label>Tanggal</label
            ><input id="orderDate" type="date" class="input-control" />
          </div>
        </div>
        <div class="input-group">
          <label>Catatan</label
          ><textarea id="orderNote" class="input-control" rows="2"></textarea>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px">
          <button
            onclick="closeModal('mOrder')"
            class="btn"
            style="
              background: var(--bg-color);
              border: 1px solid var(--border-color);
              color: var(--text-main);
            "
          >
            Batal
          </button>
          <button onclick="saveOrder()" class="btn btn-primary">
            ✓ Buat Order
          </button>
        </div>
      </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/theme.js"></script>
    <script>
      requireAuth();
      let allItems = [],
        kompIdx = 0,
        allBOMs = [];
      const ON =
        "padding:8px 20px;border-radius:100px;border:2px solid var(--primary);background:var(--primary);color:#fff;font-weight:700;cursor:pointer;font-family:inherit";
      const OFF =
        "padding:8px 20px;border-radius:100px;border:2px solid var(--border-color);background:transparent;color:var(--text-muted);font-weight:700;cursor:pointer;font-family:inherit";

      async function init() {
        allItems = await api("GET", "/items/?limit=500");
        const sel = document.getElementById("bomProd");
        allItems.forEach((i) =>
          sel.insertAdjacentHTML(
            "beforeend",
            `<option value="${i.id}">${i.name} (${i.code || ""})</option>`,
          ),
        );
        document.getElementById("orderDate").value = today();
        loadBOM();
      }

      function switchTab(t) {
        document.getElementById("pnlBOM").style.display =
          t === "bom" ? "block" : "none";
        document.getElementById("pnlOrder").style.display =
          t === "order" ? "block" : "none";
        document.getElementById("tbBOM").style.cssText = t === "bom" ? ON : OFF;
        document.getElementById("tbOrder").style.cssText =
          t === "order" ? ON : OFF;
        if (t === "order") loadOrders();
      }

      function addKomponen(itemId = "", qty = 1) {
        const idx = kompIdx++;
        const opts =
          '<option value="">-- Pilih Komponen --</option>' +
          allItems
            .map(
              (i) =>
                `<option value="${i.id}" data-price="${i.buy_price}" ${i.id == itemId ? "selected" : ""}>${i.name}</option>`,
            )
            .join("");
        document.getElementById("komponenRows").insertAdjacentHTML(
          "beforeend",
          `
    <div style="display:grid;grid-template-columns:3fr 1fr 1fr 36px;gap:8px;margin-bottom:8px;align-items:center" id="komp${idx}">
      <select class="input-control" style="margin:0;padding:10px 12px;font-size:14px" onchange="setKompPrice(${idx},this)">${opts}</select>
      <input type="number" value="${qty}" min="0.01" step="0.01" class="input-control" style="margin:0;padding:10px;text-align:center;font-weight:700">
      <input type="number" value="0" min="0" class="input-control kprice" style="margin:0;padding:10px;font-size:14px;color:var(--text-muted)" readonly>
      <button onclick="document.getElementById('komp${idx}').remove()" style="width:36px;height:36px;border-radius:8px;background:rgba(239,68,68,.15);color:#ef4444;border:none;cursor:pointer;font-size:16px;font-weight:700">✕</button>
    </div>`,
        );
        if (itemId)
          setKompPrice(idx, document.querySelector(`#komp${idx} select`));
      }
      function setKompPrice(idx, sel) {
        const opt = sel.options[sel.selectedIndex];
        const el = document.querySelector(`#komp${idx} .kprice`);
        if (el) el.value = opt?.dataset?.price || 0;
      }

      const _origOM = openModal;
      window.openModal = function (id) {
        if (id === "mBOM") {
          document.getElementById("bomId").value = "";
          document.getElementById("mBOMTitle").textContent = "Buat Formula BOM";
          document.getElementById("bomProd").value = "";
          document.getElementById("bomQty").value = 1;
          document.getElementById("komponenRows").innerHTML = "";
          kompIdx = 0;
          addKomponen();
          addKomponen();
        }
        if (id === "mOrder") {
          // populate BOM dropdown
          const sel = document.getElementById("orderBOM");
          sel.innerHTML =
            '<option value="">-- Pilih BOM --</option>' +
            allBOMs
              .map(
                (b) =>
                  `<option value="${b.id}">${b.item?.name} (output: ${b.output_qty})</option>`,
              )
              .join("");
          sel.onchange = function () {
            const bom = allBOMs.find((b) => b.id == this.value);
            const el = document.getElementById("orderBOMInfo");
            if (bom) {
              el.style.display = "block";
              el.innerHTML = `Menghasilkan: <b>${bom.output_qty} ${bom.item?.unit?.abbreviation || "pcs"} ${bom.item?.name}</b><br>Komponen: ${(bom.lines || []).map((l) => `${l.qty} ${l.item?.name}`).join(", ")}`;
            } else el.style.display = "none";
          };
          document.getElementById("orderQty").value = 1;
          document.getElementById("orderDate").value = today();
          document.getElementById("orderNote").value = "";
        }
        _origOM(id);
      };

      async function saveBOM() {
        const item_id = parseInt(document.getElementById("bomProd").value);
        if (!item_id) {
          showToast("Pilih produk hasil dulu", "error");
          return;
        }
        const lines = [];
        document.querySelectorAll("#komponenRows > div").forEach((row) => {
          const sel = row.querySelector("select");
          const inps = row.querySelectorAll("input[type=number]");
          if (sel.value)
            lines.push({
              item_id: parseInt(sel.value),
              qty: parseFloat(inps[0]?.value) || 1,
            });
        });
        if (!lines.length) {
          showToast("Tambahkan minimal 1 komponen", "error");
          return;
        }
        const id = document.getElementById("bomId").value;
        try {
          showLoading();
          if (id)
            await api("PUT", `/assembly/bom/${id}`, {
              item_id,
              output_qty:
                parseFloat(document.getElementById("bomQty").value) || 1,
              lines,
            });
          else
            await api("POST", "/assembly/bom", {
              item_id,
              output_qty:
                parseFloat(document.getElementById("bomQty").value) || 1,
              lines,
            });
          hideLoading();
          showToast("BOM disimpan ✓");
          closeModal("mBOM");
          loadBOM();
        } catch (ex) {
          hideLoading();
          showToast(ex.message, "error");
        }
      }

      async function loadBOM() {
        try {
          allBOMs = await api("GET", "/assembly/bom?limit=100");
          document.getElementById("tblBOM").innerHTML = allBOMs.length
            ? allBOMs
                .map((b) => {
                  const biaya =
                    (b.lines || []).reduce(
                      (a, l) => a + l.qty * (l.item?.buy_price || 0),
                      0,
                    ) * b.output_qty;
                  return `<tr>
        <td><b style="font-size:16px">${b.item?.name || "-"}</b><div style="font-size:12px;color:var(--text-muted)">${b.item?.code || ""}</div></td>
        <td style="font-size:18px;font-weight:800">${b.output_qty} <span style="font-size:13px;color:var(--text-muted)">${b.item?.unit?.abbreviation || "pcs"}</span></td>
        <td>${(b.lines || []).length} komponen</td>
        <td style="font-weight:700;color:var(--primary)">${fmtRp(biaya)}</td>
        <td style="white-space:nowrap">
          <button class="bsm bv" onclick="detailBOM(${b.id})">Detail</button>
          <button class="bsm be" onclick="editBOM(${b.id})">Edit</button>
          <button class="bsm bd" onclick="hapusBOM(${b.id})">Hapus</button>
        </td></tr>`;
                })
                .join("")
            : '<tr><td colspan="5" style="text-align:center;padding:24px;color:var(--text-muted)">Belum ada formula BOM</td></tr>';
        } catch (ex) {
          showToast(ex.message, "error");
        }
      }

      async function detailBOM(id) {
        const b =
          allBOMs.find((x) => x.id === id) ||
          (await api("GET", `/assembly/bom/${id}`));
        document.getElementById("mBOMDetailTitle").textContent =
          `Formula: ${b.item?.name}`;
        document.getElementById("mBOMDetailBody").innerHTML = `
    <div style="background:var(--primary-light);border-radius:12px;padding:16px;margin-bottom:16px;font-size:15px">
      Menghasilkan <b style="font-size:20px;color:var(--primary)">${b.output_qty} ${b.item?.unit?.abbreviation || "pcs"} ${b.item?.name}</b>
    </div>
    <table class="tbl"><thead><tr><th>Komponen</th><th style="text-align:right">Qty Dipakai</th><th>Satuan</th><th style="text-align:right">HPP per unit</th></tr></thead>
    <tbody>${(b.lines || [])
      .map(
        (l) => `<tr>
      <td><b>${l.item?.name || "-"}</b></td>
      <td style="text-align:right;font-weight:800">${l.qty}</td>
      <td style="color:var(--text-muted)">${l.item?.unit?.abbreviation || "pcs"}</td>
      <td style="text-align:right">${fmtRp((l.item?.buy_price || 0) * l.qty)}</td>
    </tr>`,
      )
      .join("")}</tbody></table>
    <div style="display:flex;justify-content:flex-end;margin-top:12px;font-size:16px;font-weight:800">
      Total HPP per proses: <span style="color:var(--primary);margin-left:12px">${fmtRp((b.lines || []).reduce((a, l) => a + l.qty * (l.item?.buy_price || 0), 0))}</span>
    </div>
    <div style="margin-top:16px;display:flex;gap:10px">
      <button onclick="closeModal('mBOMDetail');openModal('mOrder')" class="btn btn-primary">⚙️ Buat Order Pakai BOM Ini</button>
    </div>`;
        _origOM("mBOMDetail");
      }

      async function editBOM(id) {
        const b =
          allBOMs.find((x) => x.id === id) ||
          (await api("GET", `/assembly/bom/${id}`));
        document.getElementById("bomId").value = b.id;
        document.getElementById("mBOMTitle").textContent = "Edit Formula BOM";
        document.getElementById("bomProd").value = b.item_id;
        document.getElementById("bomQty").value = b.output_qty;
        document.getElementById("komponenRows").innerHTML = "";
        kompIdx = 0;
        (b.lines || []).forEach((l) => addKomponen(l.item_id, l.qty));
        _origOM("mBOM");
      }

      async function hapusBOM(id) {
        if (!(await showConfirm("Hapus formula BOM ini?"))) return;
        try {
          await api("DELETE", `/assembly/bom/${id}`);
          showToast("Dihapus");
          loadBOM();
        } catch (ex) {
          showToast(ex.message, "error");
        }
      }

      async function saveOrder() {
        const bom_id = parseInt(document.getElementById("orderBOM").value);
        if (!bom_id) {
          showToast("Pilih BOM dulu", "error");
          return;
        }
        const qty = parseFloat(document.getElementById("orderQty").value) || 1;
        try {
          showLoading("Membuat order...");
          await api("POST", "/assembly/orders", {
            bom_id,
            qty,
            date: document.getElementById("orderDate").value,
            notes: document.getElementById("orderNote").value || null,
          });
          hideLoading();
          showToast("Order perakitan dibuat ✓");
          closeModal("mOrder");
          switchTab("order");
        } catch (ex) {
          hideLoading();
          showToast(ex.message, "error");
        }
      }

      async function loadOrders() {
        try {
          const d = await api("GET", "/assembly/orders?limit=100");
          const stBadge = (s) =>
            ({
              pending: '<span class="bo">⏳ Menunggu</span>',
              in_progress: '<span class="bl">⚙️ Proses</span>',
              completed:
                '<span style="background:rgba(99,102,241,.15);color:#818cf8;padding:4px 12px;border-radius:8px;font-size:13px;font-weight:700">✓ Selesai</span>',
              cancelled: '<span class="bg">✗ Batal</span>',
            })[s] || s;
          document.getElementById("tblOrder").innerHTML = d.length
            ? d
                .map(
                  (o) => `<tr>
      <td style="font-family:monospace;font-size:13px;color:var(--primary)">${o.number || "-"}</td>
      <td><b>${o.bom?.item?.name || "-"}</b></td>
      <td style="font-size:18px;font-weight:800">${o.qty}</td>
      <td style="font-size:13px;color:var(--text-muted)">${fmtDate(o.date)}</td>
      <td>${stBadge(o.status)}</td>
      <td style="white-space:nowrap">
        ${o.status === "pending" ? `<button class="bsm bl" onclick="startOrder(${o.id})">▶ Mulai</button>` : ""}
        ${o.status === "in_progress" ? `<button class="bsm" style="background:rgba(99,102,241,.15);color:#818cf8" onclick="completeOrder(${o.id})">✓ Selesai</button>` : ""}
        ${o.status !== "completed" ? `<button class="bsm bd" onclick="cancelOrder(${o.id})">Batal</button>` : ""}
      </td></tr>`,
                )
                .join("")
            : '<tr><td colspan="6" style="text-align:center;padding:24px;color:var(--text-muted)">Belum ada order perakitan</td></tr>';
        } catch (ex) {
          showToast(ex.message, "error");
        }
      }

      async function startOrder(id) {
        try {
          await api("PUT", `/assembly/orders/${id}`, { status: "in_progress" });
          showToast("Order dimulai ⚙️");
          loadOrders();
        } catch (ex) {
          showToast(ex.message, "error");
        }
      }
      async function completeOrder(id) {
        if (
          !(await showConfirm(
            "Tandai perakitan selesai? Stok produk akan ditambah, stok bahan dikurangi.",
          ))
        )
          return;
        try {
          showLoading();
          await api("POST", `/assembly/orders/${id}/complete`);
          hideLoading();
          showToast("Perakitan selesai ✓");
          loadOrders();
        } catch (ex) {
          hideLoading();
          showToast(ex.message, "error");
        }
      }
      async function cancelOrder(id) {
        if (!(await showConfirm("Batalkan order perakitan ini?"))) return;
        try {
          await api("PUT", `/assembly/orders/${id}`, { status: "cancelled" });
          showToast("Order dibatalkan");
          loadOrders();
        } catch (ex) {
          showToast(ex.message, "error");
        }
      }

      init();
    </script>
  </body>
</html>
