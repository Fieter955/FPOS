<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Penjualan - FPOS</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="app-container">
      <main class="main-content">
        <button
          class="btn"
          style="
            background: transparent;
            color: var(--text-muted);
            padding: 0;
            margin-bottom: 16px;
          "
          onclick="location.href = '/dashboard'"
        >
          ← Kembali
        </button>
        <div class="pg-header">
          <div>
            <h1>🧾 Riwayat Penjualan</h1>
            <p>Daftar semua transaksi kasir.</p>
          </div>
          <a href="/pos" class="btn btn-primary">➕ Transaksi Baru</a>
        </div>
        <div class="filter-bar">
          <input
            id="fStart"
            type="date"
            class="input-control"
            onchange="load()"
          />
          <input
            id="fEnd"
            type="date"
            class="input-control"
            onchange="load()"
          />
          <select id="fStatus" class="input-control" onchange="load()">
            <option value="">Semua Status</option>
            <option value="paid">Lunas</option>
            <option value="unpaid">Belum Bayar</option>
            <option value="partial">Sebagian</option>
          </select>
        </div>
        <div
          id="summaryRow"
          style="
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 14px;
            margin-bottom: 20px;
          "
        ></div>
        <div class="tbl-wrap">
          <table class="tbl">
            <thead>
              <tr>
                <th>No. Nota</th>
                <th>Tanggal</th>
                <th>Pelanggan</th>
                <th>Metode</th>
                <th>Total</th>
                <th>Status</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="tblBody"></tbody>
          </table>
        </div>
      </main>
    </div>

    <!-- Detail Modal -->
    <div class="modal-overlay" id="mDetail">
      <div class="modal-box wide">
        <div class="modal-hdr">
          <h2 id="mDetailTitle">Detail Penjualan</h2>
          <button class="btn-x" onclick="closeModal('mDetail')">×</button>
        </div>
        <div id="mDetailBody"></div>
      </div>
    </div>

    <!-- Bayar Modal -->
    <div class="modal-overlay" id="mBayar">
      <div class="modal-box">
        <div class="modal-hdr">
          <h2>💸 Bayar Piutang</h2>
          <button class="btn-x" onclick="closeModal('mBayar')">×</button>
        </div>
        <input type="hidden" id="bayarId" />
        <div
          id="bayarInfo"
          style="
            background: var(--bg-color);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 16px;
            font-size: 15px;
          "
        ></div>
        <div class="input-group">
          <label>Jumlah Bayar (Rp)</label
          ><input
            type="number"
            id="bayarAmt"
            class="input-control"
            min="0"
            inputmode="numeric"
          />
        </div>
        <div class="input-group">
          <label>Catatan</label
          ><input
            type="text"
            id="bayarNote"
            class="input-control"
            placeholder="Opsional"
          />
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px">
          <button
            onclick="closeModal('mBayar')"
            class="btn"
            style="
              background: var(--bg-color);
              border: 1px solid var(--border-color);
              color: var(--text-main);
            "
          >
            Batal
          </button>
          <button onclick="doBayar()" class="btn btn-primary">✓ Bayar</button>
        </div>
      </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/print.js"></script>
    <script>
      requireAuth();
      const sb = (s) =>
        ({
          paid: '<span class="bl">✓ Lunas</span>',
          unpaid: '<span class="br">✗ Belum</span>',
          partial: '<span class="bo">~ Sebagian</span>',
        })[s] || `<span class="bg">${s || "-"}</span>`;
      const pm = (m) =>
        ({ cash: "💵 Cash", transfer: "🏦 Transfer", card: "💳 Kartu" })[m] ||
        m ||
        "-";
      async function load() {
        const s = document.getElementById("fStart").value,
          e = document.getElementById("fEnd").value,
          st = document.getElementById("fStatus").value;
        let url = "/sales/?limit=300";
        if (s) url += `&start_date=${s}`;
        if (e) url += `&end_date=${e}`;
        if (st) url += `&status=${st}`;
        try {
          const d = await api("GET", url);
          const tot = d.reduce((a, x) => a + x.total, 0);
          const cash = d
            .filter((x) => x.payment_method === "cash")
            .reduce((a, x) => a + x.total, 0);
          const tfr = d
            .filter((x) => x.payment_method === "transfer")
            .reduce((a, x) => a + x.total, 0);
          document.getElementById("summaryRow").innerHTML = `
      <div class="card" style="padding:18px"><div style="font-size:13px;color:var(--text-muted);margin-bottom:4px">Total Omzet</div><div style="font-size:22px;font-weight:800;color:var(--primary)">${fmtRp(tot)}</div><div style="font-size:13px;color:var(--text-muted)">${d.length} transaksi</div></div>
      <div class="card" style="padding:18px"><div style="font-size:13px;color:var(--text-muted);margin-bottom:4px">💵 Cash</div><div style="font-size:22px;font-weight:800">${fmtRp(cash)}</div></div>
      <div class="card" style="padding:18px"><div style="font-size:13px;color:var(--text-muted);margin-bottom:4px">🏦 Transfer</div><div style="font-size:22px;font-weight:800">${fmtRp(tfr)}</div></div>`;
          document.getElementById("tblBody").innerHTML = d.length
            ? d
                .map(
                  (p) => `<tr>
      <td style="font-family:monospace;font-size:13px;font-weight:700;color:var(--primary)">${p.number}</td>
      <td style="font-size:13px">${fmtDate(p.date)}</td>
      <td>${p.customer?.name || "Umum"}</td>
      <td>${pm(p.payment_method)}</td>
      <td style="font-weight:700">${fmtRp(p.total)}</td>
      <td>${sb(p.status)}</td>
      <td style="white-space:nowrap">
        <button class="bsm bv" onclick="showDetail(${p.id})">Detail</button>
        <button class="bsm be" onclick="cetakNota(${p.id})">🖨️</button>
        ${p.status !== "paid" ? `<button class="bsm bp" onclick="openBayar(${p.id},${p.total},${p.paid || 0})">Bayar</button>` : ""}
        <button class="bsm bd" onclick="hapus(${p.id})">Batalkan</button>
      </td></tr>`,
                )
                .join("")
            : "<tr><td colspan='7' style='text-align:center;padding:24px;color:var(--text-muted)'>Tidak ada data</td></tr>";
        } catch (e) {
          showToast(e.message, "error");
        }
      }

      async function showDetail(id) {
        try {
          const s = await api("GET", `/sales/${id}`);
          const canViewMargin = (s.items || []).some(
            (item) =>
              item &&
              (Object.prototype.hasOwnProperty.call(item, "margin_percent") ||
                Object.prototype.hasOwnProperty.call(item, "margin_amount") ||
                Object.prototype.hasOwnProperty.call(item, "buy_price")),
          );
          const marginTotal = (s.items || []).reduce(
            (sum, item) => sum + (item.margin_amount || 0),
            0,
          );
          const marginColumns = canViewMargin
            ? '<th style="text-align:right">Margin / Item</th><th style="text-align:right">Total Margin</th>'
            : "";
          document.getElementById("mDetailTitle").textContent =
            `Faktur ${s.number}`;
          document.getElementById("mDetailBody").innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px">
        <div><div style="font-size:13px;color:var(--text-muted)">Tanggal</div><div style="font-weight:700">${fmtDate(s.date)}</div></div>
        <div><div style="font-size:13px;color:var(--text-muted)">Pelanggan</div><div style="font-weight:700">${s.customer?.name || "Umum"}</div></div>
        <div><div style="font-size:13px;color:var(--text-muted)">Metode</div><div style="font-weight:700">${pm(s.payment_method)}</div></div>
        <div><div style="font-size:13px;color:var(--text-muted)">Status</div>${sb(s.status)}</div>
      </div>
      <table class="tbl" style="margin-bottom:16px">
        <thead><tr><th>Barang</th><th style="text-align:right">Qty</th><th style="text-align:right">Harga</th>${marginColumns}<th style="text-align:right">Total</th></tr></thead>
        <tbody>${(s.items || [])
          .map(
            (i) => {
              const unitMargin =
                i.qty > 0 ? (i.margin_amount || 0) / i.qty : i.margin_amount || 0;
              const marginColor = (i.margin_amount || 0) >= 0 ? "#10b981" : "#ef4444";
              const marginCells = canViewMargin
                ? `<td style="text-align:right;color:${marginColor};font-weight:700">${fmtRp(unitMargin)}<div style="font-size:11px;color:var(--text-muted)">${(i.margin_percent || 0).toFixed(1)}%</div></td><td style="text-align:right;color:${marginColor};font-weight:800">${fmtRp(i.margin_amount || 0)}</td>`
                : "";
              return `<tr>
          <td>${i.item?.name || "-"}</td>
          <td style="text-align:right">${i.qty}</td>
          <td style="text-align:right">${fmtRp(i.sell_price)}</td>
          ${marginCells}
          <td style="text-align:right;font-weight:700">${fmtRp(i.total)}</td>
        </tr>`;
            },
          )
          .join("")}</tbody>
      </table>
      <div style="background:var(--bg-color);border-radius:12px;padding:16px">
        <div style="display:flex;justify-content:space-between;margin-bottom:8px"><span>Subtotal</span><span>${fmtRp(s.subtotal)}</span></div>
        ${canViewMargin ? `<div style="display:flex;justify-content:space-between;margin-bottom:8px;color:${marginTotal >= 0 ? "#10b981" : "#ef4444"};font-weight:800"><span>Total Margin Barang</span><span>${fmtRp(marginTotal)}</span></div>` : ""}
        ${s.discount > 0 ? `<div style="display:flex;justify-content:space-between;margin-bottom:8px"><span>Diskon</span><span>-${fmtRp(s.discount)}</span></div>` : ""}
        ${s.tax > 0 ? `<div style="display:flex;justify-content:space-between;margin-bottom:8px"><span>PPN</span><span>${fmtRp(s.tax)}</span></div>` : ""}
        <div style="display:flex;justify-content:space-between;font-size:20px;font-weight:900;border-top:1px solid var(--border-color);padding-top:10px;margin-top:6px"><span>TOTAL</span><span style="color:var(--primary)">${fmtRp(s.total)}</span></div>
        <div style="display:flex;justify-content:space-between;margin-top:8px"><span>Dibayar</span><span>${fmtRp(s.paid)}</span></div>
        <div style="display:flex;justify-content:space-between;margin-top:4px;font-weight:700;color:#10b981"><span>Kembalian</span><span>${fmtRp(s.change || 0)}</span></div>
      </div>
      <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">
        <button onclick="cetakNota(${s.id})" class="btn" style="background:var(--bg-color);border:1px solid var(--border-color)">🖨️ Cetak Ulang</button>
        <button onclick="hapus(${s.id})" class="btn-danger">🗑 Batalkan</button>
      </div>`;
          openModal("mDetail");
        } catch (e) {
          showToast(e.message, "error");
        }
      }

      async function cetakNota(id) {
        try {
          const s = await api("GET", `/sales/${id}`);
          printReceipt(s);
        } catch (e) {
          showToast(e.message, "error");
        }
      }

      function openBayar(id, total, paid) {
        document.getElementById("bayarId").value = id;
        const sisa = total - (paid || 0);
        document.getElementById("bayarInfo").innerHTML = `
    <div style="display:flex;justify-content:space-between;margin-bottom:6px"><span>Total</span><b>${fmtRp(total)}</b></div>
    <div style="display:flex;justify-content:space-between;margin-bottom:6px"><span>Sudah Bayar</span><b style="color:#10b981">${fmtRp(paid || 0)}</b></div>
    <div style="display:flex;justify-content:space-between;font-size:18px;font-weight:800;border-top:1px solid var(--border-color);padding-top:8px"><span>Sisa</span><b style="color:#ef4444">${fmtRp(sisa)}</b></div>`;
        document.getElementById("bayarAmt").value = sisa;
        document.getElementById("bayarNote").value = "";
        openModal("mBayar");
      }

      async function doBayar() {
        const id = document.getElementById("bayarId").value,
          amt = parseFloat(document.getElementById("bayarAmt").value) || 0;
        if (!amt) {
          showToast("Jumlah harus diisi", "error");
          return;
        }
        try {
          showLoading();
          await api("POST", `/sales/${id}/pay`, {
            amount: amt,
            notes: document.getElementById("bayarNote").value,
          });
          hideLoading();
          showToast("Pembayaran berhasil ✓");
          closeModal("mBayar");
          load();
        } catch (e) {
          hideLoading();
          showToast(e.message, "error");
        }
      }

      async function hapus(id) {
        if (
          !(await showConfirm(
            "Batalkan transaksi ini?\nStok barang akan dikembalikan.",
          ))
        )
          return;
        try {
          showLoading();
          await api("POST", `/sales/${id}/cancel`);
          hideLoading();
          showToast("Transaksi berhasil dibatalkan");
          closeModal("mDetail");
          load();
        } catch (e) {
          hideLoading();
          showToast(e.message, "error");
        }
      }

      document.getElementById("fStart").value = new Date(new Date().setDate(1))
        .toISOString()
        .slice(0, 10);
      document.getElementById("fEnd").value = today();
      load();
    </script>
  </body>
</html>
