<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Shift Kasir - iPos 5.0</title>
    <link rel="stylesheet" href="/css/style.css" />
    <style>
      /* Perbaikan tombol Modern & Responsif */
      .btn-tutup-shift {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.75rem 1rem; /* Gunakan padding, bukan height kaku */
        width: 100%;
        height: auto !important; /* Biarkan tinggi menyesuaikan teks */
        background-color: #ef4444; /* Warna Danger */
        color: #ffffff;
        border: none;
        border-radius: 0.75rem;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        line-height: 1.4; /* Memberi ruang jika teks jadi 2 baris */
        transition: opacity 0.2s;
      }
      .btn-tutup-shift:hover {
        opacity: 0.9;
      }

      /* Styling tambahan agar card lebih manis */
      .shift-stat-box {
        background: var(--bg-color);
        padding: 1.2rem;
        border-radius: 13px;
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div class="app-container">
      <main class="main-content" style="max-width: 860px; margin: 0 auto">
        <button
          class="btn"
          style="
            background: transparent;
            color: var(--text-muted);
            padding: 0;
            margin-bottom: 16px;
          "
          onclick="location.href = '/dashboard'"
        >
          ← Kembali
        </button>
        <h1 style="margin-bottom: 24px">🕒 Shift Kasir</h1>

        <div class="card" id="shiftCard" style="margin-bottom: 24px">
          <div
            id="loadingArea"
            style="text-align: center; padding: 24px; color: var(--text-muted)"
          >
            Memuat status shift...
          </div>

          <div
            id="noShift"
            style="display: none; text-align: center; padding: 24px"
          >
            <div style="font-size: 56px; margin-bottom: 14px">🔐</div>
            <h2>Shift Belum Dibuka</h2>
            <p style="color: var(--text-muted)">
              Hitung uang di laci kasir, masukkan sebagai modal awal.
            </p>
            <div
              class="input-group"
              style="max-width: 300px; margin: 20px auto; text-align: left"
            >
              <label>Modal Awal (Rp)</label>
              <input
                type="number"
                id="openingCash"
                class="input-control"
                value="0"
                min="0"
                inputmode="numeric"
                style="font-size: 20px; font-weight: 700; text-align: right"
              />
            </div>
            <button
              class="btn btn-primary"
              style="
                width: 100%;
                max-width: 300px;
                height: 52px;
                font-size: 17px;
              "
              onclick="bukaShift()"
            >
              🔓 Buka Shift Sekarang
            </button>
          </div>

          <div id="aktifShift" style="display: none">
            <div
              style="
                display: flex;
                align-items: center;
                gap: 14px;
                margin-bottom: 20px;
              "
            >
              <span style="font-size: 40px">🔓</span>
              <div>
                <h2 style="margin: 0; color: #10b981">Shift Sedang Aktif</h2>
                <div
                  id="shiftOpenTime"
                  style="
                    font-size: 14px;
                    color: var(--text-muted);
                    margin-top: 2px;
                  "
                ></div>
              </div>
            </div>

            <div
              style="
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 14px;
                margin-bottom: 22px;
              "
            >
              <div class="shift-stat-box">
                <div
                  style="
                    font-size: 12px;
                    color: var(--text-muted);
                    margin-bottom: 4px;
                  "
                >
                  Kasir
                </div>
                <div
                  id="sKasir"
                  style="font-size: 16px; font-weight: 800"
                ></div>
              </div>
              <div class="shift-stat-box">
                <div
                  style="
                    font-size: 12px;
                    color: var(--text-muted);
                    margin-bottom: 4px;
                  "
                >
                  Modal Awal
                </div>
                <div
                  id="sModal"
                  style="font-size: 16px; font-weight: 800"
                ></div>
              </div>
              <div class="shift-stat-box">
                <div
                  style="
                    font-size: 12px;
                    color: var(--text-muted);
                    margin-bottom: 4px;
                  "
                >
                  Total Penjualan
                </div>
                <div
                  id="sSales"
                  style="font-size: 16px; font-weight: 800; color: #10b981"
                ></div>
              </div>
              <div class="shift-stat-box">
                <div
                  style="
                    font-size: 12px;
                    color: var(--text-muted);
                    margin-bottom: 4px;
                  "
                >
                  Transaksi
                </div>
                <div id="sTrx" style="font-size: 16px; font-weight: 800"></div>
              </div>
            </div>

            <button class="btn-tutup-shift" onclick="openTutupModal()">
              <span>🔒</span> Tutup Shift & Hitung Kas
            </button>
          </div>
        </div>

        <div class="card" style="overflow: hidden">
          <div
            style="
              padding: 16px 20px;
              border-bottom: 1px solid var(--border-color);
              font-size: 16px;
              font-weight: 800;
            "
          >
            📋 Riwayat Shift
          </div>
          <div class="tbl-wrap">
            <table class="tbl">
              <thead>
                <tr>
                  <th>Kasir</th>
                  <th>Dibuka</th>
                  <th>Ditutup</th>
                  <th>Total Jual</th>
                  <th>Selisih</th>
                  <th>Status</th>
                  <th>Cetak</th>
                </tr>
              </thead>
              <tbody id="tblShift"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>

    <div class="modal-overlay" id="mTutup">
      <div class="modal-box">
        <div class="modal-hdr">
          <h2>🔒 Tutup Shift</h2>
          <button class="btn-x" onclick="closeModal('mTutup')">×</button>
        </div>
        <div
          id="summaryTutup"
          style="
            background: var(--bg-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            font-size: 15px;
          "
        ></div>
        <div class="input-group">
          <label>Kas Aktual di Laci (hitung fisik)</label>
          <input
            type="number"
            id="closingCash"
            class="input-control"
            value="0"
            min="0"
            inputmode="numeric"
            style="font-size: 20px; font-weight: 700; text-align: right"
            oninput="hitungSelisih()"
          />
        </div>
        <div
          id="selisihInfo"
          style="
            font-size: 18px;
            font-weight: 800;
            text-align: center;
            padding: 12px;
            border-radius: 12px;
            background: var(--bg-color);
            margin-bottom: 16px;
          "
        >
          —
        </div>
        <div class="input-group">
          <label>Catatan</label
          ><textarea id="closeNotes" class="input-control" rows="2"></textarea>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px">
          <button
            onclick="closeModal('mTutup')"
            class="btn"
            style="
              background: var(--bg-color);
              border: 1px solid var(--border-color);
              color: var(--text-main);
            "
          >
            Batal
          </button>
          <button
            onclick="tutupShift()"
            class="btn-tutup-shift"
            style="width: auto"
          >
            Tutup Shift
          </button>
        </div>
      </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/print.js"></script>
    <script>
      requireAuth();
      let curShift = null,
        sysCash = 0;

      async function init() {
        try {
          curShift = await api("GET", "/shifts/current");
          document.getElementById("loadingArea").style.display = "none";
          if (!curShift) {
            document.getElementById("noShift").style.display = "block";
          } else {
            document.getElementById("aktifShift").style.display = "block";
            const nama =
              curShift.user_name ||
              curShift.user?.username ||
              curShift.user?.full_name ||
              "Kasir";
            document.getElementById("sKasir").textContent = nama;
            document.getElementById("sModal").textContent = fmtRp(
              curShift.opening_cash || 0,
            );
            document.getElementById("sSales").textContent = fmtRp(
              curShift.total_sales || 0,
            );
            document.getElementById("sTrx").textContent =
              (curShift.transaction_count || 0) + " trx";
            if (curShift.opened_at)
              document.getElementById("shiftOpenTime").textContent =
                "Dibuka: " +
                new Date(curShift.opened_at).toLocaleString("id-ID");
          }
        } catch (e) {
          document.getElementById("loadingArea").style.color = "#ef4444";
          document.getElementById("loadingArea").textContent =
            "Gagal memuat: " + e.message;
        }
        loadHistory();
      }

      async function bukaShift() {
        const cash =
          parseFloat(document.getElementById("openingCash").value) || 0;
        try {
          showLoading("Membuka shift...");
          await api("POST", "/shifts/open", { opening_cash: cash });
          hideLoading();
          showToast("Shift berhasil dibuka! 🔓");
          location.reload();
        } catch (e) {
          hideLoading();
          showToast(e.message, "error");
        }
      }

      function hitungSelisih() {
        if (!curShift) return;
        sysCash =
          (curShift.opening_cash || 0) + (curShift.total_cash_sales || 0);
        const closing =
          parseFloat(document.getElementById("closingCash").value) || 0;
        const selisih = closing - sysCash;
        const el = document.getElementById("selisihInfo");
        if (selisih === 0) {
          el.textContent = "✓ Tepat Pas";
          el.style.color = "#10b981";
          el.style.background = "rgba(16,185,129,.1)";
        } else if (selisih > 0) {
          el.textContent = "▲ Lebih " + fmtRp(selisih);
          el.style.color = "#3b82f6";
          el.style.background = "rgba(59,130,246,.1)";
        } else {
          el.textContent = "▼ Kurang " + fmtRp(Math.abs(selisih));
          el.style.color = "#ef4444";
          el.style.background = "rgba(239,68,68,.1)";
        }
      }

      function openTutupModal() {
        if (!curShift) return;
        sysCash =
          (curShift.opening_cash || 0) + (curShift.total_cash_sales || 0);
        document.getElementById("summaryTutup").innerHTML = `
    <div style="display:flex;justify-content:space-between;margin-bottom:8px"><span>Modal Awal</span><b>${fmtRp(curShift.opening_cash || 0)}</b></div>
    <div style="display:flex;justify-content:space-between;margin-bottom:8px"><span>+ Cash Penjualan</span><b>${fmtRp(curShift.total_cash_sales || 0)}</b></div>
    <div style="display:flex;justify-content:space-between;font-size:17px;font-weight:900;border-top:1px solid var(--border-color);padding-top:10px;margin-top:6px">
      <span>💰 Kas Sistem</span><b>${fmtRp(sysCash)}</b>
    </div>`;
        document.getElementById("closingCash").value = sysCash;
        document.getElementById("closeNotes").value = "";
        hitungSelisih();
        openModal("mTutup");
      }

      async function tutupShift() {
        if (
          !(await showConfirm(
            "Tutup shift sekarang?\nPastikan semua transaksi sudah selesai.",
          ))
        )
          return;
        const closing =
          parseFloat(document.getElementById("closingCash").value) || 0;
        try {
          showLoading("Menutup shift...");
          const result = await api("POST", `/shifts/${curShift.id}/close`, {
            closing_cash: closing,
            notes: document.getElementById("closeNotes").value || null,
          });
          hideLoading();
          showToast("Shift ditutup! 🔒");
          closeModal("mTutup");
          if (confirm("Cetak laporan shift?")) printShiftReport(result);
          location.reload();
        } catch (e) {
          hideLoading();
          showToast(e.message, "error");
        }
      }

      async function loadHistory() {
        try {
          const list = await api("GET", "/shifts/?limit=20");
          document.getElementById("tblShift").innerHTML = list
            .map((s) => {
              const isOpen =
                s.status === "open" ||
                (!s.closed_at && !s.status) ||
                s.status === null;
              return `<tr>
        <td><b>${s.user_name || s.user?.username || "-"}</b></td>
        <td style="font-size:13px">${s.opened_at ? new Date(s.opened_at).toLocaleString("id-ID") : "-"}</td>
        <td style="font-size:13px">${s.closed_at ? new Date(s.closed_at).toLocaleString("id-ID") : "—"}</td>
        <td style="color:#10b981;font-weight:700">${fmtRp(s.total_sales || 0)}</td>
        <td style="font-weight:700;color:${(s.difference || 0) < 0 ? "#ef4444" : (s.difference || 0) > 0 ? "#3b82f6" : "var(--text-muted)"}">
          ${s.difference != null ? fmtRp(s.difference) : "—"}
        </td>
        <td>${isOpen ? '<span class="bl">● Aktif</span>' : '<span class="bg">✓ Tutup</span>'}</td>
        <td>${!isOpen ? `<button class="bsm be" onclick="printShiftData(${s.id})">🖨️ Cetak</button>` : ""}</td>
      </tr>`;
            })
            .join("");
        } catch (e) {
          document.getElementById("tblShift").innerHTML =
            `<tr><td colspan="7" style="text-align:center;padding:20px;color:#ef4444">Gagal: ${e.message}</td></tr>`;
        }
      }

      async function printShiftData(id) {
        try {
          const d = await api("GET", `/shifts/${id}`);
          printShiftReport(d);
        } catch (e) {
          showToast(e.message, "error");
        }
      }

      init();
    </script>
  </body>
</html>
