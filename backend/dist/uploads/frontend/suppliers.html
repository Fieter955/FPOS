<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Supplier - iPos 5.0</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-container"><main class="main-content">
<button class="btn" style="background:transparent;color:var(--text-muted);padding:0;margin-bottom:16px" onclick="location.href='/dashboard'">← Kembali</button>
<div class="pg-header">
  <div><h1>🏭 Data Supplier</h1><p>Daftar pemasok, distributor, dan pabrik.</p></div>
  <button class="btn btn-primary" onclick="openSupModal()">➕ Tambah Supplier</button>
</div>
<div class="filter-bar">
  <input id="srch" type="text" class="input-control" placeholder="🔍 Cari nama supplier..." oninput="load()">
</div>
<div class="tbl-wrap"><table class="tbl">
  <thead><tr><th>Nama Supplier</th><th>Telepon</th><th>Email</th><th>Alamat</th><th>Status</th><th>Aksi</th></tr></thead>
  <tbody id="tblBody"></tbody>
</table></div>
</main></div>

<!-- Modal: Supplier -->
<div class="modal-overlay" id="mSup"><div class="modal-box">
  <div class="modal-hdr"><h2 id="mSupTitle">Tambah Supplier</h2><button class="btn-x" onclick="closeModal('mSup')">×</button></div>
  <input type="hidden" id="sId">
  <div class="input-group"><label>Nama Supplier *</label><input id="sNama" class="input-control" placeholder="PT / CV / Nama Distributor"></div>
  <div class="row2" style="margin-bottom:16px">
    <div class="input-group"><label>Telepon</label><input id="sPhone" class="input-control" inputmode="tel" placeholder="021-xxxxxxx"></div>
    <div class="input-group"><label>Email</label><input id="sEmail" class="input-control" type="email" placeholder="email@supplier.com"></div>
  </div>
  <div class="input-group"><label>Alamat</label><textarea id="sAlamat" class="input-control" rows="2" placeholder="Alamat lengkap supplier"></textarea></div>
  <div class="input-group"><label>Catatan</label><textarea id="sNotes" class="input-control" rows="2" placeholder="Info tambahan, terms pembayaran, dll..."></textarea></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
    <button onclick="closeModal('mSup')" class="btn" style="background:var(--bg-color);border:1px solid var(--border-color);color:var(--text-main)">Batal</button>
    <button onclick="save()" class="btn btn-primary">✓ Simpan</button>
  </div>
</div></div>

<script src="/js/api.js"></script><script src="/js/theme.js"></script>
<script>
requireAuth();
let editId=null;

async function load(){
  const q=document.getElementById('srch').value;
  let url='/suppliers/?limit=200';if(q)url+=`&search=${encodeURIComponent(q)}`;
  try{
    const d=await api('GET',url);
    document.getElementById('tblBody').innerHTML=d.length?d.map(s=>`<tr>
      <td><b style="font-size:16px">${s.name}</b></td>
      <td>${s.phone||'-'}</td>
      <td>${s.email||'-'}</td>
      <td style="font-size:13px;color:var(--text-muted);max-width:200px">${s.address||'-'}</td>
      <td><span style="color:${s.is_active!==false?'#10b981':'#ef4444'};font-weight:700">${s.is_active!==false?'● Aktif':'✗ Nonaktif'}</span></td>
      <td style="white-space:nowrap">
        <button class="bsm be" onclick='editSupplier(${JSON.stringify(s).replace(/"/g,"&quot;")})'>Edit</button>
        <button class="bsm bd" onclick="delSup(${s.id},'${s.name}')">Hapus</button>
        <button class="bsm bv" onclick="lihatPembelian(${s.id},'${s.name}')">Riwayat Beli</button>
      </td></tr>`).join(''):'<tr><td colspan="6" style="text-align:center;padding:24px;color:var(--text-muted)">Belum ada supplier</td></tr>';
  }catch(ex){showToast(ex.message,'error');}
}

function openSupModal(){
  editId=null;document.getElementById('mSupTitle').textContent='Tambah Supplier';
  document.getElementById('sId').value='';
  ['sNama','sPhone','sEmail','sAlamat','sNotes'].forEach(id=>document.getElementById(id).value='');
  openModal('mSup');
}

async function editSupplier(s){
  editId=s.id;document.getElementById('mSupTitle').textContent='Edit Supplier';
  document.getElementById('sId').value=s.id;
  document.getElementById('sNama').value=s.name;
  document.getElementById('sPhone').value=s.phone||'';
  document.getElementById('sEmail').value=s.email||'';
  document.getElementById('sAlamat').value=s.address||'';
  document.getElementById('sNotes').value=s.notes||'';
  openModal('mSup');
}

async function save(){
  const name=document.getElementById('sNama').value.trim();
  if(!name){showToast('Nama wajib diisi','error');return;}
  const data={name,phone:document.getElementById('sPhone').value||null,email:document.getElementById('sEmail').value||null,address:document.getElementById('sAlamat').value||null,notes:document.getElementById('sNotes').value||null};
  try{
    if(editId)await api('PUT',`/suppliers/${editId}`,data);
    else await api('POST','/suppliers/',data);
    showToast('Supplier disimpan ✓');closeModal('mSup');load();
  }catch(ex){showToast(ex.message,'error');}
}

async function delSup(id,name){
  if(!await showConfirm(`Hapus supplier "${name}"?`))return;
  try{await api('DELETE',`/suppliers/${id}`);showToast('Dihapus');load();}
  catch(ex){showToast(ex.message,'error');}
}

async function lihatPembelian(id,name){
  try{
    showLoading('Memuat riwayat...');
    const d=await api('GET',`/purchases/?supplier_id=${id}&limit=50`);
    hideLoading();
    const rows=d.map(p=>`<tr>
      <td style="font-family:monospace;font-size:13px;color:var(--primary)">${p.number}</td>
      <td>${fmtDate(p.date)}</td>
      <td style="font-weight:700">${fmtRp(p.total)}</td>
      <td><span class="${{paid:'bl',unpaid:'br',partial:'bo'}[p.status]||'bg'}">${p.status}</span></td>
    </tr>`).join('');
    // Tampilkan di alert sederhana
    const win=window.open('','_blank','width=600,height=500');
    win.document.write(`<html><head><title>Riwayat Beli - ${name}</title><style>body{font-family:sans-serif;padding:20px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border:1px solid #ddd;text-align:left}th{background:#f5f5f5}h2{margin:0 0 16px}.bl{color:green;font-weight:700}.br{color:red;font-weight:700}.bo{color:orange;font-weight:700}</style></head><body><h2>Riwayat Pembelian: ${name}</h2><table><thead><tr><th>No. Faktur</th><th>Tanggal</th><th>Total</th><th>Status</th></tr></thead><tbody>${rows||'<tr><td colspan="4" style="text-align:center">Belum ada pembelian</td></tr>'}</tbody></table></body></html>`);
    win.document.close();
  }catch(ex){hideLoading();showToast(ex.message,'error');}
}

load();
</script>
</body></html>
